{ id: "loge", t: "faction", src: "LJ", nom: "La Loge des Magiciennes", alias: ["la Loge"],
  role: "Cercle secret de magiciennes",
  resume: "Un cercle secret de magiciennes décidées à tirer les ficelles de la politique.",
  rl: "bapteme-feu",
  rev: "Fondée par Philippa Eilhart dans « Le Baptême du feu », quelques semaines après Thanedd, elle se réunit en secret dans son château de Montecalvo. Pas d'hommes : Philippa les juge incapables de gouverner la magie. On y trouve des magiciennes du Nord, comme Triss, Keira, Margarita Laux-Antille ou Sheala de Tancarville, de Nilfgaard, comme Assire var Anahid et Fringilla Vigo, et des elfes, Francesca Findabair et Ida Emean. Philippa veut placer Ciri sur un trône en la mariant à l'héritier de Kovir, et lui réserve un siège parmi elles. Yennefer, amenée de force, s'échappe en se téléportant grâce à une coquille d'huître.",
  jeu: [
    { c: 0, t: "Dans The Witcher 2, des membres de la Loge ont fait assassiner le roi Demavend par le sorceleur Letho, qui servait en secret Nilfgaard : le meurtre de Foltest leur a aussi été imputé, et les mages du Nord le paient encore." },
    { c: 5, t: "Après la bataille de Kaer Morhen, Geralt cherche des magiciennes pour affronter la Chasse : Philippa, longtemps prisonnière sous forme de chouette, retrouve forme humaine, et Margarita Laux-Antille est tirée des geôles des chasseurs de sorcières. Emhyr promet l'amnistie à celles qui protégeront Ciri." },
    { c: 5, t: "Philippa et Margarita rêvent de rebâtir la Loge et offrent à Ciri d'y siéger, en égale cette fois. Lors de l'assaut final, à Skellige, les magiciennes unissent leurs pouvoirs pour empêcher la Chasse de s'enfuir par magie." }],
  dans: ["bapteme-feu", "tour-hirondelle", "dame-lac"],
  voir: ["philippa", "triss", "francesca", "fringilla", "keira", "yennefer"] },

{ id: "scoiatael", t: "faction", src: "LJ", nom: "Les Scoia'tael", alias: ["les Écureuils", "commandos elfes"],
  role: "Guérilla elfe",
  resume: "Les « Écureuils » : commandos d'elfes et d'autres non-humains qui mènent la guérilla contre les humains du Nord.",
  livres: "On les surnomme les Écureuils pour la queue d'écureuil qu'ils portent au bonnet et pour leur vie dans les forêts. Des elfes surtout, mais aussi des nains, des gnomes, des halfelins et des demi-elfes, réunis en « commandos » qui tendent des embuscades aux convois et aux patrouilles, avec pour mot d'ordre de rejeter les humains à la mer. Dans « Le Sang des elfes », Geralt, Ciri et Triss voyagent avec un convoi de nains qu'ils prennent pour cible. Les rois du Nord leur répondent par la corde, et Nilfgaard les arme en sous-main pour s'en servir comme d'une cinquième colonne.",
  rl: "dame-lac",
  rev: "À Thanedd, Francesca Findabair fait entrer un commando dans le palais au plus fort du coup d'État. Emhyr récompense les elfes en leur rendant Dol Blathanna, mais veut que les combattants continuent de semer le chaos dans le Nord. Après la paix de Cintra, les Scoia'tael se retrouvent abandonnés de tous, condamnés jusque par leur propre reine.",
  jeu: [
    { c: 0, t: "Dans The Witcher 2, Iorveth, chef d'un commando Scoia'tael et vieil ennemi de Vernon Roche, est l'un des deux alliés possibles de Geralt." },
    { c: 0, t: "Au gwynt, les Scoia'tael forment l'un des quatre paquets du jeu de base, avec Nilfgaard, les Royaumes du Nord et les monstres : leur talent est de décider qui joue en premier." }],
  dans: ["sang-elfes", "temps-mepris", "bapteme-feu"],
  voir: ["nilfgaard", "dol-blathanna", "milva", "non-humains", "francesca", "gwynt"] },

{ id: "aen-elle", t: "faction", src: "LJ", nom: "Les Aen Elle", alias: ["le Peuple des Aulnes", "elfes"],
  role: "Elfes d'un autre monde",
  resume: "Le « Peuple des Aulnes », cousins des elfes du monde de Geralt, qui vivent dans un autre univers.",
  livres: "Le « Peuple des Aulnes » vit dans un autre monde, sous le règne du vieux roi Auberon Muircetach, le Roi des Aulnes, qui siège à Tir ná Lia. Ses sages, les Aen Saevherne, savent passer d'un monde à l'autre, et des licornes partagent ces terres. Les Aen Elle tiennent une place importante dans « La Dame du Lac ». Ils se croient supérieurs et, dans leur monde, ont réduit les humains à la servitude.",
  rl: "dame-lac",
  rev: "Ils veulent récupérer le gène de Lara Dorren, perdu dans une lignée humaine : Avallac'h compte que Ciri donne un enfant au roi Auberon. Eredin, qui commande leurs cavaliers, a ses propres ambitions. La mort d'Auberon bouleverse la cour, et Ciri finit par leur échapper grâce aux licornes.",
  jeu: [
    { c: 5, t: "Dans TW3, leur monde est menacé par le Gel Blanc : c'est ce qui pousse la Chasse à traquer Ciri." },
    { c: 5, t: "Selon le jeu, Eredin a empoisonné le roi Auberon pour prendre le pouvoir, et compte se servir de Ciri pour ouvrir à son peuple la route d'un autre monde." }],
  dans: ["dame-lac"],
  voir: ["avallach", "eredin", "auberon", "lara-dorren", "chasse", "tir-na-lia"] },

{ id: "chasse", t: "faction", src: "LJ", nom: "La Chasse sauvage", alias: ["Wild Hunt", "les cavaliers rouges", "la Chasse"],
  role: "Cavaliers de légende",
  resume: "Dans les légendes du Nord, une horde fantôme qui traverse le ciel et enlève les vivants. Sa venue passe pour un présage de guerre.",
  livres: "Dans les légendes du Nord, la Chasse sauvage est une cavalcade de spectres qui traverse le ciel ; la voir passer annonce la guerre, et l'on dit qu'elle emporte ceux qu'elle croise. Ciri la croise dès « Le Temps du mépris » : une menace qui ne cessera plus de la poursuivre.",
  rl: "dame-lac",
  rev: "Dans « La Dame du Lac », on découvre que ce sont des elfes Aen Elle en armure, menés par Eredin.",
  jeu: [
    { c: 0, t: "Principal ennemi de TW3 : la Chasse traque Ciri." },
    { c: 0, t: "Geralt a déjà chevauché avec elle : selon les jeux, il s'est livré à Eredin en échange de la liberté de Yennefer, avant de reparaître, amnésique, au début du premier jeu. The Witcher 2 lève le voile sur cet épisode." },
    { c: 4, t: "Ses chefs sont le roi Eredin, le général Imlerith et le navigateur Caranthir, qui guide les cavaliers d'un monde à l'autre. Un froid mordant accompagne chacune de ses venues, et ses molosses, nés, dit-on, de cristaux de glace magique, courent aux côtés des cavaliers." },
    { c: 5, t: "L'affrontement décisif a lieu sur l'île d'Undvik, à Skellige, où la Chasse débarque de son navire, le Naglfar." }],
  dans: ["temps-mepris", "tour-hirondelle", "dame-lac"],
  voir: ["eredin", "aen-elle", "generaux", "ciri", "gel-blanc", "m-chiens"] },

{ id: "feu-eternel", t: "faction", src: "LJ", nom: "L'Église du Feu éternel", alias: ["Feu éternel", "chasseurs de sorcières"],
  role: "Culte de Novigrad",
  resume: "Une religion née à Novigrad, qui voue un culte à une flamme sacrée et gagne en influence comme en intolérance.",
  livres: "Dans « Le Feu éternel », le culte est déjà puissant à Novigrad. Chappelle, éminence grise du Hiérarque et chef redouté des services secrets de la ville, y proclame que le Feu éternel protège Novigrad des monstres : quiconque prétend avoir vu un doppler en ville est un blasphémateur, et l'aubergiste qui l'a dit croupit en prison. Geralt et Jaskier doivent donc retrouver le doppler Dudu sous son nez.",
  rl: "epee-providence",
  rev: "Chappelle est lui-même un doppler, qui a pris la place du vrai, emporté par une apoplexie, pour vivre en paix en ville. Quant aux marchandises absurdes achetées par Dudu, elles servent à fabriquer les autels du Feu éternel qu'on s'apprête à dresser dans tout Novigrad.",
  jeu: [
    { c: 2, t: "Dans TW3, devenu l'Église du Feu éternel, le culte fait la loi à Novigrad sous le Hiérarque Hemmelfart : ses chasseurs de sorcières, soutenus par le roi Radovid, traquent mages et non-humains et dressent des bûchers sur la grand-place." },
    { c: 2, t: "À son arrivée à Novigrad, Geralt voit Caleb Menge, chef de la garde du Temple et des chasseurs de sorcières, faire brûler un doppler qui avait pris l'apparence de Chappelle, son ancien supérieur." }],
  dans: ["epee-providence"],
  voir: ["novigrad", "triss", "dudu", "radovid", "non-humains"] },

{ id: "vampires", t: "concept", src: "LJ", nom: "Les vampires", alias: ["vampire supérieur", "bruxa"],
  role: "Créatures de la Conjonction",
  resume: "On distingue les vampires inférieurs, bestiaux, et les vampires supérieurs, intelligents et presque indestructibles.",
  livres: "Comme les goules ou les graveirs, les vampires sont des reliques de la Conjonction des Sphères. Les sorceleurs affrontent surtout des vampires bestiaux, mais les vampires supérieurs ressemblent aux humains et les égalent en intelligence. Ils n'ont pas besoin de sang pour vivre : pour eux, c'est une ivresse. Bien des superstitions humaines, l'ail, le soleil, les symboles sacrés, n'y changent rien, et une morsure ne change pas un humain en vampire : on naît vampire.",
  jeu: [
    { d: "bw", c: 0, t: "Blood and Wine est l'extension des vampires : brouxes, alpyres, garkains… et vampires supérieurs." },
    { d: "bw", c: 0, t: "En Toussaint, Regis en est la preuve vivante : même réduit en charpie, un vampire supérieur finit par se régénérer, parfois au bout de plusieurs décennies." }],
  voir: ["conjonction", "dettlaff", "toussaint", "m-vampire", "m-bruxa", "m-katakan"] },

/* ---------- Magie et notions ---------- */
{ id: "conjonction", t: "concept", src: "LJ", nom: "La Conjonction des Sphères", alias: [],
  role: "Catastrophe cosmique",
  resume: "Il y a environ 1 500 ans, des mondes sont entrés en collision, laissant dans celui de Geralt des créatures venues d'ailleurs : goules, graveirs, vampires…",
  livres: "Il y a environ quinze siècles, des sphères, autrement dit des mondes, sont entrées en collision. Quand elles se sont séparées, des créatures venues d'ailleurs sont restées prisonnières de ce monde : goules, graveirs, vampires… Ces « reliques de la Conjonction » sont la raison d'être des sorceleurs, créés pour les combattre. À l'époque de la saga, elles se font de plus en plus rares, et le métier avec elles.",
  jeu: [{ c: 0, t: "Le bestiaire de TW3 y renvoie souvent : nécrophages et vampires y sont présentés comme des créatures arrivées avec la Conjonction." }],
  voir: ["sorceleurs", "vampires", "m-goules", "m-noyeurs"] },

{ id: "sang-ancien", t: "concept", src: "LJ", nom: "Le Sang Ancien", alias: ["Hen Ichaer", "gène de Lara"],
  role: "Héritage elfe",
  resume: "Un gène elfe très rare, hérité de Lara Dorren, qui donne à son porteur un pouvoir sur l'espace et le temps.",
  livres: "Il se transmet dans la lignée de Cintra : Pavetta en manifeste des éclats, Ciri le porte pleinement. C'est ce qui fait d'elle une pièce maîtresse pour tous ceux qui convoitent son destin.",
  rl: "dame-lac",
  rev: "Ciri finit par apprendre à maîtriser ce pouvoir et à voyager entre les mondes et les époques.",
  jeu: [
    { c: 2, t: "Ses pouvoirs trahissent Ciri : dès qu'elle s'en sert, la Chasse la sent. À Velen, après avoir sauvé le Baron d'un basilic en se téléportant, elle doit reprendre la fuite aussitôt." },
    { c: 5, t: "La Chasse convoite ce pouvoir pour ouvrir à son peuple la route d'un autre monde, loin du Gel Blanc. Dans l'acte final, on comprend qu'il pourrait aussi arrêter le Gel lui-même." }],
  dans: ["sang-elfes", "dame-lac"],
  voir: ["lara-dorren", "ciri", "pavetta", "ithlinne", "aen-elle", "chasse"] },

{ id: "loi-surprise", t: "concept", src: "LJ", nom: "La Loi de la Surprise", alias: ["enfant surprise"],
  role: "Coutume ancienne",
  resume: "En échange d'un service, on peut réclamer une chose que l'autre possède sans le savoir encore, souvent un enfant à naître. Le destin, dit-on, lie ensuite les deux parties.",
  livres: "Duny obtient ainsi la main de Pavetta, et Geralt réclame à son tour son paiement à Cintra. Les sorceleurs recrutaient parfois leurs apprentis de cette façon, et une légende veut que les enfants du destin n'aient même pas besoin des mutations. Geralt, lui, affirme ne pas croire au destin.",
  rl: "epee-providence",
  rev: "L'« enfant surprise » de Geralt, c'est Ciri. Revenu à Cintra des années plus tard, il renonce à la réclamer, sans même savoir qu'il s'agit d'une fille. Mais dans « Quelque chose en plus », il invoque de nouveau la Loi auprès d'un marchand, Yurga, à qui il sauve la vie : ce qu'il trouve chez lui sans l'attendre, c'est Ciri, rescapée de Cintra.",
  dans: ["dernier-voeu", "epee-providence"],
  voir: ["duny", "pavetta", "ciri", "sorceleurs", "dernier-voeu", "epee-providence"] },

{ id: "gel-blanc", t: "concept", src: "LJ", nom: "Le Gel Blanc", alias: ["White Frost"],
  role: "Fin des mondes annoncée",
  resume: "Selon la prophétie d'Ithlinne, une glaciation finira par engloutir le monde.",
  livres: "La prophétie d'Ithlinne annonce une ère de guerres et de mépris, puis le Gel Blanc : un froid qui engloutira le monde, avant qu'un monde nouveau ne renaisse, né du Sang Ancien. Les elfes appellent ce temps de la fin Tedd Deireadh. Cité tout au long de la saga, il donne au Sang Ancien une portée qui dépasse les guerres des hommes.",
  jeu: [
    { c: 5, t: "Dans TW3, le Gel Blanc ravage le monde des Aen Elle et menace tous les autres : c'est la raison d'être de la traque menée par la Chasse." },
    { c: 6, t: "Dans le dénouement, Ciri pénètre seule dans le Gel Blanc pour l'arrêter ; selon les choix faits à ses côtés au fil du jeu, elle en revient ou non." }],
  voir: ["ithlinne", "sang-ancien", "aen-elle", "chasse", "ciri"] },

{ id: "sources", t: "concept", src: "L", nom: "Les Sources", alias: [],
  role: "Talents magiques innés",
  resume: "Des personnes nées avec un don magique brut, qui se manifeste de façon incontrôlée.",
  livres: "Le don se manifeste sans prévenir, souvent sous le coup d'une émotion, par de brusques déchaînements de pouvoir. Sans formation, une Source court au-devant de la folie, ou pire : c'est pour former ces enfants que les magiciens ont fondé des écoles comme Aretuza. Dans « Une question de prix », le pouvoir de Pavetta se déchaîne en plein banquet. Triss comprend dans « Le Sang des elfes » que Ciri en est une, d'une puissance hors du commun, et qu'il faut lui apprendre à maîtriser ce don au plus vite.",
  dans: ["sang-elfes"],
  voir: ["ciri", "triss", "pavetta", "sang-ancien"] },

{ id: "epreuve", t: "concept", src: "LJ", nom: "L'Épreuve des Herbes", alias: ["mutations"],
  role: "Rite de mutation",
  resume: "Le rite qui transforme les apprentis en sorceleurs, à grand renfort d'herbes et de décoctions. La plupart des enfants n'y survivent pas.",
  livres: "« Le Sang des elfes » en cite un témoignage glaçant : herbes et élixirs injectés dans les veines, fièvre, convulsions ; la plupart des enfants meurent dès le troisième jour, et ceux qui s'éveillent le septième ont des yeux de vipère. Trois ou quatre sur dix survivent, au mieux. Mis au point par des mages renégats, le secret des mutations s'est perdu quand leurs héritiers ont péri lors des attaques contre les écoles de sorceleurs. Geralt l'a si bien supportée qu'il a subi des mutations supplémentaires, d'où ses cheveux blancs. Ciri, elle, n'y est pas soumise à Kaer Morhen.",
  jeu: [{ c: 4, t: "À Kaer Morhen, faute d'autre moyen de lever la malédiction d'Uma, Yennefer décide de lui faire subir la première phase de l'Épreuve, au grand dam des sorceleurs qui savent ce qu'elle coûte." }],
  dans: ["dernier-voeu", "sang-elfes"],
  voir: ["sorceleurs", "geralt", "kaer-morhen", "uma", "potions"] },

{ id: "signes", t: "concept", src: "LJ", nom: "Les Signes", alias: ["Aard", "Igni", "Yrden", "Quen", "Axii", "Héliotrope"],
  role: "Magie des sorceleurs",
  resume: "Des sorts simples tracés d'un geste de la main : Aard projette une onde de choc, Igni du feu, Yrden pose un piège magique, Quen un bouclier, et Axii agit sur l'esprit.",
  livres: "Dans « Le Sang des elfes », Yennefer explique à Ciri que le Signe d'Aard n'est qu'un sort de psychokinèse très simple : les sorceleurs l'ont adapté parce qu'il ne demande aucune formule, seulement de la concentration et un geste, d'où le nom de Signe. Geralt en use avec parcimonie : Aard contre la stryge ou le djinn, Igni pour un usage aussi prosaïque que réparer une marmite. Il en connaît d'autres, comme l'Héliotrope, qui détourne un sort, ou Somne, qui endort, cité dans « La Saison des orages ».",
  jeu: [
    { c: 0, t: "Dans TW3, chaque signe possède une forme alternative et se renforce dans l'arbre de compétences." },
    { c: 0, t: "Dans le rêve qui ouvre le jeu, l'entraînement que propose Vesemir à Kaer Morhen passe en revue les cinq signes. Plus tard, un Axii bien développé ouvre des répliques de persuasion dans les dialogues." }],
  voir: ["sorceleurs", "medaillon", "vesemir", "m-spectres"] },

{ id: "medaillon", t: "concept", src: "LJ", nom: "Le médaillon", alias: [],
  role: "Insigne des sorceleurs",
  resume: "Chaque sorceleur porte un médaillon à l'effigie de son école, qui vibre en présence de magie.",
  livres: "Celui de Geralt représente une tête de loup. D'argent, il vibre et tire sur sa chaîne en présence de magie : sortilèges, êtres magiques, voire magiciens, précise « Le Sang des elfes ». Pour un sorceleur, c'est un insigne autant qu'un outil.",
  rl: "dame-lac",
  rev: "Leo Bonhart exhibe trois médaillons de sorceleurs, un chat, un griffon et un loup, comme autant de trophées. Après sa mort, Ciri garde le chat et offre le loup à Geralt, dont le sien a été détruit entre-temps.",
  jeu: [
    { c: 0, t: "Dans TW3, le médaillon vibre à l'approche de la magie, mais ce sont surtout les sens de sorceleur qui guident Geralt dans ses enquêtes." },
    { c: 5, t: "Après la bataille de Kaer Morhen, Ciri porte le médaillon de Vesemir ; au sabbat du Mont Chauve, la dernière des Moires le lui arrache en s'enfuyant." }],
  voir: ["sorceleurs", "bonhart", "vesemir", "signes"] },

{ id: "dimeritium", t: "concept", src: "LJ", nom: "Le dimeritium", alias: [],
  role: "Métal anti-magie",
  resume: "Un métal rare qui bloque la magie : on en fait des menottes pour neutraliser les magiciens.",
  livres: "Ce métal rare étouffe la magie. Allié au fer, il sert à forger des menottes qui privent un mage de tout pouvoir, non sans le rendre malade. Les trois quarts du dimeritium extrait dans le monde viennent du royaume de Kovir et Poviss.",
  rl: "temps-mepris",
  rev: "Au matin du conclave de Thanedd, Philippa Eilhart et les hommes de Dijkstra passent des menottes de dimeritium aux magiciens ralliés à Nilfgaard : Artaud Terranova, pris de nausées, se tord de douleur. C'est quand Tissaia de Vries ôte ces entraves que la bataille éclate.",
  jeu: [
    { c: 0, t: "Dans TW3, la bombe de dimeritium affaiblit les créatures magiques et empêche certains ennemis de lancer des sorts." },
    { c: 2, t: "Les chasseurs de sorcières passent des menottes de dimeritium aux mages qu'ils arrêtent ; on en récupère sur leurs corps, et le métal entre dans les meilleures pièces d'équipement de sorceleur." },
    { c: 5, t: "Un anneau de dimeritium suffit à retenir Philippa Eilhart prisonnière de sa forme de chouette." }],
  dans: ["temps-mepris"],
  voir: ["thanedd", "conseil", "philippa", "feu-eternel", "m-golems"] },

{ id: "langue-ancienne", t: "concept", src: "LJ", nom: "La Langue ancienne", alias: ["Hen Llinge", "elfique"],
  role: "Langue des elfes",
  resume: "La langue des elfes, qui a laissé de nombreux noms au monde des humains.",
  livres: "Les elfes la parlent, mais aussi les mages et les savants ; dryades et sirènes la chantent, et le nilfgaardien comme le parler de Skellige en dérivent. Sapkowski l'a forgée surtout à partir des langues celtiques, gallois et irlandais en tête. Quelques mots à retenir : Gwynbleidd, « Loup Blanc » (Geralt) ; Zireael, « hirondelle » (Ciri) ; Dh'oine, « humains » ; Aen Seidhe et Aen Elle, les deux peuples elfes ; Hen Ichaer, le Sang Ancien ; Tedd Deireadh, le temps de la fin ; Va fail, « adieu ».",
  jeu: [
    { c: 3, t: "À Skellige, les insulaires parlent un dialecte dérivé de la Langue ancienne, qu'ils ont plié à leurs usages au fil des siècles." },
    { c: 4, t: "Une quête de Kaer Morhen emprunte son titre à la formule d'adieu elfe, « va fail »." }],
  voir: ["aen-elle", "sang-ancien", "non-humains", "nilfgaard", "skellige"] },

{ id: "potions", t: "concept", src: "LJ", nom: "Les potions", alias: ["Hirondelle", "Chat", "Mouette blanche", "alchimie"],
  role: "Alchimie des sorceleurs",
  resume: "Des élixirs toxiques pour le commun des mortels, que seuls les sorceleurs supportent.",
  livres: "Les livres citent notamment l'Hirondelle, qui accélère la guérison, et le Chat, qui permet de voir dans le noir : de vrais poisons pour qui n'a pas subi les mutations. La Mouette blanche, elle, est un breuvage plus doux, que les sorceleurs boivent coupé d'eau pour s'offrir de beaux rêves, comme on le voit dans « Le Sang des elfes ».",
  jeu: [
    { c: 0, t: "Dans TW3, la toxicité limite le nombre de potions actives, et les décoctions de mutagènes offrent des bonus de longue durée." },
    { c: 0, t: "Une recette fabriquée une fois suffit : la méditation remplit de nouveau les fioles, pour peu qu'on ait un alcool fort en réserve. Le Sang noir fait payer leurs coups aux vampires et aux nécrophages, le Loriot doré protège du poison." }],
  voir: ["sorceleurs", "epreuve", "m-goules", "m-vouivres"] },

/* ---------- Livres ---------- */
{ id: "dernier-voeu", t: "livre", src: "LJ", nom: "Le Dernier Vœu", alias: ["Ostatnie życzenie", "The Last Wish"], ordre: 1,
  genre: "Recueil de nouvelles",
  vo: "Ostatnie życzenie",
  annee: 1993,
  role: "Recueil de nouvelles, 1993",
  resume: "Le point d'entrée idéal : en convalescence au temple de Melitele, Geralt se remémore quelques contrats marquants, de la stryge de Vizima au drame de Blaviken, du banquet de Cintra à sa rencontre avec Yennefer. Sapkowski y détourne des contes connus, de Blanche-Neige à La Belle et la Bête, avec une ironie mordante.",
  nouvelles: [
    { t: "Le Sorceleur", d: "Le roi Foltest promet une fortune à qui délivrera sa fille, changée en stryge." },
    { t: "Un grain de vérité", d: "Un homme métamorphosé en bête vit reclus dans un manoir : une variation sombre de La Belle et la Bête." },
    { t: "Le Moindre Mal", d: "À Blaviken, Geralt se retrouve pris entre le mage Stregobor et Renfri, une princesse déchue qui a juré la perte du mage. Chacun presse le sorceleur de choisir le moindre mal." },
    { t: "Une question de prix", d: "Au banquet de Cintra, un mystérieux chevalier réclame la main de la princesse Pavetta." },
    { t: "Le Bout du monde", d: "Avec Jaskier, Geralt croise un sylvain farceur et des elfes acculés à la survie." },
    { t: "Le Dernier Vœu", d: "Un djinn, une magicienne nommée Yennefer, et un vœu qui change tout." },
    { t: "La Voix de la raison", d: "Le récit-cadre, au temple de Melitele, qui relie les nouvelles entre elles." }],
  rl: "dernier-voeu",
  rev: "Le « paiement » que Geralt réclame à Cintra n'est autre que Ciri, encore à naître. Et son dernier vœu lie à jamais son destin à celui de Yennefer.",
  jeu: [
    { c: 0, t: "Foltest et la Témérie, la cour de Cintra, la naissance du destin de Ciri : bien des fils de TW3 partent de ce recueil." },
    { c: 3, t: "Le druide Sac-à-souris, présent au banquet de Cintra, est celui que Geralt retrouve à Skellige (Ermion dans la version originale du jeu)." },
    { c: 4, t: "Une quête secondaire de Skellige reprend le titre de la nouvelle : Geralt y accompagne Yennefer, partie sur la piste d'un djinn." }],
  voir: ["geralt", "yennefer", "calanthe", "duny", "loi-surprise", "renfri", "nivellen", "blaviken"] },

{ id: "epee-providence", t: "livre", src: "LJ", nom: "L'Épée de la providence", alias: ["Miecz przeznaczenia", "Sword of Destiny"], ordre: 2,
  genre: "Recueil de nouvelles",
  vo: "Miecz przeznaczenia",
  annee: 1992,
  role: "Recueil de nouvelles, 1992",
  resume: "Six nouvelles qui font du destin leur fil rouge : d'une chasse au dragon aux amours d'un duc et d'une sirène, Geralt y traverse des heures orageuses auprès de Yennefer, avant de croiser enfin, dans la forêt des dryades, la route de Ciri.",
  nouvelles: [
    { t: "Les Limites du possible", d: "Une chasse au dragon où chevaliers, mercenaires et magiciens se disputent la bête." },
    { t: "Éclat de glace", d: "Un triangle amoureux entre Geralt, Yennefer et le mage Istredd." },
    { t: "Le Feu éternel", d: "À Novigrad, Jaskier et Geralt démêlent l'imbroglio d'un marchand halfelin… et de son double." },
    { t: "Une once d'abnégation", d: "Une sirène, un duc amoureux et la barde Essi Daven." },
    { t: "L'Épée de la providence", d: "Dans la forêt des dryades, Geralt rencontre une petite fille têtue : Ciri." },
    { t: "Quelque chose en plus", d: "Blessé et fiévreux, Geralt affronte ses souvenirs pendant que Cintra tombe." }],
  rl: "epee-providence",
  rev: "« Quelque chose en plus » se clôt sur les retrouvailles de Geralt et de Ciri après la chute de Cintra : le destin a fini par les réunir.",
  jeu: [
    { c: 0, t: "Au gwynt de TW3, Eithné, la reine des dryades de la nouvelle « L'Épée de la providence », figure parmi les cartes des Scoia'tael." },
    { c: 2, t: "« Le Feu éternel » présente le doppler Dudu, que l'on retrouve à Novigrad." },
    { c: 2, t: "Le culte du Feu éternel, déjà influent à Novigrad dans la nouvelle, y est devenu dans TW3 une Église intolérante, dont les chasseurs de sorcières dressent des bûchers." }],
  voir: ["ciri", "yennefer", "dudu", "brokilon", "borch", "istredd", "essi", "eithne"] },

{ id: "sang-elfes", t: "livre", src: "LJ", nom: "Le Sang des elfes", alias: ["Krew elfów", "Blood of Elves"], ordre: 3,
  genre: "Roman, saga tome 1",
  vo: "Krew elfów",
  annee: 1994,
  role: "Roman, 1994, premier tome de la saga",
  resume: "Premier tome de la saga : tandis que la guerre gronde entre le Nord et Nilfgaard, Geralt cache Ciri à Kaer Morhen, où les sorceleurs l'entraînent, avant que Triss puis Yennefer ne prennent en main ses dons. Des agents mystérieux la traquent, les rois complotent et les commandos elfes ensanglantent les routes.",
  rl: "sang-elfes",
  rev: "Réunis en secret au château de Hagge, les rois du Nord conviennent, sans un mot de protestation, que Ciri doit disparaître pour raison d'État. L'espion Rience, lui, sert un mage puissant dont l'identité reste cachée, et laisse entrevoir une conspiration bien plus vaste.",
  jeu: [
    { c: 0, t: "L'hiver de Ciri à Kaer Morhen résonne avec le rêve qui ouvre TW3." },
    { c: 2, t: "Triss, qui veille sur Ciri dans ce tome, et le maître espion Dijkstra, qui y fait son entrée, comptent parmi les figures majeures de Novigrad dans TW3." },
    { c: 4, t: "Le chapitre de Kaer Morhen réunit les sorceleurs de cet hiver-là : Vesemir, Eskel et Lambert, qui ont vu grandir Ciri." }],
  voir: ["ciri", "kaer-morhen", "triss", "yennefer", "rience"] },

{ id: "temps-mepris", t: "livre", src: "LJ", nom: "Le Temps du mépris", alias: ["Czas pogardy", "Time of Contempt"], ordre: 4,
  genre: "Roman, saga tome 2",
  vo: "Czas pogardy",
  annee: 1995,
  role: "Roman, 1995, deuxième tome de la saga",
  resume: "Tandis que les rois du Nord et Nilfgaard s'observent à la veille d'une nouvelle guerre, les magiciens se réunissent en conclave sur l'île de Thanedd, où Ciri, sous l'aile de Yennefer, doit entrer à l'école d'Aretuza. Geralt les y rejoint, toujours sur la piste de ceux qui traquent Ciri.",
  rl: "temps-mepris",
  rev: "Le conclave tourne au coup d'État : Vilgefortz trahit, Geralt est grièvement blessé et Ciri, à travers un portail instable, est projetée dans un désert. La guerre reprend, et la Ciri qui en ressort n'est plus une enfant protégée.",
  jeu: [
    { c: 0, t: "Ce qui se joue à Thanedd pèse encore sur les rapports entre rois et magiciens : TW3 en montre les conséquences." },
    { c: 1, t: "Keira Metz, qui se cache à Velen dans TW3, compte parmi les invitées du banquet de Thanedd, et le journal du jeu rappelle que Geralt l'y a rencontrée." }],
  voir: ["thanedd", "vilgefortz", "ciri", "conseil"] },

{ id: "bapteme-feu", t: "livre", src: "LJ", nom: "Le Baptême du feu", alias: ["Chrzest ognia", "Baptism of Fire"], ordre: 5,
  genre: "Roman, saga tome 3",
  vo: "Chrzest ognia",
  annee: 1996,
  role: "Roman, 1996, troisième tome de la saga",
  resume: "Depuis Brokilone, Geralt part chercher Ciri à travers un pays ravagé par la guerre, entre villages incendiés et camps de réfugiés, entouré d'une compagnie improbable qui se forme presque malgré lui : Jaskier, l'archère Milva, une troupe de nains, un barbier très singulier et un chevalier nilfgaardien.",
  rl: "bapteme-feu",
  rev: "Les magiciennes fondent la Loge, Geralt gagne au combat son titre « de Riv », et la compagnie découvre que Regis est un vampire supérieur.",
  jeu: [
    { c: 1, t: "Velen est une invention du jeu, mais ses villages pillés, ses déserteurs et ses pendus rappellent le Nord dévasté que traverse la compagnie." },
    { c: 2, t: "Zoltan y fait ses débuts ; on le retrouve à Novigrad." },
    { d: "bw", c: 1, t: "Regis, le barbier-chirurgien, refait surface dans Blood and Wine." }],
  voir: ["milva", "zoltan", "regis", "cahir", "loge", "meve"] },

{ id: "tour-hirondelle", t: "livre", src: "LJ", nom: "La Tour de l'Hirondelle", alias: ["Wieża Jaskółki", "The Tower of the Swallow"], ordre: 6,
  genre: "Roman, saga tome 4",
  vo: "Wieża Jaskółki",
  annee: 1997,
  role: "Roman, 1997, quatrième tome de la saga",
  resume: "Blessée, Ciri est recueillie dans les marais par Vysogota, un vieil ermite à qui elle raconte ce qu'elle a vécu depuis Thanedd. Pendant ce temps, Geralt et sa compagnie poursuivent leur route, et chasseurs de primes comme agents de l'Empire resserrent l'étau autour d'elle.",
  rl: "tour-hirondelle",
  rev: "Ciri survit au massacre des Rats et à Bonhart, puis gagne la tour elfique de Tor Zireael, qui l'emporte hors de son monde. Yennefer, elle, tombe dans le piège de Vilgefortz.",
  jeu: [
    { c: 0, t: "Le parcours de Ciri, seule face au monde, éclaire la jeune femme endurcie que l'on rencontre dans TW3." },
    { c: 3, t: "Crach an Craite et sa forteresse de Kaer Trolde, que l'on découvre à Skellige, font une apparition dans ce tome." }],
  voir: ["ciri", "bonhart", "tor-zireael", "angouleme", "vysogota", "rats"] },

{ id: "dame-lac", t: "livre", src: "LJ", nom: "La Dame du Lac", alias: ["Pani Jeziora", "The Lady of the Lake"], ordre: 7,
  genre: "Roman, saga tome 5",
  vo: "Pani Jeziora",
  annee: 1999,
  role: "Roman, 1999, dernier tome de la saga",
  resume: "Dernier tome de la saga, encadré par deux magiciennes d'un lointain futur qui étudient la légende : la compagnie passe l'hiver en Toussaint, la guerre s'achève à Brenna, Ciri poursuit sa propre odyssée, et toutes les routes convergent vers le repaire de Vilgefortz.",
  rl: "dame-lac",
  rev: "À Stygga, une grande partie de la compagnie tombe ; Geralt tue Vilgefortz, Ciri tue Bonhart, et Emhyr se révèle être le père de Ciri. La paix de Cintra est signée. À Riv, Geralt est grièvement blessé lors d'un pogrom, et Ciri l'emmène avec Yennefer vers une île brumeuse, dans une fin volontairement ambiguë.",
  jeu: [
    { c: 0, t: "Essentiel pour TW3 : Avallac'h, Eredin, les Aen Elle et la Chasse sauvage y prennent toute leur dimension." },
    { c: 5, t: "Avallac'h, figure centrale du livre, garde dans TW3 la même ambiguïté : il protège Ciri, mais pour ses propres desseins." },
    { d: "hos", c: 0, t: "Shani, que le livre montre à l'hôpital de campagne de Brenna, revient dans Hearts of Stone, devenue médecin." },
    { d: "bw", c: 1, t: "L'hiver en Toussaint et la duchesse Anna Henrietta préparent le terrain de Blood and Wine." }],
  voir: ["aen-elle", "avallach", "eredin", "toussaint", "stygga", "brenna", "nimue"] },

{ id: "saison-orages", t: "livre", src: "L", nom: "La Saison des orages", alias: ["Sezon burz", "Season of Storms"], ordre: 8,
  genre: "Roman indépendant",
  vo: "Sezon burz",
  annee: 2013,
  role: "Roman indépendant, 2013",
  resume: "Une aventure à part, située entre les nouvelles du « Dernier Vœu ». À Kerack, Geralt se fait voler ses épées et doit les récupérer, entre une magicienne séduisante, Lytta Neyd, dite Corail, et les mages du château de Rissberg, qui se livrent à des expériences douteuses.",
  voir: ["geralt", "jaskier", "kerack", "nimue"] },

{ id: "croisee", t: "livre", src: "L", nom: "La Croisée des corbeaux", alias: ["Rozdroże kruków", "Crossroads of Ravens"], ordre: 9,
  genre: "Roman, préquelle",
  vo: "Rozdroże kruków",
  annee: 2024,
  role: "Roman, 2024 (en français chez Bragelonne en 2025)",
  resume: "Geralt a dix-huit ans et vient de quitter Kaer Morhen quand un acte de bravoure naïf tourne mal : il n'échappe à la corde que grâce à Preston Holt, un sorceleur au passé trouble qui lui apprend ce que signifie suivre la Voie. Le roman développe un souvenir que Geralt confiait à Iola dans « La Voix de la raison ».",
  voir: ["geralt", "kaer-morhen", "sorceleurs"] },

/* ---------- Ajouts : personnages des nouvelles et de la saga ---------- */
{ id: "visenna", t: "perso", src: "L", nom: "Visenna", alias: [],
  role: "Magicienne guérisseuse, mère de Geralt",
  resume: "Une guérisseuse itinérante, douée pour la magie, qui confia son fils encore tout petit aux sorceleurs de Kaer Morhen.",
  livres: "Druidesse, guérisseuse et magicienne itinérante, elle a confié son fils encore tout petit aux sorceleurs de Kaer Morhen. Geralt ne l'a pratiquement pas connue et n'en parle presque jamais. Dans « Quelque chose en plus », Geralt, qu'on dit volontiers enfant de la Loi de la Surprise, explique à Calanthe qu'il a tout simplement été abandonné par sa mère, une magicienne. Plus tard, blessé et fiévreux, il est soigné une nuit par une guérisseuse : à demi conscient, il comprend que c'est elle. Il voudrait la regarder dans les yeux et lui poser enfin sa question ; elle l'en dissuade doucement, puis disparaît. La blessure de l'abandon refait surface. Une nouvelle écrite avant la saga, « Droga, z której się nie wraca » (« Le Chemin sans retour »), la met en scène aux côtés d'un guerrier, Korin, que l'on tient souvent pour le père de Geralt.",
  dans: ["epee-providence"],
  voir: ["geralt", "kaer-morhen", "sorceleurs", "calanthe", "loi-surprise"] },

{ id: "renfri", t: "perso", src: "L", nom: "Renfri", alias: ["la Pie-grièche"],
  role: "Princesse déchue, cheffe de bande",
  resume: "Princesse chassée par sa belle-mère et traquée par un mage qui la croit maudite, devenue une redoutable cheffe de bande.",
  livres: "Fille du prince de Creyden, Renfri est née juste après l'éclipse du « Soleil noir », qui, selon une prophétie, fait naître des filles porteuses de malheur. Sa belle-mère Aridea et le mage Stregobor ont voulu la supprimer : livrée à un homme de main chargé de la tuer dans la forêt, elle lui a échappé, puis a survécu à la faim, aux tueurs et même à une pomme empoisonnée. Surnommée la Pie-grièche, elle a un temps vécu avec une bande de sept gnomes. Dans « Le Moindre Mal », grande, les cheveux couleur de paille, l'épée au côté, elle arrive à Blaviken avec ses hommes et un sauf-conduit royal, pour en finir avec Stregobor, retranché dans sa tour. Elle propose un marché à Geralt, puis passe la nuit avec lui. Pris entre le mage et la princesse, le sorceleur refuse de choisir le moindre mal.",
  rl: "dernier-voeu",
  rev: "Renfri comptait massacrer les habitants pour forcer Stregobor à sortir de sa tour. Geralt finit par la tuer avec ses hommes sur la place du marché ; mourante, elle lui dit qu'elle le plaint, car il ne saura jamais s'il a fait le bon choix. La foule horrifiée le surnomme le Boucher de Blaviken, une réputation qui le suivra toute sa vie.",
  dans: ["dernier-voeu"],
  voir: ["blaviken", "geralt", "dernier-voeu", "mahakam"] },

{ id: "istredd", t: "perso", src: "L", nom: "Istredd", alias: [],
  role: "Mage et archéologue",
  resume: "Mage érudit, passionné par les vestiges des civilisations disparues, et ancien amant de Yennefer.",
  livres: "Magicien attitré de la ville d'Aedd Gynvael, respecté du bourgmestre comme des voyageurs, il s'appelle en réalité Val. Élève du sévère maître Roedskilde, il a passé sa jeunesse penché sur les grimoires plutôt qu'à boire ou à courtiser. Passionné d'archéologie, il fait creuser près du rempart sud : il y cherche, dit-il, « l'histoire », les réponses à la question de ce qui fut et de ce qui sera. Amant de longue date de Yennefer, qu'il appelle « Yenna », il lui propose de vivre enfin avec lui. Dans « Éclat de glace », Geralt et lui se disputent la magicienne, qui refuse de se laisser attribuer comme un prix. La rivalité des deux hommes les mène jusqu'au défi d'un duel.",
  rl: "epee-providence",
  rev: "Le duel n'a pas lieu : Yennefer, refusant de choisir, quitte la ville et fait porter à chacun une lettre d'adieu par des crécerelles noires nées de sa magie. Désespéré, Istredd se présente au rendez-vous une épée à la main, espérant que Geralt le tuera ; le sorceleur, comprenant qu'elle les a quittés tous les deux, s'en va sans combattre.",
  dans: ["epee-providence"],
  voir: ["yennefer", "geralt", "epee-providence"] },

{ id: "borch", t: "perso", src: "L", nom: "Borch Trois-Choucas", alias: [],
  role: "Chevalier énigmatique",
  resume: "Un noble affable et généreux, escorté de deux guerrières zerrikaniennes, qui se joint à la chasse au dragon des « Limites du possible ».",
  livres: "Il voyage avec deux guerrières zerrikaniennes, Téa et Véa, qu'il appelle ses « armes » : lui-même n'en porte jamais, disant qu'il ne le peut pas, sans s'expliquer davantage. Il fait la connaissance de Geralt après un contrat sur un basilic, l'invite à dîner et l'interroge longuement : le sorceleur ne tue pas les dragons, et tient le dragon d'or pour une pure légende, puisque les mutants sont stériles. Il le prend ensuite pour compagnon de route et observe avec un intérêt troublant la chasse au dragon d'Holopole, où se pressent chevaliers, nains, mercenaires et magiciens, Yennefer comprise.",
  rl: "epee-providence",
  rev: "Borch est Villentretenmerth, dont le nom signifie « Trois oiseaux noirs » : un dragon d'or capable de prendre forme humaine, la plus rare des créatures. Il est venu défendre la dragonne verte traquée et son petit tout juste éclos. Il défait en combat loyal le chevalier Eyck de Denesle, puis disperse les chasseurs, avant de s'envoler avec le nouveau-né.",
  dans: ["epee-providence"],
  voir: ["m-dragon", "yennefer", "geralt", "jaskier", "epee-providence"] },

{ id: "essi", t: "perso", src: "L", nom: "Essi Daven", alias: ["Petit-Œil"],
  role: "Barde, amie de Jaskier",
  resume: "Jeune poétesse au talent éclatant, qui accompagne Jaskier et Geralt dans « Une once d'abnégation ».",
  livres: "Poétesse au talent éclatant, amie et rivale de Jaskier, qui la traite en petite sœur, elle est l'une des rares femmes qu'il n'ait jamais tenté de séduire. On la surnomme Petit-Œil : une mèche dorée cache presque toujours l'un de ses grands yeux bleus. Dans « Une once d'abnégation », à Bremervoord, elle tient tête au duc Agloval, épris d'une sirène, parle couramment la Langue ancienne et s'éprend de Geralt, qui reste attaché à Yennefer. Elle porte ensuite en pendentif une perle bleue sertie dans une fleur d'argent. Ses ballades sont réunies dans « La Perle bleue », un recueil dont certains vers font pleurer Ciri.",
  rl: "epee-providence",
  rev: "Après une nuit passée ensemble, Geralt et Essi se séparent pour ne jamais se revoir. Quatre ans plus tard, elle meurt de la variole à Vizima ; Jaskier l'enterre avec son luth et sa perle, et ne chantera jamais la ballade qu'il avait écrite sur leur amour.",
  dans: ["epee-providence"],
  voir: ["jaskier", "geralt", "m-sirenes", "yennefer", "epee-providence"] },

{ id: "nivellen", t: "perso", src: "L", nom: "Nivellen", alias: [],
  role: "Homme maudit à tête de bête",
  resume: "Un ancien chef de bande changé en bête par la malédiction d'une prêtresse, qui vit reclus dans son manoir.",
  livres: "Fils et petit-fils de chefs de brigands, Nivellen a pris la tête de la bande à la mort de son père. Lors du pillage d'un temple, poussé par ses hommes, il a abusé d'une jeune prêtresse ; avant de se donner la mort, elle l'a maudit : monstre dans une peau d'homme, il deviendrait monstre dans une peau de monstre. Depuis douze ans, il vit reclus dans son manoir, que ses domestiques ont fui. Dans « Un grain de vérité », Geralt découvre un hôte affable, qui touche sans dommage l'argent et le médaillon : ce n'est pas un monstre, mais un maudit. Nivellen refuse même qu'on lève le sort, car ce corps robuste lui convient mieux que celui, chétif, de sa jeunesse. Comme dans le conte, des marchands lui ont confié leurs filles contre de l'or ; la dernière venue, Vereena, semble l'aimer sincèrement.",
  rl: "dernier-voeu",
  rev: "Vereena est une bruxa, responsable des meurtres qui ensanglantent la région. Geralt la tue ; parce qu'elle l'aimait vraiment, Nivellen retrouve aussitôt forme humaine.",
  dans: ["dernier-voeu"],
  voir: ["geralt", "dernier-voeu"] },

{ id: "eithne", t: "perso", src: "L", nom: "Eithné", alias: [],
  role: "Reine des dryades",
  resume: "Souveraine de Brokilone, gardienne inflexible de la dernière grande forêt des dryades.",
  livres: "Eithné règne sur Brokilone et ses dryades depuis Duén Canell, le cœur de la forêt. Petite et mince comme toutes les dryades, vêtue d'une robe vert clair, elle a le visage grave et dur, les cheveux et les yeux couleur d'argent fondu. Sa haine des humains, qui ont réduit son peuple à cette dernière forêt, ne souffre aucune exception : à qui supplie ou menace, elle répond par une flèche. Les rois voisins, comme Ervyll de Verden, le lui rendent bien. Dans « L'Épée de la providence », Geralt vient lui porter un message du roi Venzlav de Brugge et croise en chemin une petite fille têtue : Ciri. Eithné voudrait en faire une dryade. Geralt retrouve sa forêt au début du « Baptême du feu ».",
  rl: "bapteme-feu",
  rev: "Au terme de « L'Épée de la providence », l'eau de Brokilone reste sans effet sur Ciri : Eithné la laisse choisir entre la forêt et son destin, et Ciri choisit Geralt. Après le coup de Thanedd, la reine accueille le sorceleur grièvement blessé à Brokilone, mais renvoie Triss, qui l'y a conduit.",
  dans: ["epee-providence", "bapteme-feu"],
  voir: ["brokilon", "ciri", "milva", "epee-providence", "scoiatael"] },

{ id: "vysogota", t: "perso", src: "L", nom: "Vysogota de Corvo", alias: [],
  role: "Ermite et ancien savant",
  resume: "Vieil érudit retiré dans les marais, qui recueille Ciri grièvement blessée.",
  livres: "Médecin, chirurgien, alchimiste, historien, philosophe et éthicien, Vysogota de Corvo a enseigné à l'académie d'Oxenfurt et à l'Académie impériale de Nilfgaard. Ses opinions politiques lui ont valu le cachot, puis l'exil : banni de l'Empire, il s'est retiré au fond des marais de Pereplut, en Ebbing, où il vit en ermite du tannage des peaux. Quand l'Empire annexe la région, il choisit de s'y cacher plutôt que de fuir encore. C'est là qu'il recueille Ciri, grièvement blessée, et la soigne. « La Tour de l'Hirondelle » est construit autour de leurs conversations : Ciri lui raconte tout ce qu'elle a vécu depuis Thanedd, et le vieux sceptique lui oppose sa raison. L'une de ses sentences : « Il faut être bien fat en vérité, et manquer terriblement de discernement pour nommer justice le sang qui coule de l'échafaud. »",
  rl: "tour-hirondelle",
  rev: "Peu après le départ de Ciri, la nuit de Saovine, le vieil homme meurt seul sur le sol de sa cabane, tandis qu'une banshee hurle au loin.",
  dans: ["tour-hirondelle"],
  voir: ["ciri", "tour-hirondelle", "nilfgaard", "oxenfurt"] },

{ id: "meve", t: "perso", src: "LJ", nom: "Meve", alias: [],
  role: "Reine de Lyria et de Rivia",
  resume: "Souveraine d'un petit royaume du Nord, pragmatique et intrépide, qui prend elle-même la tête de ses troupes face à Nilfgaard.",
  livres: "Veuve et souveraine d'un petit royaume du Nord, Meve compte parmi les monarques réunis en secret au château de Hagge dans « Le Sang des elfes » : belle, perdue dans ses pensées, elle joue avec les gros rubis de son collier tandis que ses pairs, qui la savent fine mouche, s'en remettent à son intuition. Amie d'enfance de la reine Calanthe, elle raconte comment, un jour, elle a montré à toute sa cour qui régnait, au point d'en faire trembler les murs. Dans « Le Baptême du feu », son royaume envahi, elle endosse l'armure et mène elle-même une guerre de partisans contre l'Empire.",
  rl: "bapteme-feu",
  rev: "Au pont sur la Yaruga, alors que son armée bat en retraite, Geralt et ses compagnons tiennent la position ; elle l'adoube sur-le-champ, et « Geralt de Riv » devient enfin un vrai titre.",
  jeu: [{ c: 0, t: "Héroïne de Thronebreaker (2018), un jeu de rôle et de cartes tiré du gwynt, qui raconte sa guerre contre Nilfgaard." }],
  dans: ["sang-elfes", "bapteme-feu"],
  voir: ["geralt", "yaruga", "royaumes-nord", "gwynt"] },

{ id: "ihuarraquax", t: "perso", src: "L", nom: "Ihuarraquax", alias: [],
  role: "Licorne",
  resume: "Une jeune licorne blessée, que Ciri soigne alors qu'elle-même est perdue.",
  livres: "Une licorne d'un blanc pur, encore poulain lorsque Ciri croise sa route, et qu'elle surnomme « Petit Cheval ».",
  rl: "dame-lac",
  rev: "Dans « Le Temps du mépris », le jeune Ihuarraquax trouve Ciri mourante dans le désert de Korath, la porte à l'abri et la mène à une source. Blessé à son tour par un monstre des sables, il dépérit, et Ciri le sauve en puisant la Force dans le feu, ce que Yennefer lui avait formellement interdit. Dans « La Dame du Lac », Ihuarraquax, devenu adulte, et les siens l'aident à échapper à Eredin et aux Aen Elle.",
  dans: ["temps-mepris", "dame-lac"],
  voir: ["ciri", "korath", "aen-elle", "eredin"] },

/* ---------- Ajouts : personnages propres aux jeux ---------- */
{ id: "roche", t: "perso", src: "J", nom: "Vernon Roche", alias: [], porte: { c: 2 },
  role: "Patriote temérien",
  resume: "Création des jeux : un commandant des forces spéciales temériennes, rugueux et loyal, apparu dans The Witcher 2.",
  jeu: [
    { c: 2, t: "Ancien chef des Stries bleues, les forces spéciales du roi Foltest, il mène depuis une grotte proche d'Oxenfurt la guérilla d'une Témérie occupée. Il dépend de l'aide de la Rédanie, ce qui ne l'enchante guère." },
    { c: 4, t: "Si Geralt l'a aidé à ramener à l'obéissance sa subordonnée Ves, qui attaquait les Nilfgaardiens sans son accord, Roche vient combattre la Chasse à Kaer Morhen. Si Letho y est aussi, Roche et Ves reprochent à Geralt d'avoir invité l'assassin de Foltest." },
    { c: 5, t: "Roche, qui avait mené Geralt jusqu'à Radovid en personne, juge le roi de plus en plus fou. Convaincu qu'il ne laissera jamais renaître la Témérie, il trame son assassinat avec Dijkstra et Thaler, l'ancien maître espion témérien." },
    { c: 6, t: "Après la mort de Radovid, Thaler révèle l'accord passé avec Nilfgaard : une Témérie libre, vassale de l'Empire. Dijkstra veut alors se débarrasser des Témériens. Si Geralt reste neutre, Roche, Ves et Thaler sont tués ; s'il s'interpose, Nilfgaard gagne la guerre et la Témérie renaît sous la tutelle de l'Empire." }],
  voir: ["royaumes-nord", "foltest", "nilfgaard", "dijkstra", "radovid", "letho"] },

{ id: "letho", t: "perso", src: "J", nom: "Letho de Gulet", alias: ["le Régicide", "le Tueur de rois", "Letho of Gulet"], porte: { c: 1 },
  role: "Sorceleur de l'école de la Vipère",
  resume: "Création des jeux : un sorceleur colossal, assassin de rois et grand antagoniste de The Witcher 2.",
  jeu: [
    { c: 1, t: "Dans The Witcher 2, il a tué les rois Demavend et Foltest pour le compte d'Emhyr, qui lui avait promis de relever l'école de la Vipère, détruite par l'armée nilfgaardienne. Lui et deux de ses frères avaient jadis sauvé la vie de Yennefer." },
    { c: 1, t: "Emhyr a renié sa promesse : témoin gênant, Letho est traqué par des chasseurs de primes. Geralt peut le trouver caché dans une ferme abandonnée de Velen, truffée de pièges." },
    { c: 5, t: "Pour semer ses poursuivants, Letho simule sa mort sous leurs yeux, grâce à un poison qui le fait passer pour un cadavre. Si Geralt l'invite à Kaer Morhen, il y combat la Chasse à ses côtés ; sinon, il part pour la Zerrikanie." }],
  voir: ["sorceleurs", "foltest", "roche", "emhyr", "yennefer", "kaer-morhen"] },

{ id: "an-craite", t: "perso", src: "LJ", nom: "Cerys et Hjalmar an Craite", alias: ["Cerys", "Hjalmar"], porte: { c: 3 },
  role: "Enfants du jarl Crach",
  resume: "Les enfants du jarl Crach, candidats au trône de Skellige : Hjalmar, fougueux et avide de gloire, que les livres évoquent déjà, et sa sœur Cerys, création du jeu, fine et réfléchie.",
  livres: "Seul Hjalmar vient des livres. Dans « La Tour de l'Hirondelle », le jarl Crach an Craite se souvient de Ciri, qui a passé une partie de son enfance à Skellige : sur la glace, elle a défié Hjalmar au saut, et lui, pour ne pas être la risée de tous, a tenté un saut plus long encore. Il s'est brisé une jambe, un bras, quatre côtes et le visage, d'où la cicatrice qui lui vaut son surnom. Ciri venait lui faire la lecture à son chevet, et au printemps, Hjalmar a annoncé ses « fiançailles » avec une fillette de onze ans. Depuis, il a combattu Nilfgaard à Marnadal, puis à Sodden.",
  rl: "tour-hirondelle",
  rev: "Quand Yennefer prend la mer depuis Skellige pour retrouver la trace de Ciri, Hjalmar se porte volontaire. Elle refuse de l'emmener à bord de l'Alkyone, avec laquelle elle s'aventure vers le gouffre de Sedna, et menace de l'attacher au mât de la Tamara s'il insiste.",
  jeu: [
    { c: 3, t: "À la mort du roi Bran, le frère et la sœur briguent le trône. Pour s'imposer, Hjalmar part tuer le géant de glace qui a pris l'île d'Undvik, tandis que Cerys veut délivrer le jarl Udalryk, sur Spikeroog, du mal qui le ronge." },
    { c: 4, t: "Hjalmar peut venir combattre la Chasse à Kaer Morhen : de lui-même s'il est roi, envoyé par sa sœur si c'est elle qui porte la couronne." },
    { c: 5, t: "Au banquet de Kaer Trolde, des berserkers changés en ours massacrent les convives. Hjalmar veut venger les morts l'épée à la main, Cerys mène l'enquête avec méthode, et le soutien de Geralt fait pencher l'élection." },
    { c: 6, t: "Si Geralt n'a soutenu personne, l'épilogue est funeste : le frère et la sœur périssent en menant l'une des premières attaques contre la flotte nilfgaardienne." }],
  voir: ["crach", "skellige", "kaer-trolde", "ciri", "m-hym", "tour-hirondelle"] },

/* ---------- Ajouts : lieux ---------- */
{ id: "blaviken", t: "lieu", src: "L", nom: "Blaviken", alias: [],
  role: "Bourgade côtière",
  resume: "Petite ville du bord de mer, où Geralt arrive un jour avec la carcasse d'une kikimorrhe à vendre.",
  livres: "Petite ville portuaire au bord de la Grande Mer. Geralt y arrive avec la carcasse d'une kikimorrhe à vendre et y retrouve un vieil ami, Caldemeyn, qui administre la ville. C'est le cadre du « Moindre Mal » : le mage Stregobor, maître des illusions, s'y terre dans une tour imprenable, tandis que la princesse déchue Renfri, qui a juré sa perte, rôde en ville avec sa bande à l'approche du jour de marché.",
  rl: "dernier-voeu",
  rev: "Le drame qui s'y joue vaut à Geralt le surnom de Boucher de Blaviken.",
  dans: ["dernier-voeu"],
  voir: ["renfri", "geralt", "m-kikimores", "dernier-voeu"] },

{ id: "vengerberg", t: "lieu", src: "L", nom: "Vengerberg", alias: [],
  role: "Capitale de l'Aedirn",
  resume: "Ville royale du royaume d'Aedirn, dont Yennefer porte le nom.",
  livres: "Capitale du royaume d'Aedirn et résidence du roi Demavend, Vengerberg compte parmi les métropoles les plus riches du Nord : un carrefour commercial, avec ses teintureries, ses manufactures de laine, ses malteries et ses distilleries. Yennefer y est née. Elle y a aussi sauvé, lors d'un pogrom, le banquier nain Molnar Giancardi et sa famille, qui le lui rendent depuis par de généreuses donations. L'Aedirn compte parmi les premiers royaumes frappés quand la guerre reprend, après Thanedd.",
  rl: "temps-mepris",
  rev: "Au début de la guerre, l'armée nilfgaardienne assiège Vengerberg plus d'une semaine, puis la prend : Nilfgaardiens et Scoia'tael massacrent la quasi-totalité de ses habitants et de sa garnison, et l'occupant démonte ses manufactures pour les emporter.",
  dans: ["temps-mepris"],
  voir: ["yennefer", "royaumes-nord", "dol-blathanna"] },

{ id: "kerack", t: "lieu", src: "L", nom: "Kerack", alias: [],
  role: "Petit royaume côtier",
  resume: "Royaume marchand en bord de mer, aussi pittoresque que corrompu.",
  livres: "Petit royaume étiré le long de l'Adalatte, entre la Grande Mer et Brokilone, qui vit du commerce et du bois ; son blason montre un dauphin bleu sur fond d'or. Cadre principal de « La Saison des orages » : sous le règne du vieux roi Belohun, dont les fils lorgnent déjà le trône, Geralt y est jeté en prison sur une fausse accusation, puis voit disparaître ses épées. Il y croise la magicienne Lytta Neyd, dite Corail, et un cousin de Jaskier au service du roi.",
  dans: ["saison-orages"],
  voir: ["saison-orages", "geralt", "jaskier", "brokilon"] },

{ id: "brenna", t: "lieu", src: "L", nom: "Brenna", alias: ["bataille de Brenna"],
  role: "Champ de la dernière grande bataille",
  resume: "Une petite localité qui donne son nom à la plus grande bataille de la guerre contre Nilfgaard.",
  livres: "Un village de pêcheurs, près de Maribor, en Témérie, qui donne son nom à la plus grande bataille de la guerre contre Nilfgaard. L'armée du maréchal Menno Coehoorn, renforcée de brigades elfes, y affronte les troupes du Nord, épaulées par des volontaires nains de Mahakam et des mercenaires. « La Dame du Lac » la raconte sous plusieurs angles, notamment depuis un hôpital de campagne où un chirurgien halfelin opère sans relâche, aidé de la jeune Shani et d'une magicienne guérisseuse.",
  rl: "dame-lac",
  rev: "Les armées du Nord y écrasent celles de l'Empire, et la paix de Cintra suit peu après. Le maréchal Coehoorn est tué dans sa fuite par la compagnie de Zoltan Chivay, et le sorceleur Coën compte parmi les morts.",
  dans: ["dame-lac"],
  voir: ["shani", "coen", "nilfgaard", "dame-lac", "zoltan"] },

{ id: "korath", t: "lieu", src: "L", nom: "Le désert de Korath", alias: ["Korath"],
  role: "Désert brûlant",
  resume: "Une étendue aride et brûlante, réputée infranchissable.",
  livres: "Une plaine de pierre gris-rouge, creusée de ravins et hérissée de rochers aux formes étranges, sous un soleil qui jaunit tout le ciel. Le désert s'étend loin au sud-est des Royaumes du Nord, entre l'Empire et la Zerrikanie ; on le dit infranchissable, et quiconque s'y aventure semble promis à mourir de soif, de chaleur ou sous les crocs des monstres qui le hantent.",
  rl: "temps-mepris",
  rev: "Projetée là par le portail de Tor Lara, dans « Le Temps du mépris », Ciri erre sans eau ni vivres, armée d'un simple poignard, et manque d'y mourir de soif, jusqu'à sa rencontre avec une jeune licorne, Ihuarraquax. À la lisière du désert, des chasseurs de primes la capturent.",
  dans: ["temps-mepris"],
  voir: ["ihuarraquax", "thanedd", "ciri"] },

{ id: "yaruga", t: "lieu", src: "LJ", nom: "La Yaruga", alias: ["Iaruga", "Yarouga", "Jaruga"],
  role: "Grand fleuve du Sud",
  resume: "Le grand fleuve qui se jette dans la mer près de Cintra et marque, pour beaucoup, la frontière entre le Nord et l'Empire.",
  livres: "Le plus grand fleuve du Nord coule d'est en ouest jusqu'à la Grande Mer, où Cintra et Verden gardent son embouchure. Depuis la première guerre, il sépare le Nord des terres conquises par Nilfgaard, et « Le Sang des elfes » en fait un obstacle quasi infranchissable : il ne gèle presque jamais, son lit peut atteindre un mille de large à la saison des pluies, et sur une longue distance il coule entre des rives escarpées, au cœur des rocs de Mahakam. La guerre se joue souvent sur ses rives, et ses ponts deviennent des enjeux stratégiques.",
  rl: "bapteme-feu",
  rev: "Au début de la guerre, l'Empire franchit le fleuve et en bloque l'embouchure. Dans « Le Baptême du feu », la compagnie de Geralt, qui cherche à le traverser, se retrouve coincée entre l'armée lyrienne et les Nilfgaardiens au beau milieu d'un pont ; Geralt et Cahir tiennent la position, et la reine Meve adoube Geralt au soir de la bataille.",
  jeu: [{ c: 0, t: "Dans TW3, la guerre a depuis longtemps franchi le fleuve : Nilfgaard occupe la Témérie." }],
  dans: ["bapteme-feu"],
  voir: ["cintra", "meve", "nilfgaard", "sodden", "mahakam"] },

{ id: "kaer-trolde", t: "lieu", src: "LJ", nom: "Kaer Trolde", alias: [], porte: { c: 3 },
  role: "Forteresse du clan an Craite",
  resume: "La forteresse du jarl Crach an Craite, dressée au-dessus du port d'Ard Skellig. Les livres l'évoquent ; le jeu en fait un lieu de premier plan.",
  livres: "« La Tour de l'Hirondelle » compare la ville à un énorme crustacé noir et informe, rejeté sur le rivage par les vagues. Au pied de la citadelle du clan an Craite, le port abrite la flotte du jarl, drakkars et trirèmes, mais aussi des marins, des pêcheurs, des alchimistes, des orfèvres, des souffleurs de verre, des joailliers et même une succursale de la banque naine des Cianfanelli.",
  rl: "tour-hirondelle",
  rev: "Après Thanedd, Yennefer y trouve refuge auprès de Crach an Craite, qui fut jadis son amant, et part de Skellige sur une piste qui doit la mener à Ciri, jusqu'au piège tendu par Vilgefortz.",
  jeu: [
    { c: 3, t: "Le jarl Crach an Craite y embrase le bûcher funéraire du roi Bran, puis convie les clans à un festin dans sa citadelle : c'est là que ceux qui se croient dignes de la couronne doivent se faire connaître." },
    { c: 3, t: "La légende veut que Grymmdjarr, fondateur du clan an Craite, ait taillé de ses mains la forteresse qui domine le port." },
    { c: 4, t: "Le festin des jarls y tourne au carnage : des guerriers changés en ours massacrent les convives, et seuls les prétendants des clans an Craite et Tuirseach en réchappent. Geralt peut aider Cerys ou Hjalmar à laver l'honneur de leur clan." }],
  dans: ["tour-hirondelle"],
  voir: ["crach", "an-craite", "skellige", "yennefer"] },

/* ---------- Ajouts : peuples et notions ---------- */
{ id: "rats", t: "faction", src: "L", nom: "Les Rats", alias: [],
  role: "Bande de jeunes hors-la-loi",
  resume: "Six jeunes brigands de la province de Geso, insolents, cruels et inséparables.",
  livres: "Les Rats ne tuent pas pour le butin mais par jeu, et distribuent leurs rapines aux paysans, qui les cachent volontiers. Ils aiment les tenues voyantes, les bijoux volés, les beaux chevaux et les épées, et méprisent tout le monde. Chacun a été jeté sur les routes par la guerre ou les révoltes : Kayleigh, dont le village a été pillé, et Reef, soldat de l'Empire abandonné blessé par les siens ; Giselher, déserteur devenu leur chef, et l'elfe bannie Iskra, qui l'a sauvé ; Mistle, fille de bonne famille, et Asse, qui l'a recueillie. Les préfets nilfgaardiens mettent leur tête à prix, en vain.",
  rl: "tour-hirondelle",
  rev: "Ciri, rescapée du désert, aide l'un d'eux à se libérer de chasseurs de primes, et la bande l'adopte. Sous le nom de Falka, elle partage leurs pillages, se lie intimement à Mistle et prend goût à la violence. Leo Bonhart finit par massacrer les Rats et capture Ciri.",
  dans: ["temps-mepris", "tour-hirondelle"],
  voir: ["ciri", "bonhart", "tour-hirondelle"] },

{ id: "non-humains", t: "faction", src: "LJ", nom: "Les non-humains", alias: ["nains", "elfes", "gnomes", "halfelins", "Aen Seidhe"],
  role: "Les anciens peuples du continent",
  resume: "Elfes, nains, gnomes et halfelins vivaient sur le continent bien avant l'arrivée des humains, qui les ont peu à peu repoussés.",
  livres: "Les elfes du monde de Geralt, les Aen Seidhe, ont perdu presque toutes leurs terres : dans « Le Bout du monde », Geralt et Jaskier croisent ceux de Filavandrel, réduits à la survie dans les montagnes, et bien des jeunes elfes rejoignent les commandos Scoia'tael. Les nains de Mahakam, forgerons, marchands ou banquiers, ont su se rendre indispensables, comme les gnomes, artisans hors pair, et les halfelins, paysans et commerçants avisés ; aucun n'échappe pour autant au mépris ni aux pogroms. Les elfes appellent les humains Dh'oine, rarement avec tendresse.",
  jeu: [{ c: 2, t: "À Novigrad, les non-humains vivent sous la menace des chasseurs de sorcières et des émeutes : Radovid et l'Église du Feu éternel en ont fait, avec les mages, leurs boucs émissaires." }],
  dans: ["dernier-voeu", "sang-elfes", "bapteme-feu", "dame-lac"],
  voir: ["scoiatael", "mahakam", "dol-blathanna", "aen-elle", "zoltan", "feu-eternel"] },

{ id: "ablette", t: "concept", src: "LJ", nom: "Ablette", alias: ["Roach"],
  role: "La jument de Geralt",
  resume: "Le nom que Geralt donne à toutes ses montures, de livre en livre et de jeu en jeu.",
  livres: "Peu importe la monture : Geralt l'appelle toujours Ablette, et il a une préférence pour les juments. En polonais, elle se nomme Płotka, diminutif affectueux d'un petit poisson d'eau douce, le gardon ; la traduction française a choisi un autre petit poisson, l'ablette.",
  jeu: [
    { c: 0, t: "Dans TW3, elle accourt d'un coup de sifflet, et elle a une fâcheuse tendance à apparaître perchée sur les toits." },
    { c: 5, t: "Si Geralt refuse la récompense d'Emhyr après avoir retrouvé Ciri, il reçoit un étalon noir de pur sang nilfgaardien, qui répond désormais au nom d'Ablette." },
    { d: "bw", c: 0, t: "Lors d'un contrat en Toussaint, Ablette se met à parler, et se révèle une interlocutrice fort agréable, au grand étonnement de Geralt." }],
  voir: ["geralt", "emhyr", "toussaint"] },

{ id: "gwynt", t: "concept", src: "LJ", nom: "Le gwynt", alias: ["Gwent", "Gwint", "jeu de cartes"],
  role: "Jeu de cartes des tavernes",
  resume: "Un jeu de cartes venu des nains, que l'on retrouve dans toutes les tavernes du Nord.",
  livres: "Le nom vient des livres, où c'est un jeu de cartes inventé par les nains. Dans « Le Baptême du feu », Zoltan et ses compagnons y consacrent chaque moment de répit. Le gwynt des livres se joue par paires, avec des enchères aussi bruyantes qu'au marché aux chevaux ; les cartes des nains sont de petits chefs-d'œuvre, et chaque joueur garde près de lui un gros bâton, dont on menace plus souvent qu'on ne frappe.",
  jeu: [
    { c: 0, t: "Dans TW3, c'est un mini-jeu culte : on défie aubergistes et marchands pour compléter son paquet. Il a donné naissance à Gwent et à Thronebreaker, en 2018." },
    { c: 0, t: "Geralt dispute sa toute première partie dès le prologue, à l'auberge de Blanchefleur, contre un universitaire d'Oxenfurt venu observer la guerre. Le jeu de base compte quatre paquets : Royaumes du Nord, Nilfgaard, Scoia'tael et monstres." },
    { d: "bw", c: 0, t: "Blood and Wine ajoute un cinquième paquet, celui de Skellige." }],
  dans: ["bapteme-feu"],
  voir: ["zoltan", "meve", "mahakam", "scoiatael", "verger-blanc"] },

{ id: "stregobor", t: "perso", src: "L", nom: "Stregobor", alias: ["maître Irion"],
  role: "Magicien de Kovir, maître illusionniste",
  resume: "Un mage qui ressemble trait pour trait au magicien des contes, et qui s'estime en droit de tout faire au nom du moindre mal.",
  livres: "Grand, maigre et voûté, avec d'épais sourcils broussailleux, un long nez crochu, une ample robe noire aux manches démesurées et un bâton surmonté d'une boule de cristal : Stregobor a exactement l'allure qu'on prête aux magiciens. Maître des illusions, il croit dur comme fer à la malédiction du Soleil noir, selon laquelle des princesses nées sous une éclipse sèmeraient la mort ; avec ses confrères, il en a fait tuer, puis enfermer dans des tours, et il a lui-même pratiqué des autopsies, et jusqu'à une vivisection. Geralt le connaît de longue date : à Kovir, le mage l'a fait passer pour un charlatan auprès du roi, qui ne l'a jamais payé. Dans « Le Moindre Mal », il vit retranché dans une tour de Blaviken sous le nom de maître Irion, traqué par Renfri, et presse le sorceleur de tuer la jeune femme : ce serait, assure-t-il, le moindre mal. Geralt refuse.",
  rl: "dernier-voeu",
  rev: "Quand Renfri menace de massacrer les gens du marché s'il ne sort pas, il refuse de quitter sa tour et suit le drame dans sa boule de cristal. Une fois la jeune femme morte, il descend pour emporter son corps et l'autopsier ; Geralt menace de le tuer s'il y touche, et le mage repart pour Kovir.",
  dans: ["dernier-voeu"],
  voir: ["renfri", "blaviken", "geralt", "conseil"] },

{ id: "yarpen", t: "perso", src: "L", nom: "Yarpen Zigrin", alias: [],
  role: "Nain de Mahakam, chasseur de dragons, vieille connaissance de Geralt",
  resume: "Nain trapu et bourru, franc jusqu'à la rudesse, à la tête d'une petite bande de nains de Mahakam qui court le monde en quête de gros gibier.",
  livres: "Geralt le rencontre dans « Les Limites du possible », où sa bande vient disputer le dragon aux autres chasseurs : à peine arrivé, Yarpen négocie déjà le partage du trésor. On le retrouve dans « Le Sang des elfes », escortant avec ses compagnons un convoi au chargement secret, envoyé par le roi Henselt de Kaedwen vers l'Aedirn. Geralt, Ciri et Triss, gravement malade, font un bout de chemin avec eux. Bourru et pragmatique, il glisse à Ciri de ne jamais confondre la sollicitude avec autre chose. Lui qui sert un roi humain sait que les Scoia'tael le traitent de traître : qu'on le dise lâche et renégat, répond-il, il maintient qu'il faut cesser de s'entretuer, et vivre de façon à ne jamais avoir à demander pardon à personne.",
  rl: "dame-lac",
  rev: "Dans « Les Limites du possible », il se range du côté des chasseurs décidés à tuer le dragon d'or et ligote avec eux ceux qui s'y opposent, Geralt compris ; il en réchappe de justesse. Dans « Le Sang des elfes », le convoi est attaqué par un commando scoia'tael, et deux de ses nains y laissent la vie. Yarpen traverse ensuite toute la guerre et combat à Brenna.",
  dans: ["epee-providence", "sang-elfes"],
  voir: ["mahakam", "borch", "triss", "ciri", "scoiatael", "non-humains"] },

{ id: "codringher-fenn", t: "perso", src: "L", nom: "Codringher et Fenn", alias: ["Codringher", "Fenn"],
  role: "Avocats et détectives de Dorian",
  resume: "Un cabinet d'avocats et d'enquêteurs de la ville de Dorian, capable de dénicher, ou d'enterrer, n'importe quelle information, pourvu qu'on y mette le prix.",
  livres: "Dans « Le Temps du mépris », Geralt pousse leur porte pour en savoir plus sur Rience, le mystérieux agent qui traque Ciri. Codringher, qui reçoit seul les clients, sait faire sortir de prison un détenu de longue date grâce à des preuves soudain introuvables ; beaucoup soupçonnent que Fenn n'est qu'un de ses prête-noms. Pour protéger le sorceleur, il a déjà fait croire aux espions du roi Foltest que Ciri était morte de la diphtérie dans un camp de réfugiés. Contre deux cent cinquante couronnes, il livre à Geralt ce qu'il a appris du passé de Rience, et lui propose même de lancer ses poursuivants sur une fausse Ciri, de même âge et de même allure. Geralt refuse.",
  rl: "temps-mepris",
  rev: "Fenn existe bel et bien : infirme, il ne quitte pas la pièce dérobée où il mène ses recherches. La nuit du coup de Thanedd, Codringher étudie ses dernières trouvailles sur la lignée de Ciri, qui compterait parmi ses ancêtres la sinistre Falka. C'est alors que des tueurs envoyés par Rience frappent à la porte : les deux associés sont assassinés, et le cabinet livré aux flammes.",
  dans: ["temps-mepris"],
  voir: ["rience", "geralt", "ciri", "falka", "foltest"] },

{ id: "jarre", t: "perso", src: "L", nom: "Jarre", alias: [],
  role: "Jeune scribe du temple de Melitele",
  resume: "Pupille de la prêtresse Nenneke, studieux et gauche, qui partage un temps la vie de Ciri au temple de Melitele.",
  livres: "Dans « Le Sang des elfes », Jarre a seize ans. Pupille de Nenneke, il passe le plus clair de ses jours, et parfois de ses nuits, à recopier et enluminer les livres de la bibliothèque du temple. Ciri le décrit sans pitié : maigre comme un phasme, flottant dans des vêtements trop grands, sentant l'encre et la poussière, avec au menton sept ou huit longs poils, dont la moitié jaillit d'une verrue. Lui est secrètement amoureux d'elle. Grand lecteur de chroniques, il lui parle de politique et des tensions qui montent à la frontière du sud, du côté de Dol Angra.",
  rl: "dame-lac",
  rev: "Quand la guerre s'étend, il s'engage. Dans « La Dame du Lac », versé dans une compagnie de piquiers sans expérience, il est jeté dans la bataille de Brenna face à la cavalerie nilfgaardienne et y perd la main gauche. Après la guerre, il épouse une jeune femme nommée Lucienne et devient chroniqueur.",
  dans: ["sang-elfes", "dame-lac"],
  voir: ["nenneke", "ciri", "melitele", "brenna"] },

{ id: "lytta", t: "perso", src: "L", nom: "Lytta Neyd", alias: ["Corail", "Coral", "Astrid Lyttneyd Ásgeirrfinnbjornsdottir"],
  role: "Magicienne de Kerack, dite Corail",
  resume: "Magicienne rousse originaire de Skellige, surnommée Corail pour la couleur de son rouge à lèvres, aussi séduisante que calculatrice.",
  livres: "Établie à Kerack, elle vend des préparations contraceptives et abortives, au grand déplaisir du roi Belohun. Dans « La Saison des orages », c'est elle qui fait jeter Geralt au cachot sur une fausse accusation de détournement, avant de payer sa caution sans se nommer. Furieux, le sorceleur vient lui demander des comptes, et finit dans son lit : commence une liaison brève et ardente. Elle a pour apprentie la jeune Mozaïk, qu'elle n'hésite pas à punir d'un sort cruel quand elle se sent humiliée. « Quelque chose en plus », dans « L'Épée de la providence », la mentionnait déjà en passant.",
  rl: "saison-orages",
  rev: "Corail agissait pour le compte des mages de Rissberg, qui voulaient attirer Geralt à eux. Au bout de quelques semaines, elle met fin à leur liaison sans états d'âme. Le jour où une tempête dévaste Kerack, elle se téléporte à l'abri pendant que Geralt reste secourir les victimes, et il ne le lui pardonne pas. Des années plus tard, elle compte parmi les magiciens tombés sur la colline de Sodden, comme le rappelait déjà « Le Sang des elfes ».",
  dans: ["saison-orages"],
  voir: ["kerack", "saison-orages", "geralt", "sodden", "yennefer"] },

{ id: "preston-holt", t: "perso", src: "L", nom: "Preston Holt", alias: [],
  role: "Sorceleur vétéran, mentor du jeune Geralt",
  resume: "Un sorceleur aux cheveux blancs, contraint à une retraite précoce, qui prend sous son aile un Geralt de dix-huit ans dans « La Croisée des corbeaux ».",
  livres: "Comme Geralt, Holt a perdu la couleur de ses cheveux lors des mutations ; curieusement, il porte un médaillon à tête de vipère. Une jambe estropiée par un monstre l'a contraint à une retraite précoce dans un petit domaine, d'où il accepte encore quelques contrats par l'intermédiaire d'un agent. Deux jours à peine après avoir quitté Kaer Morhen, Geralt s'apprête à être pendu pour avoir tué un soldat qui tentait de violer une jeune villageoise : Holt arrive à temps pour le tirer de la corde. Il lui enseigne ce que nul maître d'armes ne lui a appris : se méfier des mendiants menteurs, ne pas dévisager les magiciennes, et surtout se défendre sans dégainer, car un sorceleur qui tire l'épée contre un homme signe presque toujours son arrêt de mort. À un carrefour envahi de corbeaux, il propose à Geralt de devenir son associé et son successeur.",
  rl: "croisee",
  rev: "Rescapé de l'assaut qui a jadis ravagé Kaer Morhen, Holt ne dit pas tout : sous ses airs de mentor bienveillant, il nourrit le projet de faire du jeune sorceleur l'instrument de sa vengeance contre les instigateurs de cet assaut.",
  dans: ["croisee"],
  voir: ["croisee", "geralt", "kaer-morhen", "sorceleurs", "medaillon"] },

{ id: "skellen", t: "perso", src: "L", nom: "Stefan Skellen", alias: ["Chat-huant", "Tawny Owl"],
  role: "Coroner impérial et agent secret de Nilfgaard",
  resume: "Surnommé Chat-huant, cet agent des services secrets de l'Empire reçoit pour mission de retrouver Ciri et de la ramener à l'empereur.",
  livres: "Coroner impérial, il doit sa rapide ascension à son amitié avec Vattier de Rideaux, le chef des services de renseignement de l'empereur. Après l'échec de Cahir, c'est à lui qu'échoit la traque de Ciri. Dans « La Tour de l'Hirondelle », il la poursuit à travers le pays à la tête d'une troupe hétéroclite de mercenaires et de spadassins, prêts à tout pour la prime.",
  rl: "dame-lac",
  rev: "Skellen trahit l'empereur : partisan d'une monarchie bridée par une constitution, il conspire avec plusieurs nobles nilfgaardiens pour renverser Emhyr, et compte faire tuer Ciri plutôt que la livrer. Il s'est entendu avec Leo Bonhart, qui finit par capturer la jeune fille. Lorsqu'elle s'échappe en plein village, Skellen lui lance une étoile de métal qui lui entaille profondément la joue gauche : c'est l'origine de sa cicatrice. Pris à Stygga, il est pendu pour trahison.",
  dans: ["tour-hirondelle", "dame-lac"],
  voir: ["ciri", "bonhart", "emhyr", "cahir", "nilfgaard", "rats"] },

{ id: "falka", t: "perso", src: "L", nom: "Falka", alias: ["Gvalch'ca"],
  role: "Princesse rebelle de légende",
  resume: "Fille déshéritée d'un roi de Rédanie, elle a mis le Nord à feu et à sang il y a plus d'un siècle, avant de finir sur le bûcher. À chaque fête de Saovine, on jette encore son effigie dans les flammes.",
  livres: "Fille aînée du roi Vridank de Rédanie, elle est renvoyée bébé en Kovir avec sa mère, répudiée au profit d'une autre. Devenue adulte, elle prend les armes pour réclamer le trône qui lui revient. La révolte tourne à la guerre paysanne, la plus sanglante que le Nord ait connue : on raconte qu'elle a tué de ses mains son père, sa belle-mère et ses deux demi-frères, et ses bandes s'en prennent aux rois, aux prêtres, aux nobles, puis aux magiciens. Vaincue, elle est condamnée au bûcher. Selon la légende, elle maudit alors l'assistance : eux et leurs descendants souffriront par la main d'un enfant de son sang. En Langue ancienne, son nom se dit Gvalch'ca, que l'on rend par « faucon ».",
  rl: "bapteme-feu",
  rev: "Pendant la révolte, Falka retient captive la princesse Riannon, enceinte, qui accouche en prison et y perd la raison ; Falka lui confie son propre nouveau-né. Un siècle plus tard, les recherches de Codringher et Fenn suggèrent que Ciri descend de Falka. Et Ciri elle-même, devenue hors-la-loi parmi les Rats, se choisit ce nom.",
  voir: ["ciri", "codringher-fenn", "rats", "sang-ancien", "lara-dorren", "royaumes-nord"] },

{ id: "bran", t: "perso", src: "LJ", nom: "Bran Tuirseach", alias: ["le roi Bran", "Bran de Skellige"],
  role: "Roi de Skellige",
  resume: "Vieux roi des îles Skellige, frère d'Eist Tuirseach et oncle de Crach an Craite : un nom que les livres citent en passant, et que le jeu fait résonner bien davantage.",
  livres: "Les livres le citent à peine. Roi de Skellige au temps des nouvelles, il compte parmi ses proches le druide Sac-à-souris, son ami et conseiller. C'est lui qui envoie à Cintra, pour les quinze ans de la princesse Pavetta, la délégation des îles : son frère Eist, son neveu Crach an Craite, que l'on verrait bien épouser la princesse, et Sac-à-souris. Le banquet tourne autrement que prévu, mais l'alliance de Skellige et de Cintra se noue tout de même, par le mariage d'Eist et de la reine Calanthe.",
  jeu: [
    { c: 3, t: "Quand Geralt arrive à Kaer Trolde, tous les notables des îles sont réunis pour ses funérailles. Sentant venir la décrépitude, le vieux roi est parti chasser l'ours dans les bois, armé d'un simple couteau. Son corps est déposé sur un drakkar chargé de tout ce qui pourrait lui servir dans l'au-delà, auquel le jarl Crach met le feu." },
    { c: 3, t: "On salue un règne honorable, même si certains lui reprochent d'avoir préféré les razzias outre-mer aux problèmes des îles, et d'avoir laissé trop de liberté à la langue de sa femme, Birna. Sa mort ouvre la succession : les jarls doivent élire un nouveau roi." }],
  voir: ["eist", "crach", "ermion", "calanthe", "skellige", "birna"] },

{ id: "hindarsfjall", t: "lieu", src: "LJ", nom: "Hindarsfjall", alias: [],
  role: "Île sacrée de Skellige",
  resume: "Une île de l'archipel de Skellige, où se trouvent le bosquet sacré de Hindar et le temple de la déesse Freya.",
  livres: "Les livres la décrivent comme une île de forme conique, découpée de nombreux fjords et couverte d'une végétation luxuriante. Le temple de Freya y est tenu par des prêtresses, sous l'autorité d'une grande prêtresse.",
  rl: "tour-hirondelle",
  rev: "Dans « La Tour de l'Hirondelle », Yennefer, partie seule sur la piste de Ciri, convainc le jarl Crach an Craite de l'accompagner jusqu'à Hindarsfjall. Elle y rencontre les prêtresses de Freya et leur grande prêtresse, Sigrdrifa, à qui elle demande de lui prêter, de toute urgence, un artefact d'une grande puissance : le Brisingamen.",
  jeu: [
    { c: 3, t: "La piste de Ciri y conduit Geralt et Yennefer : la jeune femme a été vue au village de Lofoten juste avant que la Chasse sauvage ne le ravage. Le seul qui pourrait en dire plus, un homme privé de son nom et chassé pour sa conduite pendant l'attaque, est parti se racheter en affrontant le monstre du jardin de Freya." },
    { c: 3, t: "Ce jardin sacré, jadis la fierté de l'île et même de tout l'archipel, est tombé en ruine depuis qu'un pirate maudit y rôde : les prêtresses de Freya promettent une généreuse récompense à qui les en débarrassera." }],
  dans: ["tour-hirondelle"],
  voir: ["skellige", "crach", "yennefer", "morkvarg", "chasse"] },

{ id: "palmerin", t: "perso", src: "LJ", nom: "Palmerin de Launfal", alias: [],
  role: "Baron et chevalier errant de Toussaint",
  resume: "Un baron de Toussaint, courtois jusqu'au scrupule, que Geralt rencontre dans « La Dame du Lac ».",
  livres: "Pendant l'hiver que la compagnie passe en Toussaint, Palmerin vient trouver Geralt en toute discrétion, avec un autre baron, Peyrac-Peyran. La duchesse et bien des dames de Beauclair ont demandé au sorceleur de les délivrer d'un fantôme nocturne qui hante les rêves des habitants ; or ce fantôme n'est qu'une succube, sans danger, et les messieurs du duché tiennent à ce qu'elle reste. Les deux barons proposent donc de surenchérir sur la récompense promise par les dames.",
  rl: "dame-lac",
  rev: "Après quelques palabres, Geralt accepte de laisser la succube en paix, contre un compte en banque bien garni, alimenté par les messieurs du duché.",
  jeu: [
    { d: "bw", c: 0, t: "Des années plus tard, la duchesse l'envoie chercher Geralt en Velen avec le baron de Peyrac-Peyran : une bête s'en prend aux chevaliers du duché. Les deux envoyés attendent le sorceleur dans un village menacé par des brigands, qu'ils s'obstinent à vouloir combattre selon les règles de la chevalerie." },
    { d: "bw", c: 0, t: "Revenu des plaisirs de sa jeunesse, il incarne mieux que quiconque l'idéal chevaleresque de Toussaint : vieux jeu, un brin naïf, très à cheval sur les formes, mais dépourvu de toute vanité. Il est l'oncle du jeune Guillaume de Launfal." }],
  dans: ["dame-lac"],
  voir: ["toussaint", "anna-henrietta", "guillaume", "m-succube", "dame-lac"] },

{ id: "menge", t: "perso", src: "J", nom: "Caleb Menge", alias: [], porte: { c: 2 },
  role: "Commandant de la garde du temple et des chasseurs de sorcières",
  resume: "Création du jeu : le chef fanatique et ambitieux de la garde de l'Église du Feu éternel, qui fait brûler mages et non-humains sur les places de Novigrad.",
  jeu: [
    { c: 2, t: "Geralt le voit pour la première fois sur une place de Novigrad, allumant le bûcher de son ancien supérieur, démasqué comme doppler : c'est ce coup d'éclat qui a fait sa fortune. Paranoïaque, il ne quitte jamais son quartier général fortifié sans une escorte armée." },
