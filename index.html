    { c: 2, t: "C'est lui qui détient l'or volé dans la chambre forte de Dijkstra, et Jaskier croupit dans ses geôles. Pour l'approcher, Triss accepte de servir d'appât : Geralt la livre comme une magicienne captive, et elle endure la torture." },
    { c: 3, t: "Menge n'en réchappe pas : selon la tournure des événements, c'est le poignard de Triss ou l'épée de Geralt qui met fin à ses jours." }],
  voir: ["feu-eternel", "novigrad", "triss", "dijkstra", "jaskier", "m-doppler"] },

{ id: "bedlam", t: "perso", src: "J", nom: "Francis Bedlam", alias: ["le Roi des mendiants", "King of Beggars"], porte: { c: 2 },
  role: "Le Roi des mendiants, l'un des maîtres de la pègre de Novigrad",
  resume: "Création du jeu : un chef de la pègre qui s'est lui-même couronné Roi des mendiants, à la tête d'un réseau de voleurs, de vagabonds et de gamins des rues qui couvre toute la ville.",
  jeu: [
    { c: 2, t: "La ville libre de Novigrad n'a plus de roi depuis près de deux siècles : en se proclamant Roi des mendiants, Bedlam singe la pompe des têtes couronnées tout en s'en appropriant un peu. Ses « sujets » lui rapportent les rumeurs les plus fraîches, et une part de leurs gains." },
    { c: 2, t: "Il méprise autant le fanatisme que les préjugés : les mages qui fuient les chasseurs de sorcières trouvent souvent refuge à sa cour, cachée au cœur de la ville. Pour la trouver, Geralt doit filer un pickpocket ou faire parler les mendiants ; il y surprend Triss en pleine affaire avec lui." },
    { c: 2, t: "Avec Sigi Reuven et Surin, il forme le triumvirat qui tient la pègre de Novigrad, face au quatrième larron, le Petit Bâtard." }],
  voir: ["novigrad", "triss", "dijkstra", "surin", "petit-batard", "feu-eternel"] },

{ id: "petit-batard", t: "perso", src: "J", nom: "Le Petit Bâtard", alias: ["Cyprian Wiley", "Whoreson Junior", "Junior"], porte: { c: 2 },
  role: "Caïd sadique de la pègre de Novigrad",
  resume: "Création du jeu : Cyprian Wiley, héritier des casinos, de l'arène de combat et des bordels de son père, dont il a aussi hérité la cruauté, l'absence de scrupules et le surnom.",
  jeu: [
    { c: 2, t: "Il rompt la trêve tacite de la pègre en envoyant des tueurs contre les trois autres caïds, réunis aux bains de Sigi Reuven. Geralt, qui a ses propres raisons de le retrouver, se lance sur sa piste, de son casino à son arène." },
    { c: 3, t: "Jaskier et Ciri ont eu affaire à lui : son aide avait pour prix le trésor de Sigi Reuven. Soupçonnant qu'on le dupait, il a enlevé le doppler Dudu pour leur tendre un piège, dont Ciri a su se tirer." },
    { c: 3, t: "Derrière son audace se cache un commanditaire de poids : le roi Radovid, qui compte profiter d'une guerre des gangs pour mettre la main sur la ville. Lâché par lui, il se terre dans sa demeure d'Oxenfurt, où Geralt découvre qu'il se plaît à assassiner les femmes qu'il retient." },
    { c: 3, t: "Selon le choix du sorceleur, il meurt, et Dudu emprunte son apparence pour se cacher, ou il perd tout et finit à la rue." }],
  voir: ["novigrad", "dudu", "ciri", "jaskier", "radovid", "oxenfurt"] },

{ id: "surin", t: "perso", src: "J", nom: "Surin", alias: ["Carlo Varese", "Cleaver"], porte: { c: 2 },
  role: "Nain, chef de gang de Novigrad",
  resume: "Création du jeu : Carlo Varese, dit Surin, un nain au sang chaud qui commande une bande composée surtout de nains et compte parmi les quatre grands caïds de Novigrad.",
  jeu: [
    { c: 2, t: "Une plaisanterie court les bas-fonds : à sa façon, Surin défend farouchement la coexistence des races. Quiconque conteste ses affaires, nain, humain ou halfelin, n'est qu'un sale raciste, juste bon, dit la rumeur, à finir dans l'enclos de ses cochons affamés, une fois privé de ses doigts." },
    { c: 2, t: "Ce qu'il supporte le moins, c'est qu'on le roule. Après l'attaque des tueurs du Petit Bâtard aux bains, il jure de se venger et propose à Geralt de l'aider à le débusquer, en lançant ses nains sur le casino et l'arène de son rival." },
    { c: 2, t: "Sous sa protection, un forgeron moins doué a évincé ses concurrents : le maître forgeron elfe Éibhear Hattori a troqué la forge contre les fourneaux, à moins que Geralt ne l'aide à la rallumer." }],
  voir: ["novigrad", "petit-batard", "bedlam", "dijkstra", "non-humains"] },

{ id: "cyn", t: "perso", src: "J", nom: "Cyn", alias: ["Ves"], porte: { c: 2 },
  role: "Vétérane des Stries bleues, fidèle de Vernon Roche",
  resume: "Création des jeux : la seule femme de l'unité d'élite de Vernon Roche, redoutable à l'arbalète comme à l'épée, apparue dans The Witcher 2.",
  jeu: [
    { c: 2, t: "Seule soldate de l'ancienne unité de Roche à avoir survécu à la guerre, elle poursuit à ses côtés la lutte, en apparence sans espoir, pour une Témérie libre." },
    { c: 2, t: "D'ordinaire disciplinée, elle quitte son poste sans ordre pour défendre un village qui avait aidé les partisans, et se jette presque seule contre les Nilfgaardiens. Roche demande à Geralt de l'aider à la tirer de ce mauvais pas ; elle peut y laisser la vie." },
    { c: 4, t: "Si elle a survécu et que Geralt sollicite Roche, elle vient elle aussi défendre Kaer Morhen contre la Chasse : elle suivrait son commandant jusqu'au fond de l'abîme." },
    { c: 6, t: "Si Geralt ne s'interpose pas lorsque Dijkstra se retourne contre les Témériens, elle tombe aux côtés de Roche et de Talar." }],
  voir: ["roche", "talar", "royaumes-nord", "nilfgaard", "kaer-morhen"] },

{ id: "talar", t: "perso", src: "J", nom: "Talar", alias: ["Thaler", "Bernard Ducat"], porte: { c: 5 },
  role: "Ancien maître espion de la Témérie",
  resume: "Création des jeux : Bernard Ducat, l'ancien chef du renseignement témérien, que Geralt a connu dans le premier jeu sous les traits de Talar, un receleur de Vizima à la langue ordurière.",
  jeu: [
    { c: 5, t: "Dijkstra et Roche demandent à Geralt de retrouver leur complice disparu : Talar, qui se fait passer pour un cordonnier ambulant, car personne ne prête attention à un cordonnier. Geralt le découvre aux mains de trois trolls des rochers, bien décidés à se faire faire des chaussures." },
    { c: 5, t: "Toujours aussi grossier, il conspire avec Roche et Dijkstra pour assassiner le roi Radovid. Piètre combattant, il attend avec Dijkstra, à Novigrad, l'issue de l'embuscade." },
    { c: 6, t: "Si Geralt s'interpose quand Dijkstra se retourne contre ses complices, Talar survit et négocie avec Nilfgaard le retour d'une Témérie vassale de l'Empire. Sinon, il meurt avec Roche et Cyn." }],
  voir: ["roche", "dijkstra", "cyn", "radovid", "royaumes-nord", "vizima"] },

{ id: "birna", t: "perso", src: "J", nom: "Birna Bran", alias: ["Birna"], porte: { c: 3 },
  role: "Veuve du roi Bran de Skellige",
  resume: "Création du jeu : l'épouse principale du vieux roi Bran et la mère de son fils aîné, Svanrige, qui ne cache rien de son mépris pour les traditions des îles.",
  jeu: [
    { c: 3, t: "Aux funérailles de Bran, la coutume voudrait que l'épouse principale accompagne son mari sur le bûcher. Birna refuse, et c'est une jeune concubine qui prend sa place, sous les regards outrés de l'assistance." },
    { c: 3, t: "Au banquet qui suit, elle s'indigne qu'on élise les rois de Skellige au lieu de leur transmettre la couronne : elle rêve d'une dynastie héréditaire, à commencer par son fils Svanrige, et presse Crach de retirer ses enfants de la course." },
    { c: 4, t: "Si Geralt aide Cerys à enquêter sur le massacre de Kaer Trolde, la piste remonte jusqu'à Birna. Quand Svanrige comprend qu'elle l'a éloigné de la salle avant le carnage, elle se trahit, et les jarls la condamnent à mourir enchaînée à un rocher." },
    { c: 6, t: "Si Geralt n'a soutenu personne, Svanrige devient roi. Mais quand Birna prétend parler en son nom pour soumettre Skellige à Nilfgaard, il tue l'émissaire de l'Empire et rallie les jarls contre lui." }],
  voir: ["bran", "an-craite", "crach", "kaer-trolde", "skellige", "nilfgaard"] },

{ id: "morkvarg", t: "perso", src: "J", nom: "Morkvarg", alias: [], porte: { c: 3 },
  role: "Pirate maudit de Skellige",
  resume: "Création du jeu : un pirate de Skellige d'une cruauté sans bornes, qui ne craignait rien, disait-on, sinon la colère des dieux.",
  jeu: [
    { c: 3, t: "Pour prouver qu'il ne craignait même pas les dieux, il a mis à sac avec son équipage le jardin sacré de Freya, sur Hindarsfjall, et massacré les prêtresses. Depuis, changé en loup-garou, il hante les ruines du jardin." },
    { c: 3, t: "Sa malédiction est un supplice : la nourriture tombe en cendres dans sa bouche, une faim insatiable le ronge, et il revient toujours d'entre les morts. La légende l'attribue à la grande prêtresse qu'il a tuée, mais un survivant de l'attaque en sait plus qu'il ne le dit." },
    { c: 4, t: "Geralt peut en finir en lui faisant manger sa propre chair, ou, s'il découvre qui l'a vraiment maudit, lever la malédiction et rendre au pirate sa forme humaine." }],
  voir: ["hindarsfjall", "m-loup-garou", "skellige"] },

{ id: "iris", t: "perso", src: "J", nom: "Iris von Everec", alias: [], porte: { d: "hos" },
  role: "Épouse d'Olgierd von Everec, peintre",
  resume: "Création du jeu : la femme qu'Olgierd von Everec a jadis aimée, puis quittée en lui laissant pour tout souvenir une rose violette.",
  jeu: [
    { d: "hos", c: 0, t: "Le troisième vœu d'Olgierd conduit Geralt dans le manoir abandonné des von Everec, à la recherche de la rose offerte à Iris. La demeure est hantée par un spectre plein de rage et de chagrin : Iris elle-même, morte de solitude des années plus tôt." },
    { d: "hos", c: 0, t: "Peintre de talent, elle s'était réfugiée de son vivant dans un monde imaginaire pour fuir ses souvenirs. Une fois ses restes enterrés, elle entraîne Geralt dans ce monde peint, où les jours heureux s'assombrissent peu à peu, hantés par un mari devenu méconnaissable." },
    { d: "hos", c: 0, t: "La rose la retient parmi les vivants. Geralt doit choisir : la prendre, et Iris s'efface à jamais, ou la lui laisser, et son âme trouve refuge dans un tableau." }],
  voir: ["olgierd", "gaunter", "m-spectres"] },

{ id: "guillaume", t: "perso", src: "J", nom: "Guillaume de Launfal", alias: [], porte: { d: "bw" },
  role: "Jeune chevalier errant de Toussaint",
  resume: "Création du jeu : le neveu de Palmerin de Launfal, chevalier errant aussi fougueux que maladroit, toujours prêt à se jeter au-devant du danger pour les beaux yeux d'une dame.",
  jeu: [
    { d: "bw", c: 0, t: "Geralt le rencontre dès son arrivée en Toussaint, chargeant vaillamment un moulin à vent… qui cachait, il est vrai, un géant féroce. Au tournoi de Beauclair, il faut encore le tirer des griffes d'un shaelmaar furieux, sous les yeux de la foule." },
    { d: "bw", c: 0, t: "Blessé, il confie au sorceleur son tourment : il aime sans retour Vivienne de Tabris, dame de compagnie de la duchesse, et la croit victime d'un sort. Pour approcher la dame, Geralt doit prendre sa place dans le tournoi des chevaliers." },
    { d: "bw", c: 0, t: "Vivienne est bel et bien maudite. Selon les choix de Geralt, Guillaume peut proposer de porter lui-même la malédiction à sa place : il n'y gagne que quelques plumes, que sa belle trouve plutôt seyantes." }],
  voir: ["palmerin", "toussaint", "anna-henrietta"] },

{ id: "damien", t: "perso", src: "J", nom: "Damien de la Tour", alias: [], porte: { d: "bw" },
  role: "Capitaine de la garde ducale de Toussaint",
  resume: "Création du jeu : le chef de la garde de la duchesse Anna Henrietta, soldat rugueux et dévoué corps et âme à sa souveraine.",
  jeu: [
    { d: "bw", c: 0, t: "Attaché sans réserve à sa charge, il voue à la duchesse une dévotion qui ressemble fort à de l'amour. À la cour de Beauclair, il regarde le sorceleur comme un renard rôdant autour du poulailler, et lui lance d'emblée un défi viril." },
    { d: "bw", c: 0, t: "Après avoir versé son sang aux côtés de Geralt, il révise son jugement : le Loup Blanc ne veut qu'aider. Les deux hommes finissent par s'estimer, à leur manière bourrue, mais tout ce qui fait souffrir sa duchesse, Damien le prend à cœur." }],
  voir: ["anna-henrietta", "toussaint", "syanna"] },

{ id: "corvo-bianco", t: "lieu", src: "J", nom: "Corvo Bianco", alias: ["Gwyn Cerbin"], porte: { d: "bw" },
  role: "Le domaine viticole de Geralt en Toussaint",
  resume: "Création du jeu : l'un des plus anciens vignobles du duché, bâti sur des ruines elfes, que la duchesse offre à Geralt en paiement partiel de son contrat.",
  jeu: [
    { d: "bw", c: 0, t: "En Langue ancienne, on l'appelle Gwyn Cerbin ; Corvo Bianco veut dire « corbeau blanc ». Il produisait jadis un vin sans pareil, mais le train de vie d'un de ses propriétaires l'a mené à la ruine, et il a fini aux mains du trésor ducal." },
    { d: "bw", c: 0, t: "Un majordome aussi digne que pointilleux y attend Geralt. Contre espèces sonnantes, il fait restaurer la maison : écurie, lit et bibliothèque accordent des bonus temporaires, le laboratoire d'alchimie améliore les préparations, et l'on peut exposer armures, armes et tableaux." },
    { d: "bw", c: 0, t: "Une fois l'aventure de Toussaint achevée, un proche vient s'installer au domaine, selon les choix faits dans le jeu de base : Ciri, Jaskier, Triss ou Yennefer." }],
  voir: ["toussaint", "anna-henrietta", "geralt", "langue-ancienne"] },

{ id: "perchefreux", t: "lieu", src: "J", nom: "Perchefreux", alias: ["Crow's Perch"], porte: { c: 1 },
  role: "Forteresse du Baron sanglant, en Velen",
  resume: "Création du jeu : un fort de Velen ceint d'une palissade, dominé par un donjon de brique rouge, où le Baron sanglant s'est installé avec ses hommes.",
  jeu: [
    { c: 1, t: "Son ancien seigneur a pris la fuite à l'annonce de l'arrivée des armées ; le Baron sanglant s'y est installé avec sa famille et sa suite. Une cinquantaine de paysans vivent encore au pied du château, derrière un fossé et une palissade." },
    { c: 1, t: "La piste de Ciri y mène Geralt dès son arrivée en Velen : le Baron reçoit le sorceleur dans son donjon, mais ne dira ce qu'il sait que contre un service." }],
  voir: ["baron", "velen", "uma", "torsechine"] },

{ id: "torsechine", t: "lieu", src: "J", nom: "Le marais de Torséchine", alias: ["Torséchine", "Crookback Bog"], porte: { c: 1 },
  role: "Marais du sud de Velen, domaine des Moires",
  resume: "Création du jeu : un vaste marais du sud de Velen, infesté de noyeurs et de créatures pires encore, sur lequel règnent les Moires.",
  jeu: [
    { c: 1, t: "Les gens du marais, ceux du village de Culterrier en tête, vénèrent les Moires au point de se mutiler en leur honneur. Au cœur des marécages, une vieille femme veille sur une poignée d'orphelins et sert d'intermédiaire avec les trois sœurs." },
    { c: 1, t: "Geralt y trouve un allié inattendu : Jeannot, un célicole à l'allure d'enfant, aux grands yeux jaunes, que l'on prenait pour l'ami imaginaire des orphelins. Une fois sa voix retrouvée, il se révèle intarissable." },
    { c: 2, t: "Le sort des orphelins, de Culterrier et de la famille du Baron dépend des choix faits face aux Moires." }],
  voir: ["dames-bois", "velen", "baron", "m-noyeurs", "perchefreux"] }
],

},

bestiaire: [
  { id: "m-noyeurs", nom: "Noyeurs", en: "Drowner", cl: "Nécrophages", signes: ["Igni"], porte: { c: 0 },
    conseil: "Le bestiaire liste Igni et l'huile contre les nécrophages : les noyeurs craignent tout particulièrement le feu, alors qu'Axii, selon lui, n'a pas prise sur eux. Ils chassent en bande près de l'eau, surtout au crépuscule et sous la pluie, et bondissent hors de la vase : mieux vaut ne jamais se laisser encercler et enflammer le groupe d'un cône d'Igni. Sous l'eau, seule l'arbalète les atteint.",
    origine: "Les nécrophages, mangeurs de cadavres, comptent parmi les créatures arrivées avec la Conjonction des Sphères. En polonais, le noyeur s'appelle utopiec, comme le démon des eaux du folklore slave, âme d'un noyé qui entraîne les vivants au fond, cousin du vodianoï russe et du vodník tchèque. Le bestiaire du jeu prend le contre-pied de cette croyance : malgré leur allure de cadavres repêchés, les noyeurs ne sont pas des noyés revenus d'entre les morts, mais une espèce à part, avec écailles, branchies et nageoires dorsales.",
    lien: "conjonction" },
  { id: "m-goules", nom: "Goules et algoules", en: "Ghoul, Alghoul", cl: "Nécrophages", signes: ["Axii"], porte: { c: 0 },
    conseil: "Le bestiaire ne leur connaît qu'une faiblesse, l'huile contre les nécrophages, et ajoute Axii contre l'algoule. Les goules chassent en meute, plus dangereuses au crépuscule et la nuit : il faut abattre l'algoule en premier, car elle mène le groupe. Une goule blessée entre en frénésie et regagne des forces ; Axii brise cette rage et force l'algoule à rentrer les piquants qui hérissent son dos.",
    origine: "Les livres citent les goules et les graveirs parmi les reliques de la Conjonction. Le mot vient de l'arabe ghoul, une créature monstrueuse du folklore de l'Arabie préislamique, qui hante les lieux déserts ; un poète de cette époque raconte même avoir lutté contre l'une d'elles. Le bestiaire du jeu décrit des charognards au visage presque humain qui marchent à quatre pattes, attirés par les tombes fraîches et les champs de bataille.",
    livres: "Dans « Le Dernier Vœu », Geralt cite la goule et le graveir parmi les monstres qu'il a traqués de contrat en contrat, entre la manticore, la wyvern, le loup-garou et la stryge. « Le Sang des elfes » précise que ces mangeurs de cadavres craignent l'argent, mais aussi la lumière du soleil et le feu.",
    lien: "conjonction" },
  { id: "m-spectres", nom: "Spectres de midi et de minuit", en: "Noonwraith, Nightwraith, Wraith", cl: "Spectres", signes: ["Yrden"], bombes: ["Poussière de lune"], porte: { c: 0 },
    conseil: "Le bestiaire conseille de les piéger dans un cercle d'Yrden ou de les frapper d'une Poussière de lune pour les forcer à prendre corps, puis d'attaquer vite, l'épée enduite d'huile contre les spectres. Le spectre de midi aveugle de poussière ; tous deux sont plus faibles à l'heure opposée, la nuit pour l'un, le jour pour l'autre. Affaiblis, ils se dédoublent : une bombe ou un carreau d'arbalète dissipe leurs copies.",
    origine: "Directement tirés du folklore slave, où l'esprit de midi hante les champs en plein soleil. La południca polonaise, la « dame de midi », apparaît en robe blanche au bord des champs et s'en prend à ceux qui travaillent aux heures chaudes : on lui attribuait coups de chaleur, douleurs de nuque, voire folie. Le spectre de minuit, północnica en polonais, en est le pendant nocturne. Le bestiaire fait des spectres de midi les âmes de jeunes femmes mortes violemment juste avant leurs noces, retenues ici-bas par un objet chargé d'émotion, comme une alliance ou un voile déchiré." },
  { id: "m-hym", nom: "Hym", en: "Hym", cl: "Spectres", signes: ["Igni"], bombes: ["Poussière de lune"], porte: { c: 3 },
    conseil: "Le bestiaire liste Igni, la Poussière de lune et l'huile contre les spectres. Le hym ne se montre qu'à celui qu'il tourmente. Démasqué, il est lent, mais ses griffes portent loin et le moindre contact draine les forces ; après quelques coups, il se téléporte. Igni le garde visible, Yrden le ralentit encore, et il faut riposter juste après chaque esquive, sans le laisser se régénérer quand il fuit.",
    origine: "Création du jeu, liée aux croyances de Skellige : un esprit qui se nourrit de la culpabilité. Selon le bestiaire, il ne s'attache qu'aux auteurs de crimes atroces et reste invisible pour tous les autres. Haute silhouette d'ombre aux longues griffes, il ne frappe pourtant jamais sa victime : il lui parle d'une voix qu'elle seule entend, nourrit ses cauchemars et la pousse à la violence contre les autres ou contre elle-même, jusqu'à la folie ou au suicide." },
  { id: "m-leshen", nom: "Leshen", en: "Leshen", cl: "Vestiges", signes: ["Igni"], bombes: ["Dimeritium"], immun: "Axii", porte: { c: 1 },
    conseil: "Le bestiaire liste Igni, la bombe de dimeritium et l'huile contre les vestiges ; Axii reste sans effet. Le leshen ne se bat jamais seul : il appelle loups et corbeaux, fait jaillir des racines et se dissout en fumée pour reparaître ailleurs. Certains s'appuient sur des totems, à détruire d'abord. En feu, il ne se défend plus, et la Poussière de lune, sans figurer au bestiaire, bloque sa fuite en fumée.",
    origine: "L'esprit de la forêt du folklore slave, le leshy. Ce léchi, maître des bois et du gibier, égare les voyageurs mais ménage ceux qui respectent la forêt ; on l'apaisait en déposant des offrandes sur une souche. Le jeu en fait un monstre au crâne de cerf et aux membres d'écorce, escorté de loups et de corbeaux. Son bestiaire rappelle que certains villages lui vouent un culte et lui offrent lièvres, oiseaux, voire du sang humain, mais que les légendes de leshens secourables n'ont pas un mot de vrai." },
  { id: "m-fiend", nom: "Fiellon", en: "Fiend, bies", cl: "Vestiges", bombes: ["Samum", "Vesse-de-loup du diable"], immun: "Aard", porte: { c: 1 },
    conseil: "Le bestiaire liste la Samum, la Vesse-de-loup du diable et l'huile contre les vestiges : le fiellon n'a peur que des détonations. Sa masse le rend insensible à Aard et ses plaies se referment vite. Son troisième œil hypnotise : une Samum bien placée le neutralise pour de bon ; sinon, il faut rester hors de sa vue, sur ses flancs. Quand il gratte le sol, une charge de taureau suit : il faut rouler de côté.",
    origine: "Le bies du folklore slave. En polonais, le mot désigne un démon malfaisant, souvent confondu avec le czart, que le christianisme a rapproché du diable. Le jeu lui donne l'allure d'un cerf colossal, montagne de muscles coiffée de cornes et d'une gueule pleine de crocs, avec un troisième œil au milieu du front. Il évite les humains quand il le peut ; sinon, il les tue sans peine, et le bestiaire assure qu'un seul coup de patte suffit à abattre un chevalier avec sa monture." },
  { id: "m-chort", nom: "Tschart", en: "Chort, Sylvan", cl: "Vestiges", bombes: ["Vesse-de-loup du diable"], porte: { c: 0 },
    conseil: "Le bestiaire liste la Vesse-de-loup du diable et l'huile contre les vestiges. Plus petit que le fiellon mais à peine moins dangereux, le tschart charge droit devant pour renverser sa proie, puis mord et frappe ; sa taille et sa posture le rendent presque insensible à Aard, et ses plaies guérissent vite. Il faut le provoquer, rouler de côté au dernier moment, l'attirer dans le nuage toxique et frapper ses flancs.",
    origine: "Le czart, ou tchort, est dans le folklore slave un démon malin, cornu, à sabots et à queue fine, l'équivalent païen du diable chrétien. Le jeu en fait un cousin du fiellon qui court à quatre pattes. Son bestiaire s'amuse de la confusion avec le sylvain : les légendes prêtent au tschart la parole, la station debout et le goût des farces, mais un vrai tschart ne fait que grogner et dévaste les fermes, avalant choux, volailles, cochons, le chien de la maison, puis la famille.",
    livres: "Le facétieux Torque du « Bout du monde » est un sylvain, créature avec laquelle on confond souvent le tschart. Dans la nouvelle, des paysans demandent à Geralt de les débarrasser, sans le tuer, d'une créature cornue qu'ils prennent pour un diable et qui pille leurs champs. Le sorceleur et Jaskier découvrent un être à cornes et à sabots de bouc, qui parle d'une voix chevrotante et les accueille à coups de billes de fer.",
    lien: "dernier-voeu" },
  { id: "m-doppler", nom: "Doppler", en: "Doppler", cl: "Vestiges", porte: { c: 2 },
    conseil: "Le bestiaire ne cite que l'huile contre les vestiges. Un doppler peut prendre la forme de n'importe quel humanoïde ou animal, et ni amulette ni médaillon ne trahissent la métamorphose ; d'un naturel timide, il évite de verser le sang. S'il faut l'affronter, il emprunte aussi les talents de son adversaire, Quen et Igni compris : patience, parades et contre-attaques, avec Yrden pour l'immobiliser.",
    origine: "Une créature imaginée par Sapkowski et reprise fidèlement par le jeu. Son nom évoque le Doppelgänger, le double des légendes germaniques. Selon le bestiaire, sa transformation n'est pas une illusion qu'un sort pourrait dissiper, mais une métamorphose complète, jusqu'à l'aura de son modèle : avec leur intelligence et leur ruse, les dopplers feraient des voleurs ou des assassins parfaits, si la nature ne les avait faits doux et craintifs.",
    livres: "Dans « Le Feu éternel », Geralt découvre qu'un doppler n'est pas forcément un monstre, et épargne Dudu. À Novigrad, ce doppler s'est glissé dans la peau d'un marchand halfelin et mène ses affaires à sa place. Les dopplers copient non seulement l'apparence de leur modèle, mais aussi ses pensées, ce qui rend leur traque particulièrement délicate.",
    lien: "dudu" },
  { id: "m-loup-garou", nom: "Loup-garou", en: "Werewolf", cl: "Maudits", signes: ["Igni"], bombes: ["Poussière de lune", "Vesse-de-loup du diable"], porte: { c: 1 },
    conseil: "Le bestiaire recommande une lame enduite d'huile contre les créatures maudites et une bonne réserve de Vesse-de-loup du diable ; Igni et la Poussière de lune complètent la liste. Le loup-garou chasse la nuit, surtout à la pleine lune, appelle des loups à l'aide et régénère ses blessures en un instant : la Poussière de lune bloque cette régénération, le feu et le poison la ralentissent. Yrden freine ses bonds.",
    origine: "Dans l'univers du Sorceleur, la lycanthropie relève de la malédiction, non de la maladie. Selon le bestiaire, la transformation échappe à la volonté du maudit, qui ne garde aucun souvenir de ses actes une fois redevenu homme, et la malédiction peut parfois être levée, mais sans méthode universelle : il y faut de la patience et une solide armure. L'homme-loup lui-même est une figure du folklore européen, que l'on trouve déjà chez Pétrone, dans l'Antiquité." },
  { id: "m-botchling", nom: "Couvin", en: "Botchling", cl: "Maudits", signes: ["Axii"], porte: { c: 2 },
    conseil: "Le bestiaire liste Axii et l'huile contre les créatures maudites. Menacé et gorgé de sang, le couvin grandit jusqu'à devenir une créature voûtée qui marche sur les avant-bras comme un singe, le dos hérissé de piquants : Axii les lui fait rentrer un instant et l'étourdit, le temps de frapper sans se blesser. Le bestiaire précise que sa malédiction peut aussi être levée, en le changeant en esprit protecteur du foyer.",
    origine: "Tiré du poroniec du folklore slave : l'esprit d'un enfant mort-né ou d'une fausse couche, enterré sans les rites. Le jeu reste assez fidèle à cette croyance. Selon la tradition polonaise, l'enfant enterré en offrande sous le seuil de la maison devenait au contraire un kłobuk, un esprit bienveillant, idée que le jeu reprend aussi. Son bestiaire décrit un fœtus à demi décomposé qui se glisse la nuit au chevet des femmes enceintes pour boire leur sang, jusqu'à les tuer avec l'enfant qu'elles portent." },
  { id: "m-stryge", nom: "Stryge", en: "Striga", cl: "Maudits",
    conseil: "Aucune stryge à combattre dans TW3 : c'est dans le premier jeu, The Witcher, que Geralt en affronte une.",
    origine: "La strzyga des folklores polonais et silésien, démon proche du vampire, descend de la strix des Grecs et des Romains, un oiseau de nuit qui se nourrissait de chair et de sang humains. On tenait pour strzygas ceux qui naissaient avec deux cœurs, deux âmes et deux rangées de dents. Sapkowski en fait une enfant changée en monstre par une malédiction, et en tire sa toute première nouvelle.",
    livres: "Dans « Le Sorceleur », la fille du roi Foltest, maudite dès sa naissance, est devenue une stryge. Geralt doit passer une nuit dans sa crypte pour lever le sort. Velerad lui en raconte l'origine : née d'une liaison du roi avec sa propre sœur, Adda, l'enfant est morte en même temps que sa mère et a été enterrée avec elle ; sept ans plus tard, elle est sortie du sarcophage pour massacrer les habitants du palais. Selon un mage, le sort sera levé si quelqu'un l'empêche de regagner son tombeau jusqu'au troisième chant du coq. Foltest promet trois mille orens et veut qu'on la sauve.",
    lien: "dernier-voeu" },
  { id: "m-katakan", nom: "Katakan", en: "Katakan", cl: "Vampires", signes: ["Yrden", "Igni"], bombes: ["Poussière de lune", "Vesse-de-loup du diable"], porte: { c: 2 },
    conseil: "Le bestiaire conseille de l'immobiliser avec Yrden, puis de frapper de toutes ses forces, car l'occasion peut ne pas revenir ; il liste aussi Igni, la Poussière de lune, la Vesse-de-loup du diable et l'huile contre les vampires. Invisible, le katakan ne trahit sa position que par son ombre. L'acier ne lui fait rien, et sa régénération ralentit quand le soleil est au zénith : c'est à midi qu'il faut le chasser.",
    origine: "Un vampire venu des livres, où Sapkowski le range parmi les espèces qui boivent le sang de leurs victimes sans les mettre en pièces. Le jeu en fait une sorte de chauve-souris géante aux crocs immenses et aux griffes plus longues encore, capable de se rendre invisible. Son bestiaire corrige une légende tenace : le soleil ne réduit pas les katakans en cendres, il ralentit seulement leur régénération.",
    lien: "vampires" },
  { id: "m-ekimmara", nom: "Ekimme", en: "Ekimmara", cl: "Vampires", signes: ["Igni"], bombes: ["Vesse-de-loup du diable"], porte: { c: 1 },
    conseil: "Le bestiaire conseille l'épée d'argent et l'huile contre les vampires, et liste Igni et la Vesse-de-loup du diable, pour empoisonner puis brûler la bête. L'ekimme frappe vite et fort, ses griffes ne se parent pas et ses blessures se referment : il ne faut ni chercher à l'épuiser ni attendre qu'il se vide de son sang, mais l'abattre au plus vite. Le Sang noir retourne contre lui le sang qu'il fait couler.",
    origine: "Le nom renvoie à l'edimmu, parfois lu ekimmu, esprit des morts privés de sépulture dans les croyances de Mésopotamie : un fantôme vengeur, presque immatériel, qui aspirait la vie des dormeurs. Le jeu en fait un vampire inférieur, bestial, proche de la chauve-souris géante. Son bestiaire s'amuse des clichés : l'ekimme se moque de l'ail, de l'eau bénite et des symboles sacrés, et ne ressemble en rien à un bel aristocrate pâle à l'accent de l'Est.",
    lien: "vampires" },
  { id: "m-bruxa", nom: "Brouxe", en: "Bruxa, Alp", cl: "Vampires", signes: ["Yrden"], bombes: ["Poussière de lune"], potions: ["Sang noir"], porte: { d: "bw" },
    conseil: "Le bestiaire conseille de boire un Sang noir avant le combat, car la brouxe cherche à mordre sa proie affaiblie pour boire son sang. Quand elle se rend invisible, la Poussière de lune aide à suivre ses mouvements et Yrden la fait reparaître ; il liste aussi l'huile contre les vampires. Son cri renverse et étourdit. Renversée par Aard, elle peut être achevée d'un seul coup. L'alpyre se combat de la même façon.",
    origine: "En portugais et en galicien, bruxa signifie « sorcière ». Le bestiaire du jeu en fait un vampire rare et prudent, qui vit loin des hommes ou ne sort que la nuit, bien plus rapide et plus fort qu'un humain, et capable de se rendre invisible. Il insiste sur ses liens étroits avec les oiseaux : entendre plusieurs espèces chanter à la fois signale que l'on entre sur son territoire.",
    livres: "Dans les livres aussi, c'est une espèce de vampire, et des plus redoutables.",
    lien: "vampires" },
  { id: "m-vampire", nom: "Vampire supérieur", en: "Higher vampire", cl: "Vampires", signes: ["Igni"], porte: { c: 2 },
    conseil: "Le bestiaire ne lui connaît que deux faiblesses, Igni et l'huile contre les vampires. Insensible à la lumière du jour, à l'eau bénite, aux symboles sacrés et à l'ail, il ne fait même pas frémir le médaillon des sorceleurs. On ne l'affronte que lors de combats scénarisés : Yrden le force à reparaître quand il se rend invisible, Igni l'étourdit s'il prend feu, et Quen amortit ses coups.",
    origine: "Une création de Sapkowski, qui y renverse les clichés du vampire de roman. Le bestiaire du jeu rappelle qu'il ressemble en tout à un humain, préfère les villes aux forêts et mène une vie d'apparence ordinaire, mais qu'il est immortel. Certains ont renoncé au sang humain, d'autres y cèdent. Il peut manipuler hommes et bêtes, se rendre invisible et prendre la forme d'une chauve-souris géante ; ceux qui l'ont affronté et ont survécu se comptent sur les doigts d'une main.",
    livres: "Presque immortels, capables de se régénérer de presque tout, les vampires supérieurs n'ont pas besoin de sang pour vivre. Pour eux, le sang n'est pas une nourriture mais une ivresse, comparable à l'alcool chez les humains. Ils échappent aux médaillons des sorceleurs, et ni l'ail, ni le soleil, ni les symboles sacrés ne leur font rien.",
    lien: "vampires" },
  { id: "m-vouivres", nom: "Wyverns", en: "Wyvern, Forktail, Royal wyvern", cl: "Draconides", signes: ["Aard"], bombes: ["Ruche"], potions: ["Loriot doré"], autres: ["Arbalète"], porte: { c: 1 },
    conseil: "Le bestiaire liste le Loriot doré, qui protège de son venin, ainsi que la Ruche, Aard et l'huile contre les draconides. La wyvern attaque d'en haut pour renverser sa proie d'un coup d'aile, puis mord au sol pour détourner l'attention de son arme la plus dangereuse : le dard venimeux au bout de sa queue. Aard ou une Ruche la ramènent à terre, où elle esquive mal.",
    origine: "Le mot vient de l'ancien français wivre, « vipère », d'où dérive aussi la vouivre de nos légendes : un dragon à deux pattes et deux ailes, à la queue souvent pointue, très présent dans l'héraldique britannique. Le bestiaire du jeu rappelle qu'on la prend souvent pour un dragon, alors qu'elle est bien plus petite et ne crache pas le feu. La plus redoutée est la wyvern dite royale, aussi irascible et mortelle que les monarques dont elle porte le nom.",
    livres: "Dans « Le Temps du mépris », à la foire de Gors Velen, un forain grêlé exhibe dans une cage bien trop étroite un reptile aux écailles presque noires, qu'il fait passer pour un basilic : c'est une wyvern, et la bête finit par briser sa cage sous les yeux de Ciri. Dans « Le Dernier Vœu », Geralt la cite parmi les monstres de ses contrats, juste après la manticore.",
    lien: "temps-mepris" },
  { id: "m-basilics", nom: "Basilics et cocatrix", en: "Basilisk, Cockatrice", cl: "Draconides", signes: ["Aard"], bombes: ["Ruche"], potions: ["Loriot doré"], autres: ["Arbalète"], porte: { c: 1 },
    conseil: "Le bestiaire conseille de boire un Loriot doré avant d'affronter un basilic, dont l'acide et le venin tuent bien plus sûrement que le regard, et de préparer Étoiles dansantes ou bombes à fragmentation. Contre le cocatrix, il recommande l'huile contre les draconides et la Ruche, dont la mitraille perce les ailes fragiles. Aard les cloue au sol ; mieux vaut ensuite frapper dans leur dos, à l'abri du bec et des ailes.",
    origine: "Deux monstres des bestiaires antiques et médiévaux. Le basilic, petit serpent redoutablement venimeux chez Pline l'Ancien, devient le roi des serpents qui tue d'un regard ; le cocatrix naît, dit-on, d'un œuf pondu par un coq et couvé par un crapaud. Le bestiaire du jeu balaie ces superstitions : ni l'un ni l'autre ne pétrifie personne, et le regard d'un cocatrix n'est pas plus dangereux que celui d'une oie en colère.",
    livres: "« Les Limites du possible » s'ouvre sur un basilic : près de Holopole, des paysans s'apprêtent à se partager les affaires du sorceleur, entré depuis trop longtemps dans une crypte en ruine, quand Geralt en ressort couvert de crasse, traînant la tête de la bête. Un chevalier de passage, Borch Trois-Choucas, avait déjà dissuadé les pillards. Les livres prêtent au basilic un bec d'oiseau, des ailes membraneuses, des crocs acérés et un fanon cramoisi.",
    lien: "epee-providence" },
  { id: "m-dragon", nom: "Dragon", en: "Dragon", cl: "Draconides",
    conseil: "Aucun véritable dragon à combattre dans TW3 : les draconides du bestiaire, wyverns, basilics ou cocatrix, n'en sont que de lointains parents.",
    origine: "Le dragon des légendes européennes, grand reptile ailé gardien de trésors. Dans le monde du Sorceleur, il reste attiré par l'or, mais Sapkowski en fait une espèce menacée, que les humains traquent bien plus qu'elle ne les menace.",
    livres: "Dans « Les Limites du possible », Geralt rappelle qu'il ne tue pas les dragons, et une chasse au dragon tourne à la farce sanglante. Un dragon affaibli par un mouton farci de poisons attire une foule hétéroclite : le roi Niedamir, qui convoite le titre de tueur de dragon, des chevaliers, des mercenaires, des nains et des magiciens, Yennefer comprise. Les livres classent les dragons par couleur, verts, noirs, rouges ou blancs, et les montrent au bord de l'extinction.",
    lien: "borch" },
  { id: "m-griffon", nom: "Griffon", en: "Griffin, Archgriffin", cl: "Hybrides", signes: ["Aard"], bombes: ["Ruche"], autres: ["Arbalète"], porte: { c: 0 },
    conseil: "Le bestiaire ne lui connaît pas de vraie faiblesse, hormis l'huile contre les hybrides et certaines bombes : il liste la Ruche, ainsi qu'Aard. Le griffon fond sur sa proie de très haut, puis l'achève du bec et des serres, et les plaies qu'il inflige saignent abondamment. Aard ou l'arbalète le ramènent au sol, où il vaut mieux rester au corps à corps, pour l'empêcher de bondir, et frapper ses flancs.",
    origine: "Mi-aigle, mi-lion, le griffon vient de l'Antiquité et peuple les blasons du Moyen Âge. Le jeu s'en amuse : un témoin décrit une bête « comme sur le blason du seigneur », sauf qu'elle emportait sa vache morte au lieu d'un sceptre. Le bestiaire, qui le dit plutôt mi-aigle, mi-chat sauvage, rappelle que les griffons s'unissent pour la vie et défendent leur compagnon jusqu'à la mort." },
  { id: "m-harpies", nom: "Harpies", en: "Harpy, Erynia", cl: "Hybrides", signes: ["Aard"], bombes: ["Ruche"], autres: ["Arbalète"], porte: { c: 1 },
    conseil: "Le bestiaire liste la Ruche, Aard et l'huile contre les hybrides. Les harpies chassent en volées de quelques individus à une vingtaine : elles plongent pour frapper une victime à la fois, puis remontent hors d'atteinte. Au sol, elles deviennent lentes et maladroites. Aard en balayage, l'arbalète ou une Ruche les font tomber, et une harpie renversée s'achève d'un seul coup.",
    origine: "Dans la mythologie grecque, les Harpies sont des démons ailés à visage de femme, ravisseuses, qui souillent tout ce qu'elles touchent. Le jeu en garde surtout l'odeur : leurs nids, perchés sur les falaises, puent la charogne et la fiente au point que même les rats les évitent. Le bestiaire ajoute que, contrairement à la plupart des monstres, elles amassent un trésor, car elles adorent ce qui brille." },
  { id: "m-sirenes", nom: "Sirènes", en: "Siren", cl: "Hybrides", signes: ["Aard", "Igni"], bombes: ["Ruche"], autres: ["Arbalète"], porte: { c: 1 },
    conseil: "Le bestiaire conseille d'abîmer leurs ailes pour les forcer à se poser, car au sol elles sont presque sans défense ; il liste Igni, Aard, la Ruche et l'huile contre les hybrides. Elles chassent en groupe, aussi vives dans l'eau que dans l'air. Une sirène blessée pousse un cri qui étourdit pendant que ses sœurs plongent sur l'adversaire. Le feu leur fait grand mal, et une contre-attaque bien placée les cloue au sol.",
    origine: "Le jeu les montre ailées, plus proches des sirènes de la mythologie grecque, mi-femmes mi-oiseaux, qui chantaient pour Ulysse, que de la femme-poisson d'Andersen. Selon le bestiaire, elles prennent l'apparence de belles jeunes femmes à queue d'écailles argentées, dont le visage se change en gueule de poisson garnie de crocs dès qu'un marin s'approche. Une légende veut qu'elles aient jadis été amicales envers les hommes.",
    livres: "Bien différentes de celles du jeu, les sirènes des livres sont des êtres marins doués de raison : l'une d'elles est au cœur d'« Une once d'abnégation ». Dans la nouvelle, le duc Agloval, épris de la sirène Sh'eenaz, engage Geralt comme interprète, car il parle la Langue ancienne : il voudrait qu'elle échange sa queue contre des jambes, elle exige qu'il la rejoigne sous la mer. Jaskier et la barde Essi Daven sont du voyage.",
    lien: "essi" },
  { id: "m-succube", nom: "Succube", en: "Succubus", cl: "Hybrides", signes: ["Quen"], immun: "Axii", porte: { c: 2 },
    conseil: "Le bestiaire liste Quen et l'huile contre les hybrides ; Axii n'a pas de prise sur elles. Les succubes ne cherchent pas à tuer, mais acculées, elles se défendent avec une force surprenante : leurs pattes de bouc et leurs cornes brisent les os. Elles lancent aussi des gerbes de feu que seul Quen arrête. Aard ou le Vent du nord interrompent leurs sorts, et il ne faut plus leur laisser de répit.",
    origine: "La succube des démonologies médiévales vient séduire les hommes dans leur sommeil ; son pendant masculin est l'incube. Le bestiaire du jeu en fait des créatures mues non par la soif de sang mais par un désir insatiable : leurs avances, d'abord plaisantes, ont mené plus d'un homme à la folie, voire à la mort. Certaines prennent un malin plaisir à séduire les prêtres. Avec leurs pattes de bouc et leurs cornes, elles rappellent aussi les faunes et les satyres antiques." },
  { id: "m-arachas", nom: "Arachas", en: "Arachas", cl: "Insectoïdes", potions: ["Loriot doré"], porte: { c: 1 },
    conseil: "Le bestiaire liste le Loriot doré et l'huile contre les insectoïdes. L'arachas ouvre le combat en crachant son venin, puis tente d'agripper sa proie de ses palpes pour la mener à ses pinces. Trop massif pour Aard, il se protège de face et cloue sur place qui s'éloigne d'un jet de toile : il faut esquiver ses charges et frapper ses flancs ou son dos. Yrden le ralentit, Axii le fige le temps de le contourner.",
    origine: "Un monstre apparu dans The Witcher 2, dont le nom évoque l'arachnide. Le bestiaire de TW3 en fait une espèce invasive venue du grand Sud, qui a gagné le Nord au fil des décennies et s'est installée dans les forêts humides et les marais. Immobile, il se confond avec le sous-bois, car il cache son abdomen mou sous des troncs creux portés sur le dos. Un proverbe elfe conseille de laisser dormir les arachas." },
  { id: "m-endregas", nom: "Endriagues", en: "Endrega", cl: "Insectoïdes", potions: ["Loriot doré"], porte: { c: 1 },
    conseil: "Le bestiaire liste le Loriot doré et l'huile contre les insectoïdes. Les ouvrières, les plus nombreuses, attaquent en groupe, crachent de l'acide et empoisonnent par leurs morsures ; les guerrières frappent d'une queue en massue hérissée de piquants venimeux et chargent pour renverser. Elles saignent peu, mais l'huile leur fait grand mal. Axii étourdit une guerrière le temps de quelques coups, puis il faut reculer.",
    origine: "Le nom renvoie à l'Endriago, monstre du roman de chevalerie espagnol « Amadis de Gaule » : né d'un géant et de sa propre fille, hybride d'homme, d'hydre et de dragon, il hante une île déserte où le héros vient l'affronter. Dans le monde du Sorceleur, l'endriague devient un insectoïde vivant en colonies hiérarchisées, divisé en castes d'ouvrières et de guerrières, qui bâtit nids et cocons." },
  { id: "m-kikimores", nom: "Kikimorrhes", en: "Kikimore", cl: "Insectoïdes", signes: ["Igni"], potions: ["Miel blanc"], immun: "Axii", porte: { d: "bw" },
    conseil: "Le bestiaire liste Igni, le Miel blanc et l'huile contre les insectoïdes, et précise que les kikimorrhes sont totalement insensibles à Axii. Leur venin a une particularité : il fait grimper la toxicité du sorceleur, d'où l'intérêt du Miel blanc, qui la purge, au prix des autres potions actives. Les guerrières, cuirassées, crachent leur venin de loin et bondissent sur leur proie, escortées d'essaims d'ouvrières.",
    origine: "La kikimora des contes russes est un esprit domestique, bienveillant ou malfaisant selon la conduite des maîtres de maison, que la tradition plus récente installe aussi dans les marais. Sapkowski en a gardé le nom pour une sorte d'araignée géante, dont les jeux ont fait un insectoïde. Dans Blood and Wine, les kikimorrhes défendent leurs nids en essaims, et le bestiaire cite un chercheur amateur selon qui elles communiqueraient par des particules odorantes imperceptibles pour les humains.",
    livres: "C'est avec la carcasse d'une kikimorrhe que Geralt arrive à Blaviken, au début du « Moindre Mal ». La bête, une sorte d'araignée à la peau noire et sèche, à l'œil vitreux et aux crocs en aiguilles, dépasse de la couverture jetée sur le dos de l'âne. L'échevin Caldemeyn refuse de payer une prime, mais un garde suggère de la montrer au mage du coin : c'est ainsi que Geralt retrouve Stregobor. Plus tard, Stregobor comme Renfri comparent chacun l'autre à cette kikimorrhe.",
    lien: "blaviken" },
  { id: "m-nekkers", nom: "Nekkers", en: "Nekker", cl: "Ogroïdes", bombes: ["Vent du nord"], porte: { c: 0 },
    conseil: "Le bestiaire liste le Vent du nord et l'huile contre les ogroïdes. Un nekker seul est inoffensif, cinq sont dangereux, dix peuvent tuer un vétéran. Ils surgissent de leurs tunnels pour encercler leur proie, mais hésitent avant de frapper : il faut tuer les plus hardis d'abord. Un Vent du nord ou une Étoile dansante éclaircit la meute, Aard en renverse plusieurs, et seul un nid détruit à la bombe tarit les renforts.",
    origine: "Apparus dans The Witcher 2 : selon l'artbook de ce jeu, ils s'inspirent des créatures tapies sous un pont que Geralt affronte au début de « Quelque chose en plus ». Leur nom rappelle le nekker des Flandres et des Pays-Bas, un diable des rivières et des étangs, cousin du näcken scandinave. Le bestiaire les fait vivre en colonies dans les bois humides et brumeux, reliées par des tunnels, avec des guerriers plus forts que les autres." },
  { id: "m-trolls", nom: "Trolls", en: "Rock troll, Ice troll", cl: "Ogroïdes", signes: ["Quen"], porte: { c: 1 },
    conseil: "Le bestiaire conseille de les affronter de face, l'épée enduite d'huile contre les ogroïdes, car leur dos, cuirassé de roc ou de glace, encaisse les coups portés par-derrière. Ils lancent des pierres et leurs poings ne se parent pas : Quen, quelques coups rapides, puis un pas de côté. Aard ne déplace pas un troll des glaces, plus fort par tempête de neige. Certains trolls préfèrent parler, et adorent les devinettes.",
    origine: "Le troll vient du folklore scandinave, où il hante les rochers, les montagnes et les grottes et ne rend guère service aux humains. Le jeu en fait des ogroïdes de pierre ou de glace. Certains des premiers baragouinent la langue commune, raffolent des rimes et des énigmes, et mijotent des ragoûts où finissent humains, elfes et nekkers ; ceux des glaces, plus cruels, n'ont jamais appris à parler, ou l'ont oublié dans le froid éternel des sommets." },
  { id: "m-cyclope", nom: "Cyclope", en: "Cyclops", cl: "Ogroïdes", signes: ["Quen", "Axii"], immun: "Aard", porte: { c: 3 },
    conseil: "Le bestiaire liste Axii, Quen et l'huile contre les ogroïdes : sa masse rend Aard inutile, mais son esprit assez développé le laisse sensible à Axii, qui le désoriente un moment. Ses coups ne se parent pas, et quand il lève les deux bras, une onde de choc va suivre : il faut rouler vers ses flancs ou dans son dos, ne jamais rester en place, et garder Quen actif.",
    origine: "Le géant à l'œil unique de la mythologie grecque. Le bestiaire cite un voyageur qui proposait d'aiguiser un pieu, de le planter dans l'œil du cyclope puis de quitter la grotte déguisé en mouton, clin d'œil à Ulysse et à Polyphème dans l'Odyssée ; il est mort sur Spikeroog. Les cyclopes vivraient très longtemps : un spécimen étudié par les savants d'Oxenfurt avait plus de trois cents ans." },
  { id: "m-golems", nom: "Golems et élémentaires", en: "Golem, Elemental, Gargoyle", cl: "Élémentaires", bombes: ["Dimeritium"], porte: { c: 1 },
    conseil: "Le bestiaire liste la bombe de dimeritium et l'huile contre les créatures élémentaires ; contre les gargouilles, il ajoute Quen. Ces êtres ne saignent pas, ne craignent ni le feu ni le poison, et Aard ne les ébranle guère. Leurs coups ne se parent pas : esquiver la charge, frapper une ou deux fois, puis reculer. S'ils se protègent de leurs bras, inutile de frapper de face : mieux vaut passer dans leur dos.",
    origine: "Le golem vient de la tradition juive : une figure d'argile animée par un rite, dont la légende la plus célèbre est celle du rabbin Loew, à Prague, au XVIe siècle. Le bestiaire du jeu en fait de la matière inerte animée par un sort, serviteur ou gardien parfait qui n'a besoin ni de manger ni de boire. Les gargouilles, statues de pierre enchantées, gardent les laboratoires des mages, et les élémentaires de terre sont faits de boue, d'argile et de roche.",
    lien: "dimeritium" },
  { id: "m-djinn", nom: "Djinn", en: "Djinn", cl: "Élémentaires", bombes: ["Dimeritium"], porte: { c: 3 },
    conseil: "Le bestiaire, qui le range parmi les élémentaires, liste la bombe de dimeritium et l'huile correspondante : l'argent le blesse, l'acier ne lui fait rien. Un djinn lance en un instant foudre, glace et tempêtes, et se téléporte quand on le serre de près : les bombes de dimeritium étouffent ses sorts le temps de l'approcher.",
    origine: "Le djinn vient des croyances de l'Arabie et de l'islam ; le conte du pêcheur et du génie, dans les Mille et Une Nuits, a fixé l'image du génie enfermé dans un vase. Le bestiaire du jeu en fait un esprit de l'air, condensé conscient de cet élément au caractère le plus souvent exécrable. Seuls de très puissants mages parviennent à le capturer, pour puiser dans son énergie sans recourir aux sources de pouvoir habituelles.",
    livres: "Au cœur de la nouvelle « Le Dernier Vœu » : un djinn libéré d'une jarre, et la rencontre de Geralt avec Yennefer. Un matin de pêche, Geralt et Jaskier remontent une amphore scellée ; Jaskier l'ouvre malgré les mises en garde, et le djinn, loin d'exaucer ses vœux, l'étrangle. Geralt le chasse avec une formule d'exorcisme à laquelle il ne croyait guère, mais la gorge du barde est en piteux état : il faut trouver un mage à Rinde. Les livres distinguent quatre sortes de génies, une par élément, le djinn étant celui de l'air.",
    lien: "dernier-voeu" },
  { id: "m-chiens", nom: "Molosses de la Chasse sauvage", en: "Hound of the Wild Hunt", cl: "Élémentaires", signes: ["Igni", "Axii"], bombes: ["Dimeritium"], porte: { c: 4 },
    conseil: "Le bestiaire les dit nés, selon certains savants, de cristaux de glace magiques : Igni les fait souffrir, et Axii peut tempérer un instant leur rage. Il liste aussi la bombe de dimeritium et l'huile contre les créatures élémentaires. Ils chassent en meute et cherchent à renverser leur proie ; quand ils hérissent le sol de pointes de glace, il faut reculer. Ils gagnent en force par grand froid et sous une lune rouge.",
    origine: "Dans bien des légendes européennes de la Chasse sauvage, les cavaliers fantômes sont suivis d'une meute de chiens, comme les Cŵn Annwn du folklore gallois. Le jeu en fait des bêtes de glace qui courent avec la Chasse. Le bestiaire cite Essi Daven, qui rapporte des légendes où ces molosses s'égarent et descendent du ciel nocturne, semant le froid et la mort sur leur passage.",
    lien: "chasse" },
  { id: "m-betes", nom: "Loups, ours et autres bêtes", en: "Wolf, Bear, Warg", cl: "Bêtes", signes: ["Quen"], porte: { c: 0 },
    conseil: "L'huile contre les bêtes est la seule qui s'applique aussi bien à l'épée d'acier qu'à celle d'argent. Contre les loups et les wargs, le bestiaire ne cite pas d'autre faiblesse ; contre les ours, il ajoute Quen, précieux pour encaisser leurs coups de patte. Les loups chassent en meute, de quelques bêtes à plus d'une douzaine, et cherchent à encercler leur proie.",
    origine: "Des animaux bien réels, que le bestiaire range dans une classe à part. Le warg, sous-espèce de loup plus grosse et plus féroce, tire son nom du vieux norrois vargr, « loup », un mot que Tolkien a popularisé." },
  { id: "m-humains", nom: "Humains et non-humains", en: "Bandits, soldiers", cl: "Humains", porte: { c: 0 },
    conseil: "Bandits, soldats et mages se combattent à l'épée d'acier, enduite de venin du pendu. Un adversaire renversé par Aard peut être achevé d'un seul coup, et Quen absorbe un carreau d'arbalète. Contre les mages, la bombe de dimeritium les empêche de lancer leurs sorts." },
  { id: "m-guenaude-aquatique", nom: "Guenaude aquatique", en: "Water hag, Bilge hag", cl: "Nécrophages", signes: ["Quen", "Igni"], bombes: ["Vent du nord"], porte: { c: 1 },
    conseil: "Le bestiaire conseille la bombe Vent du nord, l'huile contre les nécrophages et les signes Quen et Igni. Elle aveugle de loin avec des boules de boue, puis fond sur sa proie, souvent en compagnie de noyeurs : esquivez les projectiles, gelez-la au Vent du nord et brûlez la meute à l'Igni.",
    origine: "Son nom polonais, baba wodna, signifie « la vieille des eaux ». Le bestiaire la décrit haute de près de deux mètres, ridée et couverte de verrues, avec des excroissances osseuses dans le dos, des algues en guise de cheveux et une puanteur de vase et de poisson. Les légendes la montrent déguisée en vieille femme inoffensive pour piéger les voyageurs." },
  { id: "m-guenaude-sepulcrale", nom: "Guenaude sépulcrale", en: "Grave hag", cl: "Nécrophages", signes: ["Yrden", "Quen"], potions: ["Sang noir"], porte: { c: 1 },
    conseil: "Le bestiaire recommande la potion Sang noir, l'huile contre les nécrophages et les signes Yrden et Quen. Ses griffes et sa longue langue préhensile frappent vite : ralentissez-la avec Yrden, gardez Quen actif, et laissez le Sang noir lui faire payer chaque blessure.",
    origine: "Son nom polonais, baba cmentarna, signifie « la vieille du cimetière ». Le jeu en fait une charognarde difforme qui rôde près des cimetières et des champs de bataille et aspire la moelle pourrie des os avec sa longue langue. Une fois tous les cadavres du voisinage dévorés, assure le bestiaire, elle s'en prend aux vivants et les enterre en attendant qu'ils pourrissent." },
  { id: "m-brumelin", nom: "Brumelin", en: "Foglet, Fogler", cl: "Nécrophages", signes: ["Quen"], bombes: ["Poussière de lune"], porte: { c: 1 },
    conseil: "Le bestiaire recommande la bombe Poussière de lune, l'huile contre les nécrophages et le signe Quen. Il se fond dans le brouillard, sème les illusions et frappe dans le dos : gardez Quen actif, ne suivez jamais une lueur dans la brume, et contrariez ses disparitions à la Poussière de lune.",
    origine: "Le bestiaire en fait un maître de l'illusion : il égare les voyageurs dans la brume, puis les pousse vers les marais et attend patiemment qu'ils s'y noient. Son nom polonais, mglak, vient de mgła, « brouillard ».",
    livres: "La saga le connaît sous le nom de brouillardier : dans « Le Dernier Vœu », Geralt le range parmi les monstres qu'il a traqués de contrat en contrat, aux côtés des goules, des vampires et des loups-garous.",
    lien: "dernier-voeu" },
  { id: "m-putrefacteur", nom: "Putréfacteur", en: "Rotfiend, Devourer", cl: "Nécrophages", porte: { c: 1 },
    conseil: "Le bestiaire ne cite que l'huile contre les nécrophages. Son corps est gorgé de gaz toxiques et inflammables qui explosent à sa mort, parfois dès qu'un Igni est lancé à la hâte : achevez-le puis reculez aussitôt, loin du reste de la meute. Le dévoreur en est une variété particulièrement dangereuse.",
    origine: "Apparu dans The Witcher 2, il prolifère, selon le bestiaire, autour des champs de bataille et des régions frappées par la maladie. Sa puanteur lui vaut son nom français, et son nom polonais, zgnilec, vient de zgniły, « pourri »." },
  { id: "m-vierge-peste", nom: "Vierge de la peste", en: "Plague maiden, Pesta", cl: "Spectres", signes: ["Yrden"], porte: { c: 1 },
    conseil: "Le bestiaire ne cite que l'huile contre les spectres et le signe Yrden, et avoue qu'on sait peu de chose sur la façon de la combattre. Elle lâche des nuées d'insectes porteurs de maladie : dissipez-les à l'épée d'argent ou à l'Igni, puis piégez-la dans Yrden pour frapper.",
    origine: "Le bestiaire l'appelle aussi pesta : dans le folklore norvégien, la Pesta est une vieille femme qui personnifie la Peste noire et passe de ferme en ferme. Le jeu la montre en femme aux chairs rongées, suivie d'une armée de rats. Son nom polonais, dziewica moru, signifie lui aussi « vierge de la peste »." },
  { id: "m-celicole", nom: "Célicole", en: "Godling", cl: "Vestiges", porte: { c: 1 },
    conseil: "Aucun combat contre un célicole : ces petites créatures des bois, que l'on confond avec les lutins, veillent en secret sur les gens et les bêtes qui vivent près de leur terrier. Elles ne se montrent volontiers qu'aux enfants et ne demandent en échange que du respect et quelques offrandes, nourriture ou vieux outils.",
    origine: "Il s'inspire de l'ubożę du folklore polonais, un esprit domestique bienveillant né, disait-on, des âmes des ancêtres. Le nom anglais, godling, signifie « petit dieu ». Selon le bestiaire, le célicole a l'esprit farceur d'un enfant et quitte pour toujours un village devenu trop peuplé ou oublieux des vieilles coutumes." },
  { id: "m-gargouille", nom: "Gargouille", en: "Gargoyle", cl: "Élémentaires", signes: ["Quen"], bombes: ["Dimeritium"], porte: { c: 1 },
    conseil: "Le bestiaire conseille la bombe de dimeritium, l'huile contre les élémentaires et le signe Quen. Trop lourde pour Aard, insensible au feu, elle lance des blocs de pierre et ses coups ne se parent pas : esquivez, ralentissez-la avec Yrden et ne restez pas face à elle.",
    origine: "Les gargouilles des églises médiévales, gouttières sculptées en forme de monstres, ont inspiré ces statues animées par magie pour garder le repaire ou le laboratoire d'un mage. Elles apparaissaient déjà dans The Witcher 2." },
  { id: "m-elementaire-feu", nom: "Élémentaire de feu", en: "Fire elemental", cl: "Élémentaires", signes: ["Aard"], bombes: ["Dimeritium", "Vent du nord"], porte: { c: 2 },
    conseil: "Le bestiaire recommande la bombe de dimeritium, le Vent du nord, l'huile contre les élémentaires et le signe Aard. Surtout pas d'Igni, qui le renforce : gelez-le au Vent du nord, étouffez un instant ses flammes avec Aard, et gardez vos distances avec sa chaleur de fournaise.",
    origine: "Selon le bestiaire, il naît de rituels magiques complexes, dans un seul but : la destruction. Le tout premier aurait réduit en cendres le laboratoire de son créateur, et les bâtiments voisins avec." },
  { id: "m-arachas-cuirasse", nom: "Arachas cuirassé", en: "Armored arachas", cl: "Insectoïdes", potions: ["Loriot doré"], porte: { c: 3 },
    conseil: "Le bestiaire recommande le Loriot doré et l'huile contre les insectoïdes. Là où l'arachas commun abrite son abdomen fragile dans une souche creuse, celui-ci porte une carapace naturelle : un mastodonte qui renverse et piétine ses victimes. Prévoyez potions de soin et carreaux d'arbalète pour un combat long et épuisant." },
  { id: "m-arachas-venimeux", nom: "Arachas venimeux", en: "Venomous arachas", cl: "Insectoïdes", potions: ["Loriot doré"], porte: { c: 3 },
    conseil: "Le bestiaire recommande le Loriot doré et l'huile contre les insectoïdes. Quelques gouttes de son venin tuent un homme, et il libère au contact un nuage irrespirable : affaiblissez-le à distance, bombes et arbalète, puis achevez-le à l'épée d'argent." },
  { id: "m-penitent", nom: "Pénitent", en: "Penitent", cl: "Spectres", signes: ["Yrden", "Quen"], bombes: ["Poussière de lune"], porte: { c: 3 },
    conseil: "Le bestiaire recommande la Poussière de lune, l'huile contre les spectres et les signes Yrden et Quen. Ce spectre rare noie les lieux qu'il hante sous la brume et les ténèbres, puis surgit dans le dos de l'ennemi : restez en mouvement, et cherchez ce qui le retient en ce monde pour briser ce lien au plus vite.",
    origine: "Création du jeu. Son nom polonais, pokutnik, désigne comme en français celui qui fait pénitence." },
  { id: "m-berserker", nom: "Berserker", en: "Werebear, Berserker", cl: "Maudits", signes: ["Quen", "Igni"], bombes: ["Vesse-de-loup du diable"], porte: { c: 3 },
    conseil: "Le bestiaire recommande la Vesse-de-loup du diable, l'huile contre les créatures maudites et les signes Quen et Igni. Selon les chants des skaldes, l'ours qu'il devient ne sent pas la douleur et referme ses plaies en un instant : gardez Quen contre ses charges et ne lui laissez aucun répit.",
    origine: "Les berserkers sont les guerriers-fauves des sagas scandinaves, dont le nom viendrait d'une « chemise d'ours ». Le jeu les range parmi les créatures maudites : à Skellige, on raconte que ces hommes se changent en ours assoiffés de sang dans la fureur du combat, et l'on en menace les enfants qui ne finissent pas leur soupe.",
    lien: "skellige" },
  { id: "m-ulfhedinn", nom: "Ulfhedinn", en: "Ulfhedinn, Voref", cl: "Maudits", signes: ["Igni"], bombes: ["Poussière de lune", "Vesse-de-loup du diable"], porte: { c: 3 },
    conseil: "Le bestiaire recommande la Poussière de lune, la Vesse-de-loup du diable, l'huile contre les créatures maudites et le signe Igni. Ce loup-garou de Skellige, plus fort que ceux du continent, redouble de fureur près de la mort et peut appeler des loups à son secours : finissez-le vite. Les plus vieux, les vorefs, sont redoutables.",
    origine: "Les úlfheðnar, « peaux de loup », étaient des guerriers scandinaves cousins des berserkers, qui combattaient vêtus de peaux de loup. Le jeu en fait une espèce de loup-garou propre à Skellige, dont les rares vainqueurs sont chantés par les skaldes.",
    lien: "skellige" },
  { id: "m-geant-glace", nom: "Géant de glace", en: "Ice giant", cl: "Ogroïdes", signes: ["Quen"], porte: { c: 3 },
    conseil: "Le bestiaire recommande l'huile contre les ogroïdes et le signe Quen. Plus grand qu'un arbre, il semble doué de raison, mais toute tentative de dialogue s'est soldée par la mort de l'interlocuteur : gardez Quen actif et esquivez sans relâche, car chaque coup peut être fatal.",
    origine: "Il rappelle les géants du givre de la mythologie nordique. Le bestiaire voit en lui, peut-être, le dernier de son espèce : un colosse primitif à la peau bleue comme le givre.",
    lien: "skellige" },
  { id: "m-elementaire-glace", nom: "Élémentaire de glace", en: "Ice elemental", cl: "Élémentaires", bombes: ["Dimeritium"], porte: { c: 5 },
    conseil: "Le bestiaire ne cite que la bombe de dimeritium, dont les éclats perturbent le sort qui l'anime, et l'huile contre les élémentaires. Insensible au poison comme au feu, il frappe de ses poings sans qu'on puisse parer : esquivez, ralentissez-le avec Yrden, et évitez de l'attaquer de face.",
    origine: "Une masse d'eau glacée animée par magie, sans conscience ni volonté : il obéit aveuglément au mage qui l'a créé, et ses ordres tiennent généralement en un seul mot, tuer." },
  { id: "m-demon-puits", nom: "Démon près du puits", en: "Devil by the Well", cl: "Spectres", signes: ["Yrden"], bombes: ["Poussière de lune"], porte: { c: 0 },
    conseil: "Spécimen unique : un spectre de midi qui hante un puits de Blanchefleur. Le bestiaire recommande la Poussière de lune, l'huile contre les spectres et le signe Yrden. Il faut d'abord découvrir ce qui le lie à cet endroit ; au combat, piégez-le dans Yrden pour le forcer à prendre corps, et dissipez ses doubles.",
    origine: "Les villageois parlent d'un démon, mais c'est un spectre de midi qui hante le puits. Ces apparitions, qui frappent en plein soleil, viennent tout droit du folklore slave, où l'esprit de midi (la południca polonaise) hante les champs.",
    lien: "verger-blanc" },
  { id: "m-fourbe-veuve", nom: "Fourbe-veuve", en: "Mourntart", cl: "Nécrophages", signes: ["Yrden", "Quen"], potions: ["Sang noir"], porte: { c: 1 },
    conseil: "Spécimen unique : une guenaude sépulcrale enhardie par l'âge, qui tourmente les habitants de Valtilleul. Le bestiaire recommande le Sang noir, l'huile contre les nécrophages et les signes Yrden et Quen. Ses griffes brisent toute parade, et ses attaques vont plus vite que les réflexes d'un sorceleur : Yrden est indispensable.",
    lien: "velen" },
  { id: "m-ignis-fatuus", nom: "Ignis Fatuus", en: "Ignis Fatuus", cl: "Nécrophages", signes: ["Quen"], bombes: ["Poussière de lune"], porte: { c: 1 },
    conseil: "Spécimen unique : un brumelin très ancien, de ceux qui vivent parfois plus de deux cents ans, qui hante les tourbières de Velen. Le bestiaire recommande la Poussière de lune, l'huile contre les nécrophages et le signe Quen. Trop rapide pour Yrden, il frappe trop fort pour qu'on pare : armure lourde ou Quen, et méfiance envers ses illusions.",
    origine: "Ignis fatuus, « feu fou » en latin, est le nom savant du feu follet, cette lueur des marais qui égare les voyageurs.",
    lien: "velen" },
  { id: "m-harrisi", nom: "Harrisi", en: "Harrisi", cl: "Insectoïdes", potions: ["Loriot doré"], porte: { c: 1 },
    conseil: "Spécimen unique : un arachas venimeux devenu énorme dans une mine désaffectée de Velen. Le bestiaire recommande le Loriot doré et l'huile contre les insectoïdes, et précise que les signes Igni, Aard et Yrden ainsi que la bombe Vent du nord le gênent. Une Hirondelle avant le combat ne sera pas de trop.",
    lien: "velen" },
  { id: "m-kernun", nom: "Kernun", en: "Kernun", cl: "Vestiges", signes: ["Igni"], bombes: ["Dimeritium"], porte: { c: 2 },
    conseil: "Spécimen unique : un leshen ancien et puissant qui massacre les imprudents dans les bois autour de Novigrad. Le bestiaire recommande la bombe de dimeritium, l'huile contre les vestiges et le signe Igni, et rappelle que Quen protège bien de ses coups. Le combat est long : brûlez-le sans relâche.",
    origine: "Son nom évoque Cernunnos, le dieu cornu des Celtes, associé aux bêtes sauvages.",
    lien: "novigrad" },
  { id: "m-dame-blanche", nom: "La Dame blanche", en: "The White Lady", cl: "Spectres", signes: ["Yrden"], bombes: ["Poussière de lune"], porte: { c: 2 },
    conseil: "Spécimen unique : un spectre de midi qui empêche toute récolte dans les champs autour de Novigrad. Le bestiaire recommande la Poussière de lune, l'huile contre les spectres et le signe Yrden. Dissipez ses illusions à la lame d'argent, piégez-la dans Yrden, puis enchaînez attaques puissantes et Igni.",
    origine: "Les dames blanches peuplent les légendes de toute l'Europe : des apparitions féminines vêtues de blanc, souvent liées à une mort tragique.",
    lien: "novigrad" },
  { id: "m-gael", nom: "Gaël", en: "Gael", cl: "Vampires", signes: ["Yrden", "Igni"], bombes: ["Poussière de lune", "Vesse-de-loup du diable"], porte: { c: 2 },
    conseil: "Spécimen unique : un katakan d'Oxenfurt qui s'est pris de goût pour le sang chargé d'alcool des étudiants. Le bestiaire recommande la Poussière de lune, la Vesse-de-loup du diable, l'huile contre les vampires et les signes Yrden et Igni. Il disparaît pour resurgir dans le dos : Quen pare ce tour, Yrden le piège.",
    lien: "oxenfurt" },
  { id: "m-abaya", nom: "Abaya", en: "Abaya", cl: "Nécrophages", signes: ["Quen", "Igni"], bombes: ["Vent du nord"], porte: { c: 3 },
    conseil: "Spécimen unique : une guenaude aquatique particulièrement retorse, terrée dans une grotte près de la baie de Kaer Trolde. Le bestiaire recommande le Vent du nord, l'huile contre les nécrophages et les signes Quen et Igni. Elle aveugle à distance avant de charger : Yrden pour la ralentir, Quen pour encaisser.",
    lien: "kaer-trolde" },
  { id: "m-morvudd", nom: "Morvudd", en: "Morvudd", cl: "Vestiges", bombes: ["Samum", "Vesse-de-loup du diable"], porte: { c: 3 },
    conseil: "Spécimen unique : un fiellon imposant qui chasse dans des ruines oubliées de Skellige. Le bestiaire recommande les bombes Samum et Vesse-de-loup du diable et l'huile contre les vestiges. Une seconde d'inattention, et son troisième œil vous hypnotise : armure lourde ou Quen, et attaques puissantes plutôt que rapides.",
    lien: "skellige" },
  { id: "m-melusine", nom: "Mélusine", en: "Melusine", cl: "Hybrides", signes: ["Igni", "Aard"], bombes: ["Ruche"], autres: ["Arbalète"], porte: { c: 3 },
    conseil: "Spécimen unique : une gigantesque cousine des sirènes, que certains insulaires vénéraient comme une demi-déesse, et qui vit dans les cavernes proches de Svorlag. Le bestiaire recommande la bombe Ruche, l'huile contre les hybrides et les signes Igni et Aard. Prévoyez des carreaux d'arbalète de la meilleure qualité pour la ramener au sol.",
    origine: "Elle porte le nom de la fée Mélusine des légendes françaises, femme-serpent liée à la maison de Lusignan. Son espèce, l'ekhidna de la version originale, emprunte son nom à Échidna, mi-femme, mi-serpent de la mythologie grecque.",
    lien: "skellige" },
  { id: "m-tape-tapeur", nom: "Tape-tapeur", en: "Wham-a-Wham", cl: "Ogroïdes", signes: ["Quen"], porte: { c: 3 },
    conseil: "Spécimen unique : un énorme troll de pierre installé dans une caverne de Skellige où court un filon d'argent. Le bestiaire recommande l'huile contre les ogroïdes et le signe Quen. Sa peau de pierre arrête presque tous les coups, surtout dans le dos, où elle est la plus épaisse : ralentissez-le avec Yrden et esquivez ses coups de boutoir.",
    origine: "Son surnom imite le parler du troll lui-même : dans la citation du bestiaire, il explique que les mineurs ont cogné sur les rochers de sa maison, alors il a cogné lui aussi.",
    lien: "skellige" },
  { id: "m-hagubman", nom: "Hagubman", en: "Hagubman", cl: "Ogroïdes", bombes: ["Vent du nord"], porte: { c: 3 },
    conseil: "Spécimen unique : un guerrier nekker plus fort et plus malin que ses congénères, qui tend des embuscades près de Larvik, sur Hindarsfjall. Le bestiaire recommande le Vent du nord et l'huile contre les ogroïdes. Comme tous les nekkers, il craint tous les signes, et ses coups se parent et se contrent sans peine.",
    lien: "skellige" },
  { id: "m-arachnomorphe", nom: "Arachnomorphe", en: "Arachnomorph", cl: "Insectoïdes", signes: ["Aard", "Axii"], porte: { d: "hos" },
    conseil: "Le bestiaire recommande l'huile contre les insectoïdes et les signes Aard et Axii. Inutile de fuir, personne ne le distance. Il crache une toile qui entrave sa proie : esquivez-la, puis étourdissez-le à l'Aard ou figez-le avec Axii avant de frapper. Les arachnomorphes colosses sont plus dangereux encore.",
    origine: "Selon le bestiaire, ce lointain cousin des araignées est arrivé avec la Conjonction des Sphères. Il préfère les grottes profondes et les marais déserts, et on le croise dans les deux extensions du jeu.",
    lien: "conjonction" },
  { id: "m-creatures-etherees", nom: "Créatures éthérées", en: "Ethereal", cl: "Spectres", potions: ["Blizzard"], porte: { d: "hos" },
    conseil: "Le bestiaire recommande l'huile contre les spectres et la potion Blizzard. Elles se relaient, chacune plus forte que la précédente, et frapper celles qui attendent leur tour les réveille : concentrez-vous sur un seul adversaire et misez sur des contre-attaques bien placées.",
    origine: "Création de Hearts of Stone : des cauchemars nés de peurs enfouies, qui prennent corps et forme humaine." },
  { id: "m-garkain", nom: "Garkain", en: "Garkain, Alpha garkain", cl: "Vampires", bombes: ["Poussière de lune", "Samum"], potions: ["Sang noir"], porte: { d: "bw" },
    conseil: "Le bestiaire recommande le Sang noir, l'huile contre les vampires et les bombes Samum et Poussière de lune, efficaces contre ses attaques mentales. Il ne court pas mais bondit de loin, et tente de désorienter sa proie par des visions. Il mène souvent une meute de vampires inférieurs : abattez-le en premier.",
    origine: "Le nom vient d'une créature de la mythologie aborigène d'Australie. Les jeux en ont fait un vampire inférieur, déjà présent dans le premier The Witcher, qui se délecte de mettre ses victimes en pièces.",
    lien: "vampires" },
  { id: "m-noctule", nom: "Noctule", en: "Fleder, Protofleder", cl: "Vampires", potions: ["Sang noir"], porte: { d: "bw" },
    conseil: "Le bestiaire ne cite que l'huile contre les vampires et le Sang noir. Vampire inférieur peu intelligent, il ne court pas : il bondit pour renverser sa proie, puis frappe à l'aveugle, griffes et crocs. Anticipez ses sauts, esquivez sur le côté et contre-attaquez vite.",
    origine: "La version française lui donne le nom d'une vraie chauve-souris d'Europe, la noctule, là où l'original dit fleder, qui évoque l'allemand Fledermaus. Il apparaissait déjà dans le premier The Witcher.",
    livres: "La traduction française des livres l'appelle flèdre : dans « Le Baptême du feu », les flèdres et les ekimmes sont cités parmi les vampires qui s'acharnent sauvagement sur les restes de leurs victimes, contrairement aux vampires supérieurs.",
    lien: "bapteme-feu" },
  { id: "m-barghest", nom: "Barghest", en: "Barghest", cl: "Spectres", signes: ["Axii", "Yrden"], bombes: ["Poussière de lune"], porte: { d: "bw" },
    conseil: "Le bestiaire recommande la Poussière de lune, l'huile contre les spectres et les signes Axii et Yrden. On ne peut pas les enflammer. Ces chiens fantômes chassent en meute, encerclent leur proie et crachent un feu spectral si elle résiste : isolez-les un à un, et gardez Quen contre leurs flammes.",
    origine: "Le barghest est un chien noir monstrueux du folklore du nord de l'Angleterre, présage de mort. Pour les sorceleurs, il naît d'une malédiction ou d'une rancune accumulée, toujours lié à une tragédie passée. Dans le premier The Witcher, des meutes de barghests semaient déjà la terreur aux portes de Vizima." },
  { id: "m-slyzard", nom: "Slyzard", en: "Slyzard, Dracolizard", cl: "Draconides", signes: ["Aard", "Quen"], bombes: ["Ruche"], autres: ["Arbalète"], porte: { d: "bw" },
    conseil: "Le bestiaire recommande la bombe Ruche, l'huile contre les draconides et les signes Aard et Quen. On le confond à tort avec une wyvern : il crache le feu, renverse d'une onde sonore et frappe de sa queue venimeuse. Le feu ne le brûle pas. Clouez-le au sol à l'arbalète ou à l'Aard, et gardez Quen contre ses boules de feu.",
    origine: "La créature vient des livres de Sapkowski, où ce grand reptile volant gris, parfois aussi gros qu'un dragon, est souvent pris pour l'un d'eux. Son nom polonais est oszluzg, rendu par « gluasse » dans la traduction française des livres." },
  { id: "m-ekinoppyre", nom: "Ékinoppyre", en: "Archespore", cl: "Maudits", signes: ["Aard", "Igni"], porte: { d: "bw" },
    conseil: "Le bestiaire recommande l'huile contre les créatures maudites et les signes Aard et Igni. Plante géante aux feuilles en mâchoires, elle crache un acide toxique et ses cosses explosent. Comme toute plante, elle craint le feu, et les ondes de choc la font fuir sous terre : reculez dès qu'elle s'enfonce, car la cosse qu'elle laisse éclate.",
    origine: "Selon la croyance populaire que rapporte le bestiaire, elle pousse sur un sol abreuvé du sang des mourants, là où ont eu lieu pogroms, rituels sanglants ou meurtres cruels. Le bestiaire en distingue quatre variétés selon leur couleur. Son nom anglais, archespore, est emprunté à la botanique. Le premier The Witcher connaissait déjà les ékinoppyres." },
  { id: "m-scolopendromorphe", nom: "Scolopendromorphe", en: "Giant centipede, Pale widow", cl: "Insectoïdes", signes: ["Yrden"], porte: { d: "bw" },
    conseil: "Le bestiaire recommande l'huile contre les insectoïdes et le signe Yrden. Sa carapace dévie les coups d'épée comme les signes, et il pare avant de riposter : piégez-le dans Yrden quand il sort de terre, il ne pourra ni se protéger ni s'enfouir. Frappez par l'avant, et reculez quand il s'enroule.",
    origine: "Son nom savant renvoie aux scolopendromorphes, un véritable ordre de mille-pattes. En Toussaint, selon le bestiaire, il vit sous terre en bon voisinage avec les shaelmaars et se nourrit des petites bêtes qui mangent leurs déjections.",
    livres: "Les livres le connaissent : dans la nouvelle « L'Épée de la providence », Geralt et la dryade Braenn tombent en Brokilone sur un scolopendromorphe qui menace une petite silhouette égarée dans la forêt.",
    lien: "epee-providence" },
  { id: "m-shaelmaar", nom: "Shaelmaar", en: "Shaelmaar", cl: "Vestiges", signes: ["Aard"], bombes: ["Samum"], porte: { d: "bw" },
    conseil: "Le bestiaire recommande la bombe Samum, l'huile contre les vestiges et le signe Aard. Aveugle, il se guide aux sons et aux vibrations, et ses plaques dorsales arrêtent les coups les plus forts. Quand il se roule en boule pour charger, écartez-vous près d'un mur, et frappez son ventre dès qu'il s'y assomme.",
    origine: "En polonais, il porte le nom de szarlej, un esprit des mines du folklore silésien, gardien des richesses souterraines. Le jeu en fait une bête fouisseuse qui vit dans les profondeurs, de Toussaint à Mahakam, et remonte parfois dévorer les imprudents.",
    lien: "toussaint" },
  { id: "m-spriggan", nom: "Spriggan", en: "Spriggan", cl: "Vestiges", signes: ["Igni"], bombes: ["Dimeritium"], porte: { d: "bw" },
    conseil: "Le bestiaire recommande la bombe de dimeritium, l'huile contre les vestiges et le signe Igni. Sous-espèce de leshen, plus rapide que lui, il punit quiconque abîme la végétation de son domaine : brûlez-le à l'Igni et gardez Quen si les coups pleuvent. Le dimeritium bloque aussi vos propres signes.",
    origine: "Les spriggans viennent des contes de Cornouailles, où ces êtres laids gardent les trésors enfouis et peuvent prendre une taille gigantesque. La version polonaise du jeu l'appelle borowik.",
    lien: "toussaint" },
  { id: "m-necrophage-tachete", nom: "Nécrophage tacheté", en: "Spotted wight", cl: "Nécrophages", signes: ["Igni", "Yrden"], porte: { d: "bw" },
    conseil: "Le bestiaire recommande l'huile contre les nécrophages et les signes Igni et Yrden. Paisible tant qu'on le laisse tranquille, il devient très dangereux dès qu'on le menace ; le froid le plonge dans la léthargie, et les sorceleurs, dit-on, comptaient sur Yrden pour en venir à bout.",
    origine: "Création de l'extension. Couvert de taches et de pustules, il hante les cimetières abandonnés et les maisons désertes, où il s'adonne à sa grande passion selon le bestiaire : brasser des breuvages à partir de ses propres sécrétions." }
],
