  rev: "À Thanedd, il tente encore de s'emparer de Ciri ; elle le blesse à la main, dont il ne pourra plus plier deux doigts, et l'épargne en découvrant le visage d'un jeune homme sous le heaume. Geralt l'épargne à son tour quand Cahir lui affirme avoir tiré la fillette des flammes de Cintra. Il meurt à Stygga, tué par Leo Bonhart, en couvrant la fuite de Ciri et d'Angoulême.",
  dans: ["temps-mepris", "bapteme-feu", "tour-hirondelle", "dame-lac"],
  voir: ["ciri", "cintra", "nilfgaard", "bonhart"] },

{ id: "angouleme", t: "perso", src: "L", nom: "Angoulême", alias: [],
  role: "Jeune hors-la-loi",
  resume: "Gouailleuse et intrépide, elle rejoint la compagnie de Geralt dans la dernière partie de la saga.",
  livres: "Jeune Cintrienne aux cheveux clairs, si semblable à Ciri que Geralt s'y méprend au premier regard, elle est la fille illégitime d'une famille noble : placée chez des parents éloignés puis dans un orphelinat sordide, elle s'en est enfuie avec d'autres orphelins pour mener une vie de brigande, jusque dans la bande du Rossignol. Dans « La Tour de l'Hirondelle », Geralt la découvre entre les mains de Fulko Artevelde, gouverneur d'une ville sous la coupe de Nilfgaard, à qui elle a révélé une embuscade préparée contre le sorceleur ; il exige qu'on la lui confie et lui évite ainsi le gibet. Reconnaissante, elle se joint à la compagnie. Gouailleuse, effrontée et intrépide, elle appelle les hommes ses oncles et Milva sa tante, ce qui exaspère l'archère au plus haut point. En Toussaint, elle rêve tout haut d'ouvrir une maison close de luxe à Beauclair.",
  rl: "dame-lac",
  rev: "À Stygga, blessée à la cuisse en combattant aux côtés de Ciri, elle s'effondre en fuyant avec elle, vidée de son sang. Avant de mourir dans les bras de Ciri, elle demande à la reine de Cintra de faire d'elle une comtesse.",
  dans: ["tour-hirondelle", "dame-lac"],
  voir: ["geralt", "milva"] },

{ id: "bonhart", t: "perso", src: "L", nom: "Leo Bonhart", alias: [],
  role: "Chasseur de primes",
  resume: "Bretteur redoutable et cruel, peut-être le plus dangereux adversaire de la saga.",
  livres: "Ancien soldat originaire d'Ebbing devenu chasseur de primes, Leo Bonhart est un homme très grand, d'une maigreur de cadavre, à l'immense moustache grise et aux yeux inexpressifs de poisson. Il coûte cher, travaille bien et prend plaisir à la cruauté. À son cou pendent trois médaillons de sorceleur, une tête de loup, une de chat et une de griffon : il prétend avoir tué leurs propriétaires, et son habileté à l'épée rend la chose plausible. C'est dans « La Tour de l'Hirondelle » qu'il croise la route de Ciri.",
  rl: "dame-lac",
  rev: "Engagé à la fois pour tuer Ciri et pour la capturer vivante, il ne remplit aucun des deux contrats : il massacre les Rats, garde Ciri pour lui, la bat, la drogue et la force à tuer dans l'arène de Claremont, propriété de son cousin Houvenaghel ; c'est lui qui lui achète son épée, Zireael. Elle lui échappe, et il la traque jusqu'à Tor Zireael avec Stefan Skellen et Rience, sur ordre de Vilgefortz. À Stygga, il tue Cahir avant de tomber, en duel, sous la lame de Ciri.",
  dans: ["tour-hirondelle", "dame-lac"],
  voir: ["ciri", "medaillon", "vilgefortz"] },

{ id: "vilgefortz", t: "perso", src: "L", nom: "Vilgefortz", alias: ["Vilgefortz de Roggeveen"],
  role: "Magicien du Chapitre",
  resume: "Brillant, séduisant et respecté, l'un des magiciens les plus puissants du Nord.",
  livres: "Héros de la bataille de Sodden, où il menait les magiciens du Nord, Vilgefortz de Roggeveen siège au Chapitre et passe pour un modèle de sagesse auprès de ses pairs. Il paraît trente-cinq ans ; grand, bien bâti, d'une beauté diabolique, il est doté d'une voix sincère et d'un talent hors du commun. Enfant abandonné dans un caniveau de Lan Exeter, il a été recueilli et élevé par les druides du Cercle de Kovir. Toujours accompagné de son assistante, Lydia van Bredevoort, il entraîne Geralt, la veille du conclave de Thanedd, dans une longue promenade philosophique, dans « Le Temps du mépris ».",
  rl: "dame-lac",
  rev: "Allié secret d'Emhyr depuis l'époque où l'empereur se cachait à Cintra sous le nom de Duny, il orchestre le coup de Thanedd. Libéré de ses fers de dimeritium, il écrase Geralt en duel avec un simple bâton, mais le portail de Tor Lara, que Ciri vient de franchir, explose et lui coûte un œil, remplacé par une pierre taillée qui lui permet de voir. Son agent Rience traque Ciri depuis « Le Sang des elfes » : il veut s'approprier le pouvoir de son Sang Ancien et mène dans ses repaires d'horribles expériences sur des femmes. Il capture et torture Yennefer. À Stygga, il anéantit Regis, avant que Geralt, aidé d'une amulette d'illusion, ne le décapite.",
  dans: ["temps-mepris", "bapteme-feu", "tour-hirondelle", "dame-lac"],
  voir: ["thanedd", "rience", "conseil", "stygga"] },

{ id: "rience", t: "perso", src: "L", nom: "Rience", alias: [],
  role: "Espion et mage",
  resume: "Un mystérieux agent qui recherche Ciri et ne recule devant rien pour obtenir des informations.",
  livres: "Ce mage de second ordre sillonne le Nord à la recherche de Ciri, laissant derrière lui un druide du Cercle d'Angren torturé et une famille de paysans massacrée. Dans « Le Sang des elfes », attiré par la ballade de Jaskier sur le Lionceau de Cintra, il fait passer le barde à la question ; Yennefer intervient et lui laisse au visage une vilaine brûlure. Il met ensuite la tête de Geralt à prix et lance contre lui des tueurs, les frères Michelet, sans jamais dire pour qui il travaille.",
  rl: "tour-hirondelle",
  rev: "Le puissant magicien qu'il sert est Vilgefortz. À Oxenfurt, Philippa Eilhart paralyse Geralt pour le laisser fuir : elle espère remonter jusqu'à son maître. À Thanedd, il prend part au coup aux côtés de Cahir et des Scoia'tael, sans réussir à s'emparer de Ciri. Il la traque ensuite avec Leo Bonhart et Stefan Skellen. Sur un lac gelé, Ciri, chaussée de patins, lui tranche les doigts agrippés au bord de la glace : il se noie.",
  dans: ["sang-elfes", "temps-mepris", "tour-hirondelle"],
  voir: ["vilgefortz", "jaskier"] },

{ id: "philippa", t: "perso", src: "LJ", nom: "Philippa Eilhart", alias: ["Filippa Eilhart"],
  role: "Magicienne de Rédanie",
  resume: "Conseillère du roi de Rédanie, ambitieuse et manipulatrice, capable de prendre la forme d'une chouette.",
  livres: "Conseillère du roi Vizimir II de Rédanie et membre du Conseil des magiciens, Philippa Eilhart (Filippa dans les traductions françaises des romans) est l'une des rares à maîtriser la polymorphie : elle prend volontiers la forme d'une grande chouette grise. Cheveux et yeux noirs, bijoux d'agate noire, parfum de cannelle : Jaskier la trouve séduisante, mais intimidante. Ancienne maîtresse de l'espion Dijkstra, elle manœuvre de concert avec lui au service de la Rédanie. Dans « Le Sang des elfes », elle surgit à Oxenfurt sous sa forme de chouette, se joint à la traque de l'espion Rience et n'hésite pas à torturer par magie un complice pour obtenir ce qu'elle veut.",
  rl: "bapteme-feu",
  rev: "À Oxenfurt, elle paralyse Geralt pour laisser fuir Rience, qu'elle compte suivre jusqu'à son maître. À Thanedd, de concert avec Dijkstra, elle fait arrêter les magiciens ralliés à Nilfgaard, et le conclave tourne au coup d'État ; changée en chouette, elle arrache Ciri aux griffes du mage Artaud Terranova. La même nuit, Vizimir II est assassiné, et elle dirige avec Dijkstra le conseil de régence de la Rédanie. Elle fonde ensuite la Loge des Magiciennes, un cercle secret qui entend tirer les ficelles de la politique du Nord et voit en Ciri un atout, qu'elle voudrait unir à un prince du Kovir.",
  jeu: [
    { c: 5, t: "Dans TW3, Radovid l'a fait aveugler ; elle conspire contre lui." },
    { c: 5, t: "Longtemps prisonnière de sa forme de chouette, où l'avait enfermée un ancien amant, elle passe des mains de Zoltan à celles de Dijkstra avant que Geralt ne la tire d'affaire. Elle rêve de relever la Loge et d'y accueillir Ciri." },
    { c: 6, t: "Si Geralt prend part au complot contre Radovid, c'est elle qui achève le roi qui l'avait fait aveugler, avant de s'envoler sous sa forme de chouette." }],
  dans: ["sang-elfes", "temps-mepris", "bapteme-feu", "dame-lac"],
  voir: ["loge", "dijkstra", "radovid", "thanedd"] },

{ id: "dijkstra", t: "perso", src: "LJ", nom: "Sigismund Dijkstra", alias: [],
  role: "Maître espion de Rédanie",
  resume: "Colosse chauve à l'esprit redoutable, chef des services secrets de Rédanie.",
  livres: "Chef des services secrets du roi Vizimir II de Rédanie, Sigismund Dijkstra ne ressemble en rien à un espion : près de sept pieds de haut, presque deux quintaux, un teint de cochon fraîchement lavé et un goût prononcé pour les vêtements de couleurs vives. Sous ses airs de gros balourd endormi se cache un esprit d'une acuité redoutable : à la cour, dit-on, si Dijkstra affirme qu'il est midi alors qu'il fait nuit noire, il est temps de s'inquiéter du sort du soleil. Ancien étudiant d'Oxenfurt, flanqué de son secrétaire Ori Reuven, il manœuvre en coulisses dans toute la saga, de Thanedd jusqu'aux tractations de la guerre, souvent à couteaux tirés avec les magiciennes. Dans « Le Sang des elfes », il fait de Jaskier son informateur.",
  rl: "dame-lac",
  rev: "À Thanedd, il seconde Philippa lors de l'arrestation des magiciens ralliés à Nilfgaard ; quand il veut faire de Ciri un pion de la Rédanie, Geralt le frappe et lui brise la cheville. Après l'assassinat de Vizimir II, il dirige avec Philippa le conseil de régence et fait pendre à tour de bras. Il se méfie de plus en plus de la Loge ; après la paix de Cintra, averti que des tueurs envoyés par Philippa arrivent, il fuit la Rédanie. On le retrouve en route vers l'est, sous le nom de Sigi Reuven.",
  jeu: [
    { c: 2, t: "Dans TW3, il règne sur la pègre de Novigrad sous le nom de Sigi Reuven, depuis ses bains publics." },
    { c: 2, t: "Avant de parler de Jaskier, il exige un service : retrouver le trésor dérobé dans sa chambre forte, sous ses bains. Il n'a pas oublié Thanedd, où Geralt lui a brisé la cheville." },
    { c: 5, t: "Il fomente avec Vernon Roche l'assassinat de Radovid, qui détruit, à ses yeux, tout ce qu'avait bâti son père Vizimir." },
    { c: 6, t: "Si le complot aboutit, il se retourne contre les Témériens : selon vos choix, il finit chancelier de Rédanie ou tombe sous l'épée de Geralt." }],
  dans: ["sang-elfes", "temps-mepris", "bapteme-feu", "dame-lac"],
  voir: ["philippa", "novigrad", "radovid"] },

{ id: "radovid", t: "perso", src: "LJ", nom: "Radovid", alias: ["Radovid V", "Radovid le Sévère", "Radowid"],
  role: "Roi de Rédanie",
  resume: "Héritier du trône de Rédanie, devenu dans les jeux un souverain brillant et paranoïaque.",
  livres: "Fils du roi Vizimir II de Rédanie et de la reine Hedwige, Radovid n'est encore, pendant la guerre contre Nilfgaard, qu'un prince adolescent que les grands du royaume tiennent pour quantité négligeable. La saga l'aperçoit à peine. Dans « La Tour de l'Hirondelle », Geralt se souvient que Calanthe avait songé à le marier à Ciri, à moins que ce ne fût à Tankred Thyssen de Kovir : il ne sait plus.",
  rl: "dame-lac",
  rev: "Son père est assassiné le jour même où la guerre reprend. Trop jeune pour régner, Radovid laisse le pouvoir à un conseil de régence où pèsent le duc Nitert et l'espion Dijkstra. Dans « La Dame du Lac », lors du défilé qui suit la paix de Cintra à Novigrad, le prince de treize ans enrage de voir que nul ne salue sa mère ni la mémoire de son père, et se jure de leur montrer un jour qui il est. Philippa Eilhart, qui l'observe, devine quelque chose en lui. L'histoire le retiendra sous le nom de Radovid le Sévère.",
  jeu: [
    { c: 2, t: "Dans TW3, il mène la guerre contre Nilfgaard, joue aux échecs avec passion et traque sans pitié mages et non-humains." },
    { c: 2, t: "Il reçoit Geralt à bord de son vaisseau amiral, dans le port d'Oxenfurt, et lui demande de retrouver Philippa Eilhart, qu'il poursuit d'une haine née dans son enfance. Intelligent et retors, il semble pourtant prisonnier de visions inquiétantes." },
    { c: 5, t: "Dans le dernier acte, Dijkstra, Roche et Thaler complotent sa mort, et Geralt peut leur prêter main-forte." },
    { c: 6, t: "Selon vos choix, il tombe sous la dague de Philippa Eilhart, ou il gagne la guerre et étend sa poigne de fer sur tout le Nord, au rythme des bûchers." }],
  voir: ["philippa", "dijkstra", "royaumes-nord", "roche", "loge"] },

{ id: "foltest", t: "perso", src: "LJ", nom: "Foltest", alias: [],
  role: "Roi de Témérie",
  resume: "Souverain de la Témérie, l'un des plus puissants royaumes du Nord.",
  livres: "Roi de Témérie, l'un des plus puissants royaumes du Nord, prince de Sodden, souverain du Pontar et de Mahakam, protecteur de Brugge et d'Ellander, Foltest est un monarque énergique, qui ne s'embarrasse guère des convenances. Dans la nouvelle « Le Sorceleur », sa jeunesse scandaleuse le rattrape : de sa liaison avec sa propre sœur Adda est née une fille maudite. Adda meurt peu après l'accouchement, l'enfant semble mourir elle aussi, et on l'ensevelit sous le vieux palais de Vizima. Sept ans plus tard, l'enfant est revenue sous la forme d'une stryge, qui tue quiconque s'aventure la nuit près de sa crypte. Plutôt que de la faire abattre, le roi promet une fortune à qui la délivrera du sort. Dans « Le Sang des elfes », il siège au conseil secret de Hagge parmi les rois du Nord, où se décide l'avenir de la guerre.",
  rl: "sang-elfes",
  rev: "Geralt passe la nuit dans le vieux palais et parvient à tenir la stryge hors de son sarcophage jusqu'au troisième chant du coq : la malédiction levée, il ne reste qu'une adolescente au développement très en retard, et le sorceleur en sort grièvement blessé. Des années plus tard, à Hagge, Foltest est de ceux qui conviennent, sans un mot de protestation, que Ciri doit disparaître pour raison d'État.",
  jeu: [
    { c: 0, t: "Dans le premier jeu, The Witcher, Geralt peut lever une seconde fois la malédiction de sa fille Adda. Au début du deuxième, Foltest est égorgé par un assassin déguisé en moine, un crime dont Geralt est d'abord accusé." },
    { c: 0, t: "Dans TW3, la Témérie, privée d'héritier légitime, est occupée par Nilfgaard : c'est dans le palais royal de Vizima que l'empereur Emhyr reçoit Geralt." }],
  dans: ["dernier-voeu", "sang-elfes"],
  voir: ["vizima", "royaumes-nord", "m-stryge", "keira", "roche"] },

{ id: "avallach", t: "perso", src: "LJ", nom: "Avallac'h", alias: ["Crevan Espane aep Caomhan Macha"],
  role: "Sage des Aen Elle",
  resume: "Elfe savant et insaisissable, qui semble toujours en savoir plus qu'il ne le dit.",
  livres: "Crevan Espane aep Caomhan Macha, que tous appellent Avallac'h, est un Aen Saevherne, un Sage des Aen Elle, capable de passer de leur monde à celui des Aen Seidhe. Savant et conseiller du roi Auberon, il connaît l'histoire de Lara Dorren et du Sang Ancien mieux que personne. Il tient un rôle de premier plan dans « La Dame du Lac ». Son nom évoque Afallach, figure de la tradition galloise liée à l'île d'Avalon, l'autre monde des légendes arthuriennes.",
  rl: "dame-lac",
  rev: "Il joue un double jeu : il veut que Ciri serve à rendre le Sang Ancien à son peuple. Jadis promis à Lara Dorren, qui lui préféra le mage Cregennan, il pose à Ciri un ultimatum : donner un enfant au roi Auberon, ou rester à jamais prisonnière du monde des Aen Elle. Elle finit par lui échapper.",
  jeu: [
    { c: 5, t: "Libéré de la malédiction d'Uma, il se révèle : Sage des Aen Elle et conseiller du défunt roi, il a été le mentor de Ciri et l'a sauvée maintes fois de la Chasse, jusqu'à la cacher sur l'Île des Brumes quand il a senti la malédiction le gagner." },
    { c: 5, t: "Après la bataille de Kaer Morhen, il convainc Geralt qu'il faudra l'aide des magiciennes de la Loge, tente d'apprendre à Ciri à maîtriser son don et ose le voyage jusqu'à Tir ná Lia pour retourner contre Eredin son vice-roi, Ge'els." },
    { c: 5, t: "Une visite de son laboratoire confirme qu'il s'intéresse de très près à la lignée de Lara Dorren, et donc à Ciri. Il le reconnaît sans se troubler, assurant ne vouloir que protéger ses descendants." },
    { c: 6, t: "Les derniers mots d'Eredin sèment le doute, et Avallac'h disparaît avec Ciri : tout indique qu'il poursuivait depuis le début un but caché, ouvrir les portes entre les mondes." }],
  dans: ["dame-lac"],
  voir: ["aen-elle", "lara-dorren", "eredin", "uma", "sang-ancien", "auberon"] },

{ id: "eredin", t: "perso", src: "LJ", nom: "Eredin Bréacc Glas", alias: ["le Roi de la Chasse", "l'Épervier"],
  role: "Chef de la Chasse sauvage",
  resume: "Le chef de la Chasse sauvage, ces cavaliers en armure dont les légendes du Nord font une horde de spectres.",
  livres: "Elfe Aen Elle de Tir ná Lia, il commande les Dearg Ruadhri, les « Cavaliers rouges », une cavalerie d'élite. Il paraît dans « La Dame du Lac », ambitieux et méprisant envers les humains. Les licornes, qu'il pourchasse, le surnomment l'Épervier. Impatient de nature, il s'en remet pourtant, non sans agacement, aux plans du sage Avallac'h.",
  rl: "dame-lac",
  rev: "Le chef spectral de la Chasse sauvage, qui hante Ciri depuis « Le Temps du mépris », c'est lui. À la première rencontre, il la compare à une pépite d'or tombée dans le fumier. À la mort du vieux roi Auberon, emporté par un aphrodisiaque qu'Eredin lui a fourni, il s'impose à la tête des siens : accident ou calcul, le roman laisse planer le doute, quand les jeux en font un régicide. Il poursuit ensuite Ciri à travers les mondes.",
  jeu: [
    { c: 0, t: "Principal antagoniste de TW3. Dès le rêve qui ouvre le jeu, la Chasse sauvage surgit à Kaer Morhen et s'en prend à Ciri." },
    { c: 5, t: "Ciri l'explique à Geralt : le monde des Aen Elle se meurt sous le Gel Blanc, et Eredin, conquérant dans l'âme, veut se servir de son pouvoir pour ouvrir une brèche et envahir le nôtre. C'est lui qui a lancé l'assaut contre Kaer Morhen, où seule la puissance déchaînée de Ciri l'a contraint au repli." },
    { c: 5, t: "Selon Avallac'h, c'est lui qui a empoisonné le roi Auberon pour monter sur le trône, et il a fait taire presque tous ceux qui le savaient." },
    { c: 6, t: "Il tombe au terme d'un long duel contre Geralt sur le pont du Naglfar, au large d'Undvik. Mourant, il lui révèle qu'Avallac'h les a manipulés tous les deux." }],
  dans: ["dame-lac"],
  voir: ["chasse", "aen-elle", "auberon", "generaux", "avallach", "gel-blanc"] },

{ id: "auberon", t: "perso", src: "LJ", nom: "Auberon Muircetach", alias: ["le Roi des Aulnes"],
  role: "Roi des Aen Elle",
  resume: "Souverain âgé et mélancolique des Aen Elle.",
  livres: "Auberon Muircetach, le « Roi des Aulnes », règne sur les Aen Elle depuis Tir ná Lia. Sage lui-même et très âgé, il vit reclus et laisse le gouvernement de son peuple au sage Avallac'h et au guerrier Eredin. Il paraît dans « La Dame du Lac ». Ses noms ont une longue histoire : Auberon est le roi des fées de la chanson de geste « Huon de Bordeaux », devenu l'Obéron de Shakespeare, et le « Roi des Aulnes » traduit l'Erlkönig des légendes germaniques, que Goethe a immortalisé dans sa ballade.",
  rl: "dame-lac",
  rev: "C'est à lui que Ciri doit donner un enfant pour rendre le Sang Ancien aux Aen Elle. Patient et jamais brutal, le vieux roi méprise pourtant les humains et n'y parvient pas. Il meurt d'une dose excessive d'un aphrodisiaque fourni par Eredin, peut-être par accident, peut-être à dessein, et sa mort bouleverse la cour de Tir ná Lia.",
  jeu: [{ c: 5, t: "Dans TW3, on ne le voit qu'en songe : une vision de ses derniers instants, montrée au vice-roi Ge'els pour le retourner contre Eredin. Le journal précise qu'il est mort empoisonné, épuisé et aigri par plus de six cent cinquante ans d'existence." }],
  dans: ["dame-lac"],
  voir: ["aen-elle", "eredin", "avallach", "tir-na-lia", "lara-dorren"] },

{ id: "lara-dorren", t: "perso", src: "LJ", nom: "Lara Dorren", alias: ["Lara Dorren aep Shiadhal"],
  role: "Magicienne elfe, source du Sang Ancien",
  resume: "Légendaire magicienne elfe porteuse d'un gène unique.",
  livres: "Lara Dorren aep Shiadhal, magicienne et Sage elfe, portait le Sang Ancien. Son amour pour un humain, le puissant mage Cregennan de Lod, fit scandale chez les elfes comme chez les humains et finit tragiquement : Cregennan mourut, et Lara, enceinte et pourchassée, ne lui survécut guère. « Le Baptême du feu » cite les deux versions de sa légende. Chez les elfes, elle supplie une reine de sauver son enfant à naître ; sur l'ordre de la souveraine, le bourreau lui tranche les doigts accrochés à la portière du carrosse, et elle meurt de froid sur une colline en mettant au monde une fille, tandis que des fleurs éclosent autour d'elle en pleine tempête de neige. Chez les humains, la « sorcière » maudit la reine et sa descendance jusqu'à la dixième génération. Recueillie par la reine Cerro de Rédanie, leur fille Riannon transmit le gène à une lignée humaine qui mène jusqu'à Pavetta et Ciri.",
  rl: "dame-lac",
  rev: "« La Dame du Lac » révèle que Lara appartenait aux Aen Elle et qu'elle était promise au sage Avallac'h avant de lui préférer Cregennan. Son peuple n'a jamais renoncé à récupérer le gène perdu dans une lignée humaine.",
  jeu: [{ c: 5, t: "Son nom revient souvent dans TW3, à mesure que l'on comprend ce que la Chasse attend de Ciri. Le laboratoire d'Avallac'h montre que le Sage a consacré ses recherches à sa lignée, et à sa descendante." }],
  dans: ["sang-elfes", "dame-lac"],
  voir: ["sang-ancien", "avallach", "ciri", "aen-elle", "pavetta"] },

{ id: "ithlinne", t: "perso", src: "LJ", nom: "Ithlinne", alias: ["Ithlinne Aegli aep Aevenien", "la prophétie d'Ithlinne", "Itlina", "Aen Ithlinnespeath"],
  role: "Prophétesse elfe",
  resume: "Voyante elfe dont les prédictions hantent toute la saga.",
  livres: "Ithlinne Aegli, fille d'Aevenien, que les humains appellent Itlina, est une elfe de légende, guérisseuse, astrologue et devineresse. Sa prophétie la plus célèbre, l'Aen Ithlinnespeath, ouvre « Le Sang des elfes » : elle annonce l'ère de l'épée et de la hache, le temps du Mépris, qui donne son titre au « Temps du mépris », puis Tedd Deireadh, le Temps de la Fin, où le monde périra dans le froid pour renaître du Sang Ancien. Selon une encyclopédie citée dans « Le Baptême du feu », on lui prête la prédiction des guerres nordiques, de grandes pestes et d'un refroidissement du climat, la « Froidure blanche ». Bien des savants ne voient pourtant en elle qu'une figure légendaire, et dans ses prophéties une ingénieuse supercherie littéraire.",
  jeu: [
    { c: 5, t: "TW3 fait de cette prophétie le cœur de l'intrigue : le Gel Blanc qu'elle annonce ravage déjà le monde des Aen Elle et menace tous les autres, et l'enfant du Sang Ancien en est la clé." },
    { c: 6, t: "Au dénouement, c'est Ciri elle-même qui affronte le Gel Blanc, accomplissant à sa façon ce qu'annonçait la prophétie." }],
  dans: ["sang-elfes", "temps-mepris", "dame-lac"],
  voir: ["gel-blanc", "sang-ancien", "ciri", "sang-elfes", "langue-ancienne"] },

{ id: "nenneke", t: "perso", src: "L", nom: "Nenneke", alias: [],
  role: "Grande prêtresse de Melitele",
  resume: "Prêtresse bourrue et maternelle, confidente de Geralt.",
  livres: "Grande prêtresse de Melitele, elle règne sans partage sur le temple d'Ellander, dont la pharmacie est réputée pour ses élixirs, ses onguents et ses pommades ; certaines herbes ne poussent que dans la serre au toit de cristal du jardin. Petite et replète mais d'une grâce surprenante, maternelle et bourrue, elle se moque de ceux qui l'appellent « Mère ». Elle connaît Geralt depuis sa jeunesse. Dans « La Voix de la raison », le récit qui relie les nouvelles du « Dernier Vœu », elle le soigne après son combat contre la stryge, tient tête aux chevaliers de l'ordre de la Rose Blanche venus exiger son départ au nom du duc Hereward, et lui parle de Yennefer. Dans « Le Sang des elfes », elle accueille Ciri au temple, lui enseigne les runes, l'histoire, la poésie et la Langue ancienne, et voit d'un mauvais œil l'entraînement épuisant que lui impose Yennefer.",
  dans: ["dernier-voeu", "sang-elfes"],
  voir: ["melitele", "geralt", "ciri", "yennefer", "jaskier"] },

{ id: "tissaia", t: "perso", src: "L", nom: "Tissaia de Vries", alias: [],
  role: "Rectrice d'Aretuza",
  resume: "Magicienne d'une rigueur légendaire, à la tête de l'école d'Aretuza et mentore de Yennefer.",
  livres: "Archimaîtresse, membre du Chapitre et longtemps rectrice d'Aretuza, l'école de magiciennes de l'île de Thanedd, Tissaia de Vries compte parmi les plus vieilles magiciennes en vie, même si les élixirs lui gardent un visage jeune. Cheveux sombres lissés, lèvres minces, rigueur proverbiale : on dit qu'aucun voile magique ne lui résiste. Elle a formé des générations d'adeptes, dont Yennefer, et Philippa Eilhart, sa meilleure élève, même si l'ambition froide de celle-ci les a peu à peu éloignées. Dans « Le Sang des elfes », elle débat avec Vilgefortz et d'autres membres du Chapitre de la réunion secrète des rois à Hagge. Dans « Le Temps du mépris », à Gors Velen, elle prend Ciri pour une adepte en fugue et la punit sur-le-champ, avant de découvrir qu'il s'agit de l'élève de Yennefer.",
  rl: "temps-mepris",
  rev: "Pendant le coup de Thanedd, voulant rester neutre, elle brise les barrières magiques de Garstang et libère de leurs entraves de dimeritium les magiciens ralliés à Nilfgaard, rendant le combat égal. Elle comprend trop tard qu'elle a servi Vilgefortz : rongée par la culpabilité, elle se donne la mort en s'ouvrant les veines. Sa disparition, avec les autres pertes de cette nuit, signe la fin du Conseil des magiciens.",
  dans: ["sang-elfes", "temps-mepris"],
  voir: ["yennefer", "thanedd", "conseil", "philippa", "vilgefortz"] },

{ id: "francesca", t: "perso", src: "L", nom: "Francesca Findabair", alias: ["Enid an Gleanna", "la Pâquerette des Vallées"],
  role: "Magicienne elfe",
  resume: "Réputée la plus belle femme du monde, magicienne et défenseure de la cause elfe.",
  livres: "Enid an Gleanna, la « Pâquerette des Vallées », que les humains appellent Francesca Findabair, est une elfe de sang pur et une magicienne de tout premier plan. On la tient, et de loin, pour la plus belle femme du monde : longs cheveux d'or sombre coiffés avec majesté, yeux bleus durs comme le verre, soulignés d'un maquillage elfique. Membre du Chapitre, elle a combattu aux côtés des magiciens du Nord à la bataille de Sodden. Au banquet de Thanedd, dans « Le Temps du mépris », Yennefer lui présente Geralt.",
  rl: "bapteme-feu",
  rev: "À Thanedd, elle trahit le Chapitre : ralliée à Vilgefortz et à Nilfgaard, elle a caché des Scoia'tael sous l'île et leur ouvre les portes en plein chaos. Pour prix de son ralliement, Emhyr fait d'elle la reine des elfes de Dol Blathanna, à condition qu'elle abandonne les Scoia'tael à leur sort. Pour soustraire Yennefer à la vengeance de Rience, elle la « compresse » par magie et la garde ainsi un mois et demi, avant de l'emmener à Montecalvo, à une réunion de la Loge, dont elle est l'une des fondatrices.",
  dans: ["temps-mepris", "bapteme-feu", "dame-lac"],
  voir: ["dol-blathanna", "loge", "scoiatael", "thanedd", "yennefer"] },

{ id: "keira", t: "perso", src: "LJ", nom: "Keira Metz", alias: [],
  role: "Magicienne du Nord",
  resume: "Magicienne au tempérament vif, plus habile qu'elle n'en a l'air.",
  livres: "Née à Carreras et formée à Aretuza, Keira Metz siège au conseil du roi Foltest, aux côtés de Triss Merigold et du mage Fercart. Petite et mince, de longs cheveux couleur paille, une croix ansée d'argent au cou, elle aime le luxe et les belles toilettes, et déteste la crasse des chemins. Elle prépare, dit-on, d'excellents aphrodisiaques. Elle apparaît à partir du « Temps du mépris » : au banquet de Thanedd, elle badine avec Geralt et refuse de boire, car elle compte, dit-elle, tomber enceinte cette nuit.",
  rl: "bapteme-feu",
  rev: "À Thanedd, elle fait partie des conjurés du Nord qui, à l'aube, arrêtent les magiciens ralliés à Nilfgaard ; elle assène à Artaud Terranova un coup de poing américain en plein visage. Quand le combat éclate à Garstang, Terranova la jette par une fenêtre : elle tombe sur Geralt, qui la porte, jambe et côtes brisées. Chassée par son roi, elle se réfugie chez Philippa à Montecalvo et compte parmi les plus jeunes membres de la Loge des Magiciennes.",
  jeu: [
    { c: 1, t: "Dans TW3, l'ancienne conseillère de Foltest, traquée comme les autres membres de la Loge, se cache près de Hautbreuil, à Velen, où elle joue les guérisseuses de village. Elle qui aime tant le luxe déteste chaque minute de cette vie." },
    { c: 1, t: "Elle aide Geralt à explorer des ruines elfiques où un mystérieux elfe a laissé des messages pour Ciri, et où la Chasse sauvage les a devancés. Le journal rappelle que Geralt l'a connue à Thanedd, le jour où elle lui est littéralement tombée dessus." },
    { c: 4, t: "Selon vos choix dans ses quêtes de Velen, elle peut rejoindre Kaer Morhen et se battre aux côtés des sorceleurs, voire se rapprocher de Lambert, ou bien finir beaucoup plus mal." }],
  dans: ["temps-mepris", "bapteme-feu", "dame-lac"],
  voir: ["loge", "velen", "lambert", "foltest", "triss", "thanedd"] },

{ id: "fringilla", t: "perso", src: "LJ", nom: "Fringilla Vigo", alias: [],
  role: "Magicienne nilfgaardienne",
  resume: "Magicienne de l'Empire, ambitieuse et brillante.",
  livres: "Magicienne de Nilfgaard, elle détonne parmi les mages de l'Empire, que l'on veut austères : elle soigne son apparence et ne s'en cache pas. Cheveux noirs et lisses, yeux verts, grâce naturelle. Elle a combattu dans les rangs nilfgaardiens à la bataille de Sodden, où elle a aveuglé Yennefer d'un sort. Elle entre en scène dans « Le Baptême du feu », aux côtés de sa compatriote Assire var Anahid.",
  rl: "dame-lac",
  rev: "Elle rejoint la Loge avec Assire. Dans « La Dame du Lac », croisant Geralt en Toussaint, chez sa parente la duchesse Anna Henrietta, elle s'emploie sur ordre de la Loge à l'y retenir tout l'hiver : leur liaison devient passionnée, même si le sorceleur laisse parfois échapper le nom de Yennefer. Quand il s'apprête à partir, elle lui apprend que Yennefer ne l'a jamais trahi, en échange de l'emplacement du repaire de Vilgefortz. Le nom qu'il lui donne est faux, et l'expédition de la Loge fait chou blanc.",
  jeu: [
    { c: 5, t: "Dans TW3, emprisonnée sur ordre d'Emhyr pour ses liens avec la Loge, elle attend son exécution. Ses consœurs, qui ont besoin d'elle contre la Chasse, ne pourront compter sur elle que si l'empereur accepte de la libérer." },
    { c: 5, t: "Le journal rappelle que Geralt l'a rencontrée des années plus tôt au palais ducal de Beauclair, en Toussaint. Libérée grâce à un marché conclu par Yennefer avec Emhyr, elle participe avec ses consœurs au piège tendu à la Chasse sauvage." }],
  dans: ["bapteme-feu", "dame-lac"],
  voir: ["loge", "toussaint", "nilfgaard", "anna-henrietta", "yennefer"] },

{ id: "anna-henrietta", t: "perso", src: "LJ", nom: "Anna Henrietta", alias: ["Anarietta"],
  role: "Duchesse de Toussaint",
  resume: "Souveraine de Toussaint, fantasque et passionnée.",
  livres: "Souveraine adorée de Toussaint, petit duché vassal de Nilfgaard, que ses intimes appellent Anarietta. Veuve depuis 1265 d'un duc brutal et détesté de tous, elle règne seule sur une cour éprise de chevalerie, de tournois et de bons vins. Dans « La Dame du Lac », elle accueille la compagnie de Geralt pendant l'hiver ; Jaskier, qui la connaît de longue date, y est reçu à bras ouverts.",
  rl: "dame-lac",
  rev: "Jaskier a déjà été son amant, six ans plus tôt, en l'absence du duc, qui jura de lui faire arracher le cœur. Le duc mort, leur liaison reprend aussitôt. Mais le barde est surpris dans les bras d'une baronne : la duchesse le condamne à mort, puis se ravise au dernier moment et se contente de le bannir à jamais de Toussaint.",
  jeu: [
    { d: "bw", c: 0, t: "Dans Blood and Wine, une mystérieuse bête s'en prend aux membres de sa cour : la duchesse, qui a connu Geralt lors de son séjour en Toussaint des années plus tôt, sait exactement qui appeler. Elle lui offre en premier paiement le domaine viticole de Corvo Bianco." },
    { d: "bw", c: 0, t: "Aimée de ses sujets sans jamais gouverner par la terreur, elle excelle aux joutes de la cour, faites de piques et de demi-vérités, mais sait aussi troquer sa robe contre un manteau grossier pour suivre Geralt sur le terrain. Au palais, elle évoque volontiers sa rencontre avec Jaskier." }],
  dans: ["dame-lac"],
  voir: ["toussaint", "jaskier", "syanna", "fringilla"] },

{ id: "dudu", t: "perso", src: "LJ", nom: "Dudu Biberveldt", alias: ["Tellico Lunngrevink Letorte", "le doppler", "Doudou"],
  role: "Doppler",
  resume: "Un métamorphe capable de copier l'apparence de n'importe qui.",
  livres: "Dans « Le Feu éternel », à Novigrad, ce doppler, de son vrai nom Tellico Lunngrevink Letorte, a détroussé sur la route le marchand halfelin Dainty Biberveldt avant de prendre son apparence. Sous ses traits, il mène les affaires de Dainty en ville et engage ses biens dans des achats en apparence absurdes, auprès du banquier nain Vimme Vivaldi. Geralt et Jaskier s'en mêlent, dans une cité où le culte du Feu éternel assure qu'aucun monstre ne peut menacer les fidèles. Plutôt que de le tuer, Geralt l'aide à se tirer d'affaire. Ses amis l'appellent Doudou.",
  rl: "epee-providence",
  rev: "Avant le dénouement, le doppler affronte Geralt en prenant ses propres traits. Ses achats se révèlent très rentables : Dainty, réconcilié, le prend pour associé et le présente désormais comme son cousin. Quant au redouté Chappelle, pilier du Feu éternel, c'est lui aussi un doppler, qui a pris en secret la place du vrai, mort sans que personne le sache.",
  jeu: [
    { c: 2, t: "Dans TW3, Jaskier rappelle que Dainty a fait de lui son associé, sous le nom de Dudu Biberveldt. Le doppler a aidé Ciri et Jaskier dans une affaire très risquée à Novigrad, et s'est attiré la colère d'un caïd de la pègre, qui lui a coûté un œil." },
    { c: 2, t: "Grand amateur de théâtre, il a parfois remplacé des comédiens au pied levé : pour l'attirer hors de sa cachette, Geralt et Priscilla montent une pièce." }],
  dans: ["epee-providence"],
  voir: ["novigrad", "jaskier", "feu-eternel", "m-doppler", "priscilla"] },

{ id: "shani", t: "perso", src: "LJ", nom: "Shani", alias: [],
  role: "Médecin d'Oxenfurt",
  resume: "Étudiante en médecine à Oxenfurt, au caractère bien trempé.",
  livres: "Rousse, vive et débrouillarde, Shani a dix-sept ans et étudie la médecine en troisième année à l'académie d'Oxenfurt dans « Le Sang des elfes ». Ses études coûtent trop cher à son beau-père : elle arrondit ses fins de mois en revendant en douce des fournitures de l'école. Amie de Jaskier, elle porte pour lui un message à Geralt, caché en ville, et c'est elle qui met le sorceleur sur la piste de l'espion Rience. On la retrouve dans « La Dame du Lac », à l'hôpital de campagne du chirurgien halfelin Milo Vanderbeck pendant la bataille de Brenna, où elle tient bon malgré les opérations les plus effroyables.",
  rl: "dame-lac",
  rev: "« La Dame du Lac » dévoile aussi son avenir : devenue doyenne de la faculté de médecine d'Oxenfurt, elle s'éteint en 1340, à quatre-vingt-dix ans. La consigne que Vanderbeck lui donnait à Brenna pour recoudre les blessés, « le rouge avec le rouge, le jaune avec le jaune, le blanc avec le blanc », est devenue sa plaisanterie favorite.",
  jeu: [
    { d: "hos", c: 0, t: "Dans Hearts of Stone, Geralt la retrouve dans les égouts d'Oxenfurt, où elle accompagne une unité de l'armée rédanienne. Devenue docteure, elle tient désormais son propre cabinet en ville." },
    { d: "hos", c: 0, t: "Elle accompagne ensuite Geralt au mariage d'Aldona, une amie de l'académie, une soirée où le sorceleur n'est pas tout à fait lui-même. Shani apparaissait déjà dans le premier jeu, The Witcher, comme médecin à Vizima." }],
  dans: ["sang-elfes", "dame-lac"],
  voir: ["oxenfurt", "jaskier", "brenna", "rience"] },

{ id: "nimue", t: "perso", src: "L", nom: "Nimue et Condwiramurs", alias: ["la Dame du Lac", "Nimue", "Condwiramurs"],
  role: "Narratrices venues d'un autre temps",
  resume: "Deux magiciennes d'une époque bien postérieure, qui étudient la légende du sorceleur et de Ciri.",
  livres: "Dans « La Dame du Lac », Nimue et son apprentie Condwiramurs, une rêveuse capable de voir le passé, encadrent le récit : l'histoire de Geralt y est déjà devenue une légende. Fille de paysans d'un petit village proche de la Yaruga, Nimue a grandi en écoutant un conteur raconter la geste du sorceleur, de Yennefer et de Ciri, et a traversé la moitié du continent pour entrer à Aretuza. Devenue une puissante magicienne, elle vit dans une tour sur une île au milieu d'un lac, entourée de tableaux, de livres et de contes consacrés à la saga. Condwiramurs Tilly, oniromancienne brillante, l'aide à démêler le vrai du faux. On aperçoit Nimue enfant dans « Le Baptême du feu », et en route pour Aretuza dans l'épilogue de « La Saison des orages ». Leurs noms viennent de la légende arthurienne : Nimue est l'un des noms de la Dame du Lac, et Condwiramurs celui de l'épouse de Perceval dans le « Parzival » de Wolfram von Eschenbach.",
  rl: "dame-lac",
  rev: "Le roman s'ouvre dans un autre monde : au bord d'un lac, le jeune Galahad, chevalier du roi Arthur, prend Ciri pour la Dame du Lac. Nimue, elle, a vu Ciri de ses propres yeux : jeune novice, elle l'a vue surgir au-dessus d'un lac avec une licorne. Des années plus tard, avec Condwiramurs, elle guette son retour chaque nuit. Quand Ciri reparaît enfin, Nimue lui ouvre un portail vers Stygga et l'année 1268.",
  dans: ["dame-lac", "saison-orages"],
  voir: ["dame-lac", "ciri", "saison-orages", "ihuarraquax"] },

/* ---------- Personnages propres aux jeux ---------- */
{ id: "baron", t: "perso", src: "J", nom: "Le Baron sanglant", alias: ["Phillip Strenger"], porte: { c: 1 },
  role: "Seigneur de guerre de Velen",
  resume: "Création du jeu : un seigneur de guerre qui tient une partie de Velen d'une main de fer et sait quelque chose sur Ciri. Son histoire familiale compte parmi les récits les plus marquants de TW3.",
  jeu: [
    { c: 1, t: "Ancien soldat témérien, il s'est installé à Perchefreux, abandonné par son seigneur, avec les débris de son unité et des déserteurs, et traite avec Nilfgaard dans l'espoir d'être reconnu baron. Il a recueilli Ciri avec des égards presque paternels, mais ne dira où elle est partie que si Geralt retrouve sa femme Anna et sa fille Tamara, disparues." },
    { c: 1, t: "Son surnom viendrait d'une méprise : du temps où il servait la Témérie, des Nilfgaardiens retranchés dans une teinturerie se sont rendus à lui, et l'un de ses hommes a renversé un pot de teinture rouge dans la rivière. Tout le pays a cru qu'il avait massacré ses prisonniers." },
    { c: 2, t: "Le Baron avait caché l'essentiel : ivrogne et violent, il battait sa femme, qui a fini par fuir. L'enfant qu'elle a perdu, enterré à la hâte, est devenu un couvin ; Geralt peut l'apaiser par un rite ancien, au cours duquel le Baron donne enfin un nom à sa fille, Dea." },
    { c: 5, t: "Le Baron accompagne Geralt dans le marais de Torséchine pour y chercher Anna. Selon les choix de Geralt, il emmène sa femme, qui a perdu la raison, jusqu'aux Monts Bleus, où un ermite pourrait la guérir, ou se pend de désespoir à l'arbre de la cour de Perchefreux." }],
  voir: ["velen", "dames-bois", "uma", "ciri", "m-botchling"] },

{ id: "dames-bois", t: "perso", src: "J", nom: "Les Moires", alias: ["les Moires de Torséchine", "les Dames de la forêt", "Crones", "Ladies of the Wood"], porte: { c: 1 },
  role: "Entités de Velen",
  resume: "Création du jeu, inspirée des contes slaves : trois entités très anciennes que les habitants de Velen vénèrent autant qu'ils les redoutent.",
  jeu: [
    { c: 1, t: "Les gens de Velen les appellent les Dames de la forêt : trois sœurs aussi vieilles que les bois, qui règnent sur le marais de Torséchine, prédisent l'avenir et tordent le fil des vies. Elles aident les villageois contre une obéissance aveugle et des tributs cruels, et ne parlent guère qu'à travers une tapisserie enchantée et une vieille servante." },
    { c: 2, t: "Cette servante n'est autre qu'Anna, la femme du Baron : pour perdre l'enfant qu'elle attendait, elle leur avait promis une année de servitude. Elle veille sur les orphelins envoyés dans le marais, que les Moires finissent par dévorer." },
    { c: 2, t: "Ciri est passée entre leurs griffes : ayant flairé en elle le Sang Ancien, elles comptaient la livrer à la Chasse sauvage, non sans lui manger un membre. Elle leur a échappé de justesse." },
    { c: 5, t: "Au sabbat du Mont Chauve, où Imlerith est leur invité, Ciri affronte les trois sœurs : elle en tue deux, et la troisième s'enfuit en lui arrachant le médaillon de Vesemir." }],
  voir: ["velen", "baron", "chasse", "ciri"] },

{ id: "uma", t: "perso", src: "J", nom: "Uma", alias: [], porte: { c: 1 },
  role: "Créature maudite",
  resume: "Création du jeu : une créature difforme et malmenée que l'on rencontre chez le Baron sanglant.",
  jeu: [
    { c: 1, t: "Au château du Baron, la créature sert de bouffon aux soldats. Le Baron l'a gagnée au gwynt, à Novigrad, contre un marchand qui comptait la vendre comme fou du roi à une cour du continent." },
    { c: 4, t: "Au terme de son enquête, Geralt comprend que tout ramène à lui : une créature toute semblable a débarqué à Skellige dans la barque de Ciri, avant d'être vendue par un jarl à ce marchand. Geralt l'emmène à Kaer Morhen, non sans un détour forcé par le palais d'Emhyr, à Vizima." },
    { c: 4, t: "À Kaer Morhen, la méthode traditionnelle de Vesemir échoue. Yennefer soumet alors Uma à la première phase de l'Épreuve des Herbes, et le maintient en vie par un sort pendant une journée entière, au grand dam des sorceleurs." },
    { c: 5, t: "Uma est Avallac'h, transformé par une malédiction. Une fois libéré, il révèle où se cache Ciri." }],
  voir: ["baron", "avallach", "kaer-morhen", "yennefer", "epreuve"] },

{ id: "priscilla", t: "perso", src: "J", nom: "Priscilla", alias: ["Callonetta"], porte: { c: 2 },
  role: "Chanteuse et poétesse",
  resume: "Création du jeu : une artiste adulée de Novigrad, amie de Jaskier.",
  jeu: [
    { c: 2, t: "Trobairitz de Kovir connue sous le nom de scène de Callonetta, elle achève à Novigrad une tournée triomphale passée par Lan Exeter, Pont Vanis et Tretogor. Un soir, dans une auberge, elle chante une ballade inspirée des amours de Geralt et de Yennefer, puis met le sorceleur sur la piste de Jaskier." },
    { c: 2, t: "Pour attirer hors de sa cachette le doppler Dudu, elle écrit d'un trait une pièce qu'une troupe de comédiens monte en hâte. Geralt, qui n'en a choisi que le titre et le genre, doit même monter sur scène." },
    { c: 5, t: "Si Geralt aide Jaskier à ouvrir son cabaret, Priscilla est attaquée par le tueur qui sévit à Novigrad, la gorge entaillée. Elle survit grâce au chirurgien Joachim von Gratz, qui craint pour sa voix, et Jaskier comprend qu'elle est l'amour de sa vie." }],
  voir: ["jaskier", "novigrad", "dudu", "zoltan"] },

{ id: "generaux", t: "perso", src: "J", nom: "Imlerith et Caranthir", alias: ["généraux de la Chasse", "Imlerith", "Caranthir", "Caranthir Ar-Feiniel"], porte: { c: 4 },
  role: "Lieutenants d'Eredin",
  resume: "Création du jeu : Imlerith est un colosse en armure, Caranthir un navigateur capable d'ouvrir des passages entre les mondes.",
  jeu: [
    { c: 4, t: "Imlerith, le général, est un colosse cruel, bardé d'une armure hérissée, qui frappe d'une masse énorme derrière un bouclier immense. Caranthir, le navigateur, est un mage qui guide les cavaliers d'un monde à l'autre et se téléporte en plein combat. Geralt a connu le premier du temps où il servait la Chasse." },
    { c: 5, t: "C'est Imlerith qui brise la nuque de Vesemir à Kaer Morhen. Geralt le retrouve au sabbat des Moires, sur le Mont Chauve, lui lance Igni à travers la visière, puis l'achève de sa propre masse." },
    { c: 5, t: "Caranthir est le fruit des expériences d'Avallac'h, qui unissait des couples d'elfes doués pour manipuler l'espace et le temps. Doué mais imprudent et colérique, il a fini par rejoindre Eredin." },
    { c: 6, t: "Caranthir meurt lors de l'ultime bataille, sur l'île d'Undvik : transpercé par Geralt, il l'entraîne dans une dernière téléportation au fond de l'océan, où il se noie." }],
  voir: ["eredin", "chasse", "vesemir", "avallach", "dames-bois"] },

{ id: "gaunter", t: "perso", src: "J", nom: "Gaunter de Meuré", alias: ["Gaunter O'Dimm", "Maître Miroir", "l'Homme de verre"], porte: { d: "hos", c: 1 },
  role: "Marchand de vœux",
  resume: "Création du jeu : un homme affable que Geralt a déjà croisé au tout début de TW3, et dont les marchés ne laissent personne indemne. Il puise dans les contes de pactes avec le diable.",
  jeu: [
    { c: 0, t: "Dès le prologue, à l'auberge de Blanchefleur, cet homme affable, ancien marchand de miroirs ruiné par la guerre à l'en croire, offre à boire à Geralt, l'envoie interroger la garnison nilfgaardienne sur Yennefer, puis disparaît sans rien demander : un jour, dit-il, il aura besoin de lui." },
    { d: "hos", c: 0, t: "Il apparaît à bord du navire qui emmène Geralt vers le gibet, condamné pour avoir tué sans le savoir un prince maudit. Contre sa liberté, le sorceleur accepte de lui rendre un service, scellé par une marque brûlée sur son visage : il devra exaucer les trois vœux d'Olgierd von Everec." },
    { d: "hos", c: 0, t: "Toujours souriant, il arrête le temps d'un claquement de mains et refuse de dire son vrai nom : tous ceux qui l'ont appris, assure-t-il, sont morts, ou pire. Il se vante de donner aux gens exactement ce qu'ils demandent." }],
  voir: ["olgierd", "shani", "verger-blanc"] },

{ id: "olgierd", t: "perso", src: "J", nom: "Olgierd von Everec", alias: [], porte: { d: "hos", c: 1 },
  role: "Noble déchu",
  resume: "Création du jeu : un aristocrate ruiné à la tête d'une bande de brigands, aussi insaisissable que mélancolique.",
  jeu: [
    { d: "hos", c: 0, t: "Ataman d'une bande de brigands rédaniens, il a l'allure d'un noble d'autrefois, sabre au côté, lettré et amateur d'art, mais d'une froideur déconcertante. Geralt découvre vite qu'aucune blessure ne peut le tuer." },
    { d: "hos", c: 0, t: "Lié par le marché de Gaunter, Geralt doit exaucer ses trois vœux : faire passer à son frère Vlodimir le plus beau jour de sa vie, lui rapporter la maison de Maximilian Borsodi et retrouver la rose qu'il avait offerte à sa femme, Iris. Des vœux qu'Olgierd a choisis presque impossibles." },
    { d: "hos", c: 0, t: "Chaque vœu lève un coin du voile sur son passé : une famille ruinée, un amour contrarié, un frère disparu, et un cœur qui, au fil des ans, semble s'être changé en pierre." }],
  voir: ["gaunter", "shani", "oxenfurt"] },

{ id: "dettlaff", t: "perso", src: "J", nom: "Dettlaff van der Eretein", alias: [], porte: { d: "bw", c: 1 },
  role: "Vampire supérieur",
  resume: "Création du jeu : un vampire supérieur, ami de Regis, au cœur de l'intrigue de Toussaint.",
  jeu: [
    { d: "bw", c: 0, t: "Regis lui doit la vie : après Stygga, Dettlaff a retrouvé ses restes et l'a régénéré de son propre sang, au prix d'une longue patience. Depuis, un lien de sang unit les deux vampires." },
    { d: "bw", c: 0, t: "Il ressent tout avec une intensité inhumaine et voit le monde en noir et blanc, au point que Regis tente de le modérer. Jadis, en Lyrie, il a tué la bête qui avait massacré un petit garçon, parce que l'enfant lui avait un jour offert une pomme, puis laissé la carcasse près d'un braconnier endormi, qui en a récolté la gloire." }],
  voir: ["regis", "vampires", "toussaint", "m-vampire"] },

{ id: "syanna", t: "perso", src: "J", nom: "Syanna", alias: [], porte: { d: "bw", c: 1 },
  role: "Personnage de Toussaint",
  resume: "Création du jeu : une figure de Toussaint dont l'identité se dévoile au fil de l'enquête de Blood and Wine.",
  jeu: [
    { d: "bw", c: 0, t: "Son nom ne surgit qu'au cœur de Blood and Wine, au détour de l'enquête sur une série de meurtres de chevaliers." },
    { d: "bw", c: 0, t: "Fine lame et cavalière accomplie, elle a la repartie cinglante et ne cache pas son mépris pour les codes chevaleresques dont Toussaint s'enorgueillit." },
    { d: "bw", c: 0, t: "Son sort, comme celui du duché, dépend des choix faits par Geralt jusqu'aux dernières heures de l'extension." }],
  voir: ["anna-henrietta", "toussaint"] },

/* ---------- Lieux ---------- */
{ id: "kaer-morhen", t: "lieu", src: "LJ", nom: "Kaer Morhen", alias: [],
  role: "Forteresse des sorceleurs",
  resume: "Vieille place forte nichée dans les montagnes de Kaedwen, où l'école du Loup formait ses sorceleurs.",
  livres: "Vieille place forte du royaume de Kaedwen, accrochée à la montagne non loin de la rivière Gwenllech, elle n'est accessible que par un sentier facile à manquer. Son nom vient de la langue ancienne, Caer a'Muirehen, « la forteresse de la mer ancienne », à cause des fossiles marins pris dans la roche. Jadis prise d'assaut par des fanatiques, elle n'abrite plus qu'une poignée de sorceleurs qui viennent y passer l'hiver. Dans ses caves dort un laboratoire encombré d'alambics et d'élixirs, mais plus personne ne sait y conduire les mutations. Ciri y passe un hiver d'entraînement dans « Le Sang des elfes », auprès de Vesemir, Eskel, Lambert et Coën : Triss, en arrivant, découvre une fillette lancée sur le parcours d'entraînement des sorceleurs.",
  jeu: [
    { c: 0, t: "Le rêve qui ouvre le jeu y ramène Geralt au temps où Ciri s'y entraînait : Yennefer l'interrompt dans son bain, Vesemir s'est assoupi pendant la leçon de Ciri, jusqu'à ce que la Chasse sauvage change le rêve en cauchemar." },
    { c: 0, t: "Dans le premier jeu, déjà, Geralt amnésique y était recueilli, avant qu'une organisation criminelle, la Salamandre, n'attaque la forteresse pour dérober les secrets des mutagènes de l'Épreuve des Herbes." },
    { c: 4, t: "Geralt y retrouve Vesemir, Eskel et Lambert, et Yennefer y entreprend de lever la malédiction d'Uma en lui faisant subir l'Épreuve des Herbes." },
    { c: 5, t: "La Chasse sauvage y donne l'assaut. Sorceleurs et alliés défendent la forteresse de leur mieux, mais Vesemir y laisse la vie, et ses compagnons lui offrent un bûcher funéraire avant de quitter Kaer Morhen." }],
  dans: ["sang-elfes", "croisee"],
  voir: ["sorceleurs", "vesemir", "epreuve", "ciri", "eskel", "lambert"] },

{ id: "cintra", t: "lieu", src: "LJ", nom: "Cintra", alias: [],
  role: "Royaume de Ciri",
  resume: "Royaume du Sud, à l'embouchure de la Yaruga, gouverné par la reine Calanthe.",
  livres: "Bâti, dit-on, sur les ruines d'une cité elfe, Xin'trea, le royaume commande l'embouchure de la Yaruga. Sous la reine Calanthe, la Lionne de Cintra, il compte parmi les royaumes les plus puissants et s'allie aux îles Skellige par le mariage de la reine avec le jarl Eist Tuirseach. Filles et garçons y apprennent pareillement à se battre, à monter à cheval et à chasser. C'est à sa cour que se noue le destin de Ciri, dans « Une question de prix ». Sa chute face à Nilfgaard, au début de la saga, est un traumatisme fondateur : les réfugiés affluent dans les royaumes du Nord et jusqu'à Skellige, et Ciri reste hantée par le chevalier au heaume ailé qui l'a emportée hors de la ville en flammes, le cauchemar sur lequel s'ouvre « Le Sang des elfes ».",
  jeu: [{ c: 0, t: "Dans TW3, Cintra est sous domination nilfgaardienne depuis des années." }],
  dans: ["dernier-voeu", "epee-providence", "sang-elfes"],
  voir: ["calanthe", "ciri", "cahir", "nilfgaard", "yaruga", "skellige"] },

{ id: "vizima", t: "lieu", src: "LJ", nom: "Vizima", alias: ["Wyzima"],
  role: "Capitale de la Témérie",
  resume: "Ville royale de la Témérie, siège du roi Foltest.",
  livres: "Capitale de la Témérie, bâtie au bord du lac de Vizima sur les ruines d'une ancienne cité elfe. Elle sert de cadre à la nouvelle « Le Sorceleur », celle qui a fait naître Geralt en 1986 : la fille du roi Foltest, maudite avant même sa naissance, est devenue une stryge qui sort de sa crypte pour tuer. Velerad, qui gouverne la ville au nom du roi, en brosse un portrait resté célèbre : quatre coudées de haut, une gueule fendue d'une oreille à l'autre, des yeux rouges et des boucles rousses. Le roi veut qu'on lève le sort, pas qu'on tue sa fille : il faut pour cela passer la nuit dans la crypte et empêcher la stryge de regagner son sarcophage avant le troisième chant du coq.",
  jeu: [
    { c: 0, t: "Dans TW3, l'empereur Emhyr tient sa cour dans le palais royal : la Témérie est occupée." },
    { c: 0, t: "Avant l'audience, Geralt est baigné, rasé par ordre d'un chambellan pointilleux, habillé pour la cour et initié à la révérence impériale." },
    { c: 0, t: "Le premier jeu se déroulait en grande partie à Vizima, alors en quarantaine à cause d'une épidémie, et sa cinématique d'ouverture mettait en scène le combat de la nouvelle contre la stryge." }],
  dans: ["dernier-voeu"],
  voir: ["foltest", "emhyr", "m-stryge", "dernier-voeu", "nilfgaard"] },

{ id: "novigrad", t: "lieu", src: "LJ", nom: "Novigrad", alias: [],
  role: "Ville libre, premier port du Nord",
  resume: "Cité marchande immense et cosmopolite, aussi riche que dangereuse.",
  livres: "Ville libre enclavée dans la Rédanie, Novigrad est l'un des plus grands ports du continent : près de trente mille habitants, des marchands de tout poil, des artisans et des banques en nombre. Le Feu éternel passe pour protéger ses habitants de tout mal, monstres compris. Dans « Le Feu éternel », Geralt y retrouve Jaskier au moment où sa fiancée le bombarde de pots de fleurs depuis son balcon. Les deux amis se retrouvent mêlés aux affaires d'un marchand halfelin dont un doppler a pris l'apparence, et à celles du banquier nain Vimme Vivaldi.",
  jeu: [
    { c: 2, t: "L'une des grandes villes du jeu, inspirée d'Amsterdam et de Gdańsk. Selon la carte, c'est la plus grande et la plus riche du monde : le hiérarque de l'Église du Feu éternel la gouverne officiellement, mais les chefs de la pègre y ont leur mot à dire." },
    { c: 2, t: "Le fanatisme y a gagné du terrain : les chasseurs de sorcières y brûlent mages et non-humains. Geralt y cherche Triss, puis Jaskier, et plusieurs de ses pistes passent par les quatre parrains qui se partagent la ville." }],
  dans: ["epee-providence"],
  voir: ["feu-eternel", "dudu", "jaskier", "dijkstra", "triss", "oxenfurt"] },

{ id: "oxenfurt", t: "lieu", src: "LJ", nom: "Oxenfurt", alias: [],
  role: "Ville universitaire de Rédanie",
  resume: "Cité étudiante proche de Novigrad, célèbre pour son académie.",
  livres: "Bâtie sur la rive nord du Pontar, à l'emplacement d'une ancienne cité elfe dont quelques édifices ont survécu, Oxenfurt doit sa renommée à son Académie, la plus grande des Royaumes du Nord, et vit au rythme de ses étudiants et de ses maîtres. Jaskier y a fait ses études, comme Shani, étudiante en médecine. Dans « Le Sang des elfes », Geralt s'y cache pour tendre un piège à Rience ; Jaskier et la jeune Shani l'aident à remonter sa piste, tandis que les espions de Dijkstra filent le poète.",
  jeu: [
    { c: 2, t: "Deuxième ville du jeu, sur le Pontar, non loin de Novigrad : l'Académie, ses étudiants et ses tavernes. La fille du Baron sanglant, Tamara, y a trouvé refuge." },
    { d: "hos", c: 0, t: "Hearts of Stone se joue en partie à Oxenfurt et dans ses environs : Geralt y retrouve Shani, devenue médecin, et y prépare le cambriolage d'une maison de ventes aux enchères." }],
  dans: ["sang-elfes"],
  voir: ["jaskier", "shani", "novigrad", "rience", "dijkstra"] },

{ id: "skellige", t: "lieu", src: "LJ", nom: "Skellige", alias: ["les îles Skellige", "Ard Skellig"],
  role: "Archipel de guerriers et de navigateurs",
  resume: "Des îles battues par les vents, peuplées de marins, de guerriers et de druides.",
  livres: "Un archipel battu par les vents, au large de Cintra, dont les drakkars sont redoutés sur toutes les mers. Le continent tient volontiers ses habitants pour des pirates ; ils passent pour durs et rudes, mais droits, et terrifiants à l'abordage. Les îles sont alliées de longue date de Cintra : dans « Une question de prix », le jarl Eist Tuirseach, le jeune Crach an Craite et le druide Sac-à-souris font partie de la délégation venue au banquet de Pavetta, et Eist finit par épouser la reine Calanthe. Après la chute de Cintra, l'archipel accueille des réfugiés, et ses navires s'en prennent désormais aux côtes de l'Empire.",
  jeu: [
    { c: 3, t: "Région à part entière du jeu : querelles de clans, succession royale et traces de Ciri." },
    { c: 3, t: "L'archipel compte six îles, d'Ard Skellig, la plus grande, à Hindarsfjall, où se dresse le temple de la déesse Freya. Les jarls des clans y élisent leur roi, et la mort du vieux roi Bran rouvre la succession." },
    { c: 6, t: "L'épilogue des îles dépend de leur souverain : Cerys renonce aux raids et fait prospérer l'archipel, Hjalmar multiplie les expéditions contre Nilfgaard, et si Geralt ne s'en mêle pas, Svanrige, fils de Bran, prend la couronne, tourne les clans contre Nilfgaard et fonde une dynastie." }],
  dans: ["dernier-voeu"],
  voir: ["eist", "ermion", "crach", "calanthe", "kaer-trolde", "an-craite"] },

{ id: "toussaint", t: "lieu", src: "LJ", nom: "Toussaint", alias: ["Beauclair"],
  role: "Duché du vin et de la chevalerie",
  resume: "Petit duché vassal de Nilfgaard, ensoleillé, raffiné et obsédé par les codes chevaleresques.",
  livres: "Petit duché vassal de Nilfgaard, niché entre les montagnes, Toussaint doit sa fortune à ses vins, nés d'un sol volcanique et d'un climat idéal. Il n'entretient pas d'armée : des chevaliers errants patrouillent ses routes et ses frontières. Sous les caves de Beauclair, la capitale bâtie autour d'un ancien palais elfe, s'étend un dédale de mines, de galeries et de vieux tunnels de lave. Dans « La Dame du Lac », la compagnie de Geralt y passe l'hiver sous l'œil de la duchesse Anna Henrietta : une parenthèse dorée, où Geralt s'attarde plus que de raison.",
  jeu: [
    { d: "bw", c: 1, t: "Cadre de l'extension Blood and Wine : un pays de vignobles, de châteaux et de chevaliers errants, que la carte du jeu décrit comme un royaume de conte où l'on est perpétuellement éméché. Beauclair, sa capitale, s'étire au bord d'un lac." },
    { d: "bw", c: 0, t: "En paiement d'un contrat, la duchesse cède à Geralt Corvo Bianco, un vieux domaine viticole bâti sur des ruines elfes et déjà cité dans « La Dame du Lac » ; un majordome l'aide à le remettre en état." }],
  dans: ["dame-lac"],
  voir: ["anna-henrietta", "regis", "fringilla", "dame-lac"] },

{ id: "brokilon", t: "lieu", src: "L", nom: "Brokilone", alias: ["Brokilon", "les dryades"],
  role: "Forêt des dryades",
  resume: "Forêt ancienne et sacrée, gardée par les dryades de la reine Eithné, qui abattent les intrus.",
  livres: "Forêt primordiale aux confins de Verden, de Kerack et de Brugge, Brokilone est le seul État non humain du Nord que les hommes n'aient jamais soumis ; eux la surnomment la forêt de la mort. Les dryades de la reine Eithné y marquent leur frontière d'une flèche plantée aux pieds de l'intrus : la suivante ne manque jamais sa cible. Le feu et la hache y sont proscrits, et leur capitale, Duén Canell, se cache au cœur des bois, où l'on n'entre que les yeux bandés. Elles y recueillent des fillettes humaines, que l'eau de Brokilone change en sœurs, et y abritent les Scoia'tael blessés. Geralt y rencontre Ciri enfant dans « L'Épée de la providence », alors qu'il porte à Eithné un message du roi de Brugge, et y revient au début du « Baptême du feu ».",
  rl: "bapteme-feu",
  rev: "Après Thanedd, Triss y téléporte Geralt grièvement blessé : les dryades le soignent, et Milva lui rapporte des nouvelles du monde, avant qu'il ne reparte sur la piste de Ciri.",
  dans: ["epee-providence", "bapteme-feu"],
  voir: ["eithne", "ciri", "milva", "scoiatael", "epee-providence"] },

{ id: "thanedd", t: "lieu", src: "L", nom: "Thanedd", alias: ["Aretuza", "Garstang", "Tor Lara", "Gors Velen"],
  role: "Île des magiciens",
  resume: "Île proche de la ville de Gors Velen, qui abrite l'école de magie d'Aretuza et le palais de Garstang.",
  livres: "Vue du rivage, l'île ressemble moins à une île qu'au pied d'une colonne de pierre géante, enroulée de routes et de terrasses, d'où jaillissent tours blanches et coupoles. Bâtie par les elfes et coiffée de la tour de Tor Lara, qui attire la foudre les soirs d'orage, elle réunit l'école d'Aretuza, où les jeunes magiciennes vivent recluses, le palais de Garstang et Loxia, où l'on reçoit les visiteurs. Dans « Le Temps du mépris », Geralt y accompagne Yennefer au banquet qui ouvre le conclave : robes audacieuses, mets raffinés et conversations à double sens, au milieu de l'élite des magiciens du Nord. Ciri, elle, doit entrer à Aretuza.",
  rl: "temps-mepris",
  rev: "Le conclave tourne au coup d'État : Philippa Eilhart fait arrêter les mages ralliés à Nilfgaard, puis Tissaia de Vries, en désaccord avec elle, lève la protection magique de l'île, et le massacre gagne Garstang, entre magiciens, Scoia'tael et soldats rédaniens. Vilgefortz, qui trahissait le Nord, écrase Geralt, et Ciri s'enfuit par le portail de la tour de Tor Lara, qui la jette loin de là, dans le désert de Korath.",
  dans: ["temps-mepris"],
  voir: ["vilgefortz", "tissaia", "conseil", "temps-mepris", "korath"] },

{ id: "sodden", t: "lieu", src: "L", nom: "Sodden", alias: ["la colline de Sodden"],
  role: "Champ de bataille",
  resume: "Région du Nord où l'invasion nilfgaardienne fut arrêtée lors de la première guerre.",
  livres: "Ancien royaume niché le long de la Yaruga, entre Cintra et Brugge, Sodden voit se livrer deux batailles lors de la première guerre contre Nilfgaard. La première tourne à la déroute pour le Nord ; la seconde, sur la colline de Sodden, voit les magiciens du Nord stopper l'armée impériale, qui doit repasser le fleuve. Treize d'entre eux y laissent la vie, mais l'obélisque élevé à leur mémoire porte quatorze noms. Depuis, la Yaruga coupe la région en deux. Dans « Quelque chose en plus », Geralt, blessé et fiévreux, traverse Sodden dans la charrette du marchand Yurga, qui y habite, et se voit en songe gravir la colline pour lire les noms gravés sur la pierre.",
  dans: ["epee-providence"],
  voir: ["triss", "nilfgaard", "conseil", "yaruga", "epee-providence"] },

{ id: "riv", t: "lieu", src: "L", nom: "Riv", alias: ["Rivia"],
  role: "Ville du royaume de Lyria et Rivia",
  resume: "Petite ville du royaume de Lyria et Rivia, dont Geralt a fait son « nom de famille ».",
  livres: "Capitale de la Rivia, unie au royaume de Lyria sous la couronne de la reine Meve, la ville se dresse au bord du Loc Eskalott, un lac connu pour ses brumes épaisses et blanches ; son château sert de résidence d'hiver aux souverains. Geralt en a fait son « nom de famille ».",
  rl: "dame-lac",
  rev: "Dans « Le Baptême du feu », Geralt avoue n'être pas né à Riv : jeune sorceleur, il voulait s'appeler Geralt Roger Eric du Haute-Bellegarde, mais Vesemir jugea ce nom ridicule et « de Riv » parut plus commode pour inspirer confiance, au point qu'il en imita l'accent. Au début de la guerre, la ville capitule devant les Nilfgaardiens au bout de deux jours. C'est là que s'achève la saga : après Stygga, Geralt et Jaskier y séjournent quand un pogrom contre les non-humains éclate au marché. Geralt, qui prend la défense de ses amis nains, est transpercé d'un coup de fourche ; arrivée avec Ciri et Triss, Yennefer s'épuise à le soigner, et Ciri les emporte tous deux en barque dans les brumes du lac.",
  dans: ["dame-lac"],
  voir: ["geralt", "dame-lac", "meve", "non-humains"] },

{ id: "mahakam", t: "lieu", src: "LJ", nom: "Mahakam", alias: ["les nains"],
  role: "Montagnes des nains",
  resume: "Massif montagneux, patrie des nains et des gnomes, célèbre pour ses forges.",
  livres: "Massif montagneux et royaume des nains et des gnomes, où vivent aussi halfelins et bobolaks. Ses forges produisent armes et armures d'une qualité inégalée, et le vieux Brouver Hoog y fait la loi. Ses enfants courent pourtant les routes : dans « Le Sang des elfes », Geralt, Triss et Ciri font un bout de chemin avec Yarpen Zigrin et sa compagnie, qui escortent un mystérieux convoi pour le roi de Kaedwen ; dans « Le Baptême du feu », Zoltan Chivay et sa troupe fuient la guerre, et Zoltan ne cache pas son mépris pour Brouver Hoog.",
  jeu: [{ c: 0, t: "Mahakam n'est visitable dans aucun des trois jeux de Geralt, mais Thronebreaker (2018) y conduit la reine Meve, venue chercher de l'aide auprès de Brouver Hoog." }],
  voir: ["zoltan", "non-humains", "gwynt", "meve"] },

{ id: "dol-blathanna", t: "lieu", src: "L", nom: "Dol Blathanna", alias: ["la Vallée des Fleurs"],
  role: "La Vallée des Fleurs",
  resume: "Vallée autrefois elfe, symbole de tout ce que les elfes ont perdu face aux humains.",
  livres: "La Vallée des Fleurs, en Aedirn, au pied des Montagnes Bleues, appartenait aux elfes depuis des siècles quand les humains s'en sont emparés, une centaine d'années avant la saga ; ses anciens maîtres ont reflué dans les montagnes, où ils survivent à grand-peine. Dans « Le Bout du monde », Geralt et Jaskier y sont engagés par des paysans pour chasser un « diable » qui sème le désordre dans leurs champs, en réalité un sylvain farceur, puis croisent les elfes de Filavandrel : l'une des nouvelles les plus mélancoliques du recueil, sur un peuple qui s'éteint.",
  rl: "temps-mepris",
  rev: "Emhyr y offre à Francesca Findabair un royaume elfe, prix de son ralliement.",
  dans: ["dernier-voeu"],
  voir: ["francesca", "scoiatael", "non-humains", "dernier-voeu", "m-chort"] },

{ id: "tir-na-lia", t: "lieu", src: "LJ", nom: "Tir ná Lia", alias: [],
  role: "Cité des Aen Elle",
  resume: "Capitale des elfes Aen Elle, dans un autre monde que celui de Geralt.",
  livres: "Capitale du monde des Aen Elle, où règne le vieux roi Auberon Muircetach, traversée par la rivière Easnadh. « La Dame du Lac » la décrit comme une cité d'une beauté presque irréelle : des édifices de marbre, d'albâtre et de malachite, ouverts à tous les vents, si aériens qu'ils semblent moins des bâtiments que des fantômes de bâtiments, et une profusion de ponts, de terrasses, de péristyles et de balcons.",
  rl: "dame-lac",
  rev: "Ciri y est retenue dans « La Dame du Lac », au cœur des intrigues d'Avallac'h et d'Eredin : les Aen Elle attendent d'elle qu'elle donne au roi Auberon un enfant porteur du Sang Ancien. Elle finit par leur échapper, avec l'aide des licornes.",
  jeu: [{ c: 6, t: "Geralt n'y passe qu'une fois, au fil d'un voyage entre les mondes avec Avallac'h, pour y rencontrer le vice-roi Ge'els. Avallac'h ne manque pas de lui vanter une architecture elfique « un peu plus raffinée » que celle des humains." }],
  dans: ["dame-lac"],
  voir: ["aen-elle", "avallach", "eredin", "auberon", "tor-zireael"] },

{ id: "stygga", t: "lieu", src: "L", nom: "Le château de Stygga", alias: ["Stygga"],
  role: "Forteresse isolée",
  resume: "Château perdu où se joue le dénouement de la saga.",
  livres: "Une vaste citadelle perchée sur une falaise, au-dessus d'un lac, quelque part dans la province impériale d'Ebbing. Son nom n'apparaît que dans les deux derniers tomes de la saga.",
  rl: "dame-lac",
  rev: "C'est le repaire de Vilgefortz, qui y retient Yennefer et y attend Ciri ; un tourbillon magique y transporte les navires engloutis par le gouffre de Sedna. La compagnie de Geralt y donne l'assaut : Milva, Cahir, Regis et Angoulême y tombent, Geralt tue Vilgefortz, Ciri tue Bonhart, et Emhyr, survenu avec ses troupes, se révèle être son père avant de la laisser partir. La Loge fait ensuite détruire le château, dont il ne reste rien.",
  dans: ["dame-lac"],
  voir: ["vilgefortz", "dame-lac", "yennefer", "bonhart"] },

{ id: "melitele", t: "lieu", src: "L", nom: "Le temple de Melitele", alias: ["Ellander"],
  role: "Sanctuaire de la déesse-mère",
  resume: "Temple de la déesse Melitele, à Ellander, dirigé par la prêtresse Nenneke : un refuge pour Geralt.",
  livres: "Le plus célèbre sanctuaire de la déesse-mère se dresse aux portes de la ville d'Ellander, dans la vallée du Pontar. Une allée de peupliers mène aux bâtiments adossés à la montagne, entre jardins, dépendances et une grotte aménagée en serre sous un toit de cristal. La prêtresse Nenneke y soigne malades et blessés, aide aux accouchements et forme les novices. Dans « La Voix de la raison », Geralt y panse ses blessures et s'attache à Iola, une jeune prêtresse vouée au silence. Ciri y est ensuite instruite par Nenneke et s'y lie d'amitié avec Jarre, un jeune copiste qui ne quitte guère la bibliothèque, avant que Yennefer ne prenne en main son éducation.",
  dans: ["dernier-voeu", "sang-elfes"],
  voir: ["nenneke", "ciri", "yennefer", "dernier-voeu", "sang-elfes"] },

{ id: "tor-zireael", t: "lieu", src: "L", nom: "Tor Zireael", alias: ["la Tour de l'Hirondelle"],
  role: "Tour elfique",
  resume: "Tour elfique légendaire, que l'on dit capable d'ouvrir des passages vers d'autres mondes.",
  livres: "Siège légendaire des mages elfes, la tour passe pour ouvrir des portes vers d'autres mondes. La plupart des érudits la tiennent pour un mythe : nul ne sait plus où elle se dresse, et là où elle se trouve, on ne voit d'ordinaire que des ruines, d'où elle ne surgit qu'un instant de la brume.",
  rl: "dame-lac",
  rev: "Ciri y trouve refuge dans « La Tour de l'Hirondelle ». Tor Zireael était jadis reliée par un portail à Tor Lara, la tour de Thanedd par laquelle elle a fui, et elle espère y retrouver le chemin du retour. Traquée, elle affronte ses poursuivants sur le lac gelé de Tarn Mira, sur la rive nord duquel se dresse la tour ; mais celle-ci l'emporte jusque dans le monde des Aen Elle.",
  dans: ["tour-hirondelle", "dame-lac"],
  voir: ["ciri", "tour-hirondelle", "aen-elle", "thanedd"] },

{ id: "velen", t: "lieu", src: "J", nom: "Velen", alias: [],
  role: "Région marécageuse",
  resume: "Création du jeu : une région pauvre et marécageuse, aux confins de la Témérie, ravagée par la guerre, où règnent déserteurs, monstres et vieilles légendes.",
  jeu: [
    { c: 1, t: "Grande région du jeu, où la piste de Ciri passe par le Baron sanglant et les Moires." },
    { c: 1, t: "Un livre du jeu, « Terres du nord : Velen », la décrit comme l'une des provinces les plus pauvres de la Témérie, couverte de marais et de tourbières ; sa capitale est Gors Velen, et son territoire englobe l'île de Thanedd, siège de la célèbre académie de magie." },
    { c: 1, t: "Ravagée par les armées nilfgaardiennes et rédaniennes, la région n'appartient plus à personne : un ancien officier témérien, le Baron sanglant, s'est installé dans la place forte de Perchefreux avec les survivants de sa troupe." },
    { c: 1, t: "Dans les campagnes, les autels de Melitele côtoient le culte des Moires, et la figure de la déesse y est souvent tachée du sang des sacrifices : on prie ces vieilles divinités autant qu'on les redoute." }],
  voir: ["baron", "dames-bois", "keira", "uma", "thanedd"] },

{ id: "verger-blanc", t: "lieu", src: "J", nom: "Blanchefleur", alias: ["White Orchard", "le Verger Blanc"],
  role: "Village du prologue",
  resume: "Création du jeu : un village temérien encore sous le choc de l'invasion nilfgaardienne. C'est là que commence la quête de Geralt dans TW3.",
  jeu: [
    { c: 0, t: "Un griffon y sème la terreur : c'est le premier grand monstre du jeu." },
    { c: 0, t: "À l'auberge, Geralt glane des nouvelles de Yennefer auprès d'un marchand ambulant et découvre le gwynt grâce à un érudit ; le commandant de la garnison nilfgaardienne, lui, ne dira rien tant que le griffon vivra." },
    { c: 0, t: "Ce griffon a ses raisons : des soldats nilfgaardiens ont tué sa femelle au nid, et les griffons s'unissent pour la vie. L'herboriste Tomira indique à Geralt où trouver le nerprun qui servira d'appât." },
    { d: "hos", c: 0, t: "Le marchand ambulant qui renseignait Geralt à l'auberge de Blanchefleur n'est autre que Gaunter de Meuré, la figure centrale de Hearts of Stone." }],
  voir: ["yennefer", "vesemir", "nilfgaard", "m-griffon", "gwynt"] },

{ id: "ile-brumes", t: "lieu", src: "J", nom: "L'Île des Brumes", alias: ["Isle of Mists"], porte: { c: 4 },
  role: "Île légendaire",
  resume: "Création du jeu : une île perdue dans un brouillard perpétuel, que nul ne trouve sans guide.",
  jeu: [
    { c: 5, t: "C'est là que Geralt retrouve enfin Ciri." },
    { c: 5, t: "Avallac'h y a caché Ciri, plongée dans un sommeil magique, pour la soustraire à la Chasse. Selon le journal, on n'atteint l'île que si le destin vous en juge digne, ou en suivant une luciole magique, solution nettement plus simple." },
    { c: 5, t: "Dans une chaumière, Geralt trouve une poignée de nains apeurés, clin d'œil appuyé à Blanche-Neige, et Ciri étendue sans vie, jusqu'à ce que la luciole la ramène. La Chasse surgit aussitôt, et Ciri les téléporte à Kaer Morhen." }],
  voir: ["ciri", "avallach", "kaer-morhen", "skellige"] },

/* ---------- Peuples et factions ---------- */
{ id: "sorceleurs", t: "faction", src: "LJ", nom: "Les sorceleurs", alias: ["witchers", "écoles de sorceleurs"],
  role: "Chasseurs de monstres mutants",
  resume: "Des enfants recueillis, parfois au titre de la Loi de la Surprise, puis transformés pour chasser les monstres. Peu survivent à leur formation.",
  livres: "Enfants trouvés, abandonnés ou réclamés au titre de la Loi de la Surprise, les futurs sorceleurs subissent une sélection impitoyable, puis les mutations de l'Épreuve des Herbes : combien reçoivent au bout du compte le médaillon, se demande la reine Calanthe : un sur dix, un sur vingt ? Les mutations les rendent stériles, leur donnent des sens et des réflexes hors norme et des yeux de chat, et ralentissent leur vieillissement. Ils portent deux épées, l'acier contre les humains, l'argent contre les monstres, et usent de Signes, de potions et d'un médaillon sensible à la magie. Méprisés autant qu'indispensables, ils sont en voie de disparition à l'époque de la saga : les monstres se raréfient, Kaer Morhen a été prise d'assaut par des fanatiques, et le secret des mutations s'est perdu.",
  jeu: [
    { c: 0, t: "Les écoles (Loup, Chat, Griffon, Vipère, Ours, puis Manticore) sont surtout développées par les jeux, à travers leurs équipements à retrouver." },
    { c: 0, t: "Dans TW3, Geralt vit des contrats affichés sur les panneaux des villages : il enquête grâce à ses sens de sorceleur, négocie la prime, puis prépare huiles, potions et bombes d'après le bestiaire." },
    { c: 4, t: "À Kaer Morhen, Geralt retrouve les derniers loups de l'école, Vesemir, Eskel et Lambert, dans une forteresse à demi en ruine où l'on ne forme plus guère d'apprentis. Ils s'y préparent ensemble à affronter la Chasse." }],
  dans: ["dernier-voeu", "sang-elfes", "croisee"],
  voir: ["epreuve", "signes", "medaillon", "potions", "kaer-morhen", "loi-surprise"] },

{ id: "nilfgaard", t: "faction", src: "LJ", nom: "Nilfgaard", alias: ["l'Empire", "les Noirs", "Nilfgaardiens"],
  role: "Empire du Sud",
  resume: "Puissant empire conquérant, discipliné et centralisé, dont les soldats en armure noire portent le soleil sur leurs étendards.",
  livres: "Sous Emhyr var Emreis, l'Empire envahit Cintra, puis relance la guerre après Thanedd. Ses soldats en armure noire, que les gens du Nord surnomment « les Noirs », portent sur leurs étendards le soleil, et ses sujets jurent par le Grand Soleil. L'Empire a absorbé l'un après l'autre ses voisins méridionaux, devenus des provinces comme Metinna, Nazair ou Ebbing, et sa langue dérive de la Langue ancienne. Discipliné et centralisé, il soutient en sous-main les commandos elfes et nourrit une obsession : retrouver Ciri.",
  rl: "dame-lac",
  rev: "Malgré ses victoires, l'Empire est battu à Brenna par les armées du Nord, et la paix de Cintra suit peu après. Emhyr épouse alors une fausse Cirilla pour s'assurer Cintra, par raison d'État.",
  jeu: [
    { c: 0, t: "Dans TW3, c'est la troisième offensive contre le Nord : la Témérie est occupée et la Rédanie résiste." },
    { c: 6, t: "Selon les choix faits au fil du jeu, l'épilogue montre un Nord intégré à l'Empire ou un Nilfgaard vaincu par la Rédanie ; Ciri peut même succéder à Emhyr sur le trône impérial." }],
  dans: ["sang-elfes", "temps-mepris", "bapteme-feu", "tour-hirondelle", "dame-lac"],
  voir: ["emhyr", "cahir", "royaumes-nord", "scoiatael", "vizima", "toussaint"] },

{ id: "royaumes-nord", t: "faction", src: "LJ", nom: "Les Royaumes du Nord", alias: ["Temeria", "Redanie", "Kaedwen", "Aedirn", "Lyria", "Kovir", "le Nord"],
  role: "Royaumes humains rivaux",
  resume: "Témérie, Rédanie, Kaedwen, Aedirn, Lyria et Rivia, Kovir : des royaumes rivaux que seule la menace nilfgaardienne pousse à s'entendre.",
  livres: "Les quatre grands royaumes du Nord sont la Témérie du roi Foltest, capitale Vizima, la Rédanie de Vizimir II, capitale Tretogor, le Kaedwen d'Henselt, capitale Ard Carraigh, et l'Aedirn de Demavend, capitale Vengerberg. Autour d'eux gravitent des États plus petits, comme la Lyrie et Riv de la reine Meve, Cidaris, Kerack ou Verden, tandis qu'au nord le riche Kovir cultive sa neutralité. Novigrad, enclavée en Rédanie, est une ville libre. Unis un temps contre Nilfgaard sur la colline de Sodden, leurs rois complotent autant qu'ils se battent : dans « Le Sang des elfes », ils se réunissent en secret au château de Hagge pour préparer la guerre.",
  rl: "temps-mepris",
  rev: "La nuit du coup de Thanedd, Vizimir II est poignardé par un assassin elfe : la Rédanie passe sous la coupe d'un conseil de régence mené par Dijkstra et Philippa Eilhart, tandis que Nilfgaard envahit la Lyrie et l'Aedirn.",
  jeu: [
    { c: 0, t: "Dans TW3, la Rédanie du roi Radovid mène la résistance face à Nilfgaard." },
    { c: 6, t: "L'épilogue dépend surtout du sort de Radovid : s'il survit, la Rédanie écrase Nilfgaard et annexe tout le Nord ; s'il est assassiné, Nilfgaard l'emporte et la Témérie devient un État vassal, à moins que Dijkstra ne prenne la tête de la Rédanie et ne repousse l'Empire." }],
  dans: ["sang-elfes", "temps-mepris", "bapteme-feu", "dame-lac"],
  voir: ["foltest", "radovid", "nilfgaard", "dijkstra", "meve", "roche"] },

{ id: "conseil", t: "faction", src: "L", nom: "Le Chapitre et le Conseil", alias: ["Chapitre des magiciens", "Conseil des magiciens", "magiciens"],
  role: "Instances des magiciens",
  resume: "Les deux assemblées qui encadrent la pratique de la magie dans le Nord.",
  livres: "Le Chapitre, petit cercle des magiciens les plus éminents, et le Conseil, plus large, encadrent la confrérie des magiciens. Leurs membres conseillent les rois, et leurs rivalités pèsent sur la politique du continent. Deux écoles forment la relève : Aretuza, sur l'île de Thanedd, pour les jeunes filles, et Ban Ard, pour les garçons. Le conclave de Thanedd les réunit tous dans « Le Temps du mépris » : une soirée fastueuse à Aretuza, puis des débats au palais de Garstang, où se jouent la paix et la guerre.",
  rl: "bapteme-feu",
  rev: "Le conclave tourne au coup d'État : à l'aube, Philippa Eilhart et les hommes de Dijkstra passent des menottes de dimeritium aux magiciens ralliés à Nilfgaard, Vilgefortz en tête. Tissaia de Vries les libère, la bataille éclate, et la rectrice d'Aretuza, désespérée, se donne la mort peu après. La confrérie ne s'en relève pas : dans « Le Baptême du feu », la Loge des Magiciennes prend sa place, en secret.",
  dans: ["temps-mepris"],
  voir: ["thanedd", "loge", "vilgefortz", "tissaia", "philippa", "dimeritium"] },
