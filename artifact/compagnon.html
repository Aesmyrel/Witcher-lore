<title>Compagnon du Sorceleur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
/* Mise en page : une application de téléphone, colonne de 440 px au plus.
   Barre d'app collée en haut, onglets à icônes en bas sous le pouce, vues poussées qui glissent de droite.
   Sur grand écran, la colonne reste à taille de téléphone et un panneau invite à scanner le QR code.
   Bleu : ce qui vient des livres. Ambre : ce qui vient du jeu. */
:root{
  --bg:#e8ecea;--sf:#f6f8f7;--ink:#17262c;--mu:#52666a;--ln:#c3cecb;
  --ac:#8a5a0b;--bk:#2f6482;--ok:#2d6a46;--ko:#a3392b;
  --land:#dfe5df;--sea:#c7d4d8;--coast:#97aaab;--forest:#b4c6b0;--desk:#d5dcd9;
  --serif:"IM Fell English",Georgia,"Times New Roman",serif;
  --sans:"Alegreya Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --col:480px;--barh:52px;--tabh:60px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141b1f;--sf:#1c262b;--ink:#e4e9e7;--mu:#8fa1a2;--ln:#2b3a40;--ac:#e2b04a;--bk:#8fb8d1;--ok:#7cc79a;--ko:#ec8a7a;--land:#1e292e;--sea:#10171a;--coast:#3b4d54;--forest:#253730;--desk:#0d1215;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141b1f;--sf:#1c262b;--ink:#e4e9e7;--mu:#8fa1a2;--ln:#2b3a40;--ac:#e2b04a;--bk:#8fb8d1;--ok:#7cc79a;--ko:#ec8a7a;--land:#1e292e;--sea:#10171a;--coast:#3b4d54;--forest:#253730;--desk:#0d1215;color-scheme:dark}
:root[data-theme="oled"]{--bg:#000;--sf:#0c1012;--ink:#e6ebe9;--mu:#8fa1a2;--ln:#222c30;--ac:#e2b04a;--bk:#8fb8d1;--ok:#7cc79a;--ko:#ec8a7a;--land:#0e1518;--sea:#000;--coast:#2b3a40;--forest:#1a2922;--desk:#000;color-scheme:dark}
:root[data-taille="grand"]{font-size:112.5%}
:root[data-taille="tres-grand"]{font-size:125%}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.55 var(--sans);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
[hidden]{display:none!important}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
a{color:var(--bk)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
h2{font:400 1.875rem/1.15 var(--serif);margin:.3em 0;text-wrap:balance}
h3{font:700 1rem/1.3 var(--sans);margin:1.7em 0 .5em;text-wrap:balance}
p{margin:.5em 0}
.mu{color:var(--mu)}
.sm{font-size:.9rem}
.eb{font-variant-numeric:lining-nums;font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:1.2em 0 0}
.ct{font:400 1.45rem/1.2 var(--serif);margin:.2em 0}

/* Colonne de l'application */
.app{max-width:var(--col);margin:0 auto;min-height:100vh;background:var(--bg)}
main{padding:2px 16px calc(var(--tabh) + 40px + env(safe-area-inset-bottom,0px))}

/* Lecteur à voix haute, au-dessus des onglets */
.player{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px));z-index:9;width:min(100%,var(--col));display:flex;align-items:center;gap:4px;padding:6px 8px 6px 16px;background:var(--sf);border-top:1px solid var(--ln);box-shadow:0 -6px 18px rgb(0 0 0 / .08)}
.pl-t{flex:1;min-width:0}
.pl-t b{display:block;font:400 1.05rem/1.2 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-t small{color:var(--mu);font-size:.8rem;font-variant-numeric:lining-nums tabular-nums}
body.lit main{padding-bottom:calc(var(--tabh) + 110px + env(safe-area-inset-bottom,0px))}
body.lit .toast{bottom:calc(var(--tabh) + 72px + env(safe-area-inset-bottom,0px))}

/* Barre d'app */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;display:flex;align-items:center;gap:2px;height:var(--barh);padding:0 6px;background:var(--bg);border-bottom:1px solid var(--ln);user-select:none;-webkit-user-select:none}
.bar h1{flex:1;min-width:0;margin:0 4px;font:400 1.3rem/1 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{display:inline-grid;place-items:center;width:44px;height:44px;flex:0 0 auto;border:0;background:none;border-radius:50%;color:var(--ink)}
.ic svg{width:24px;height:24px}
.ic:active{background:var(--ln)}
.em{width:36px;height:36px}

/* Onglets */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:9;width:min(100%,var(--col));display:flex;background:var(--sf);border-top:1px solid var(--ln);padding:0 4px env(safe-area-inset-bottom,0px);user-select:none;-webkit-user-select:none}
.tabs button{flex:1;min-width:0;height:var(--tabh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:0;border-top:3px solid transparent;margin-top:-1px;padding:0 2px;font-size:min(.72rem,12.5px);color:var(--mu)}
.tabs button svg{width:24px;height:24px}
.tabs button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs button.on{color:var(--ink);font-weight:700;border-top-color:var(--ac)}

/* Progression */
.stepper{display:flex;overflow-x:auto;scrollbar-width:none;margin:6px -16px 0;padding:0 8px;border-bottom:1px solid var(--ln)}
.stepper::-webkit-scrollbar{display:none}
.st{position:relative;flex:1 0 auto;min-width:72px;background:none;border:0;padding:10px 8px;color:var(--mu);font-size:.85rem;white-space:nowrap}
.st::before{content:"";position:absolute;top:18px;left:0;right:0;height:2px;background:var(--ln)}
.st:first-child::before{left:50%}.st:last-child::before{right:50%}
.st.done::before{background:var(--ac)}
.st.on::before{background:linear-gradient(90deg,var(--ac) 50%,var(--ln) 50%)}
.st:first-child.on::before{background:var(--ln)}.st:last-child.on::before{background:var(--ac)}
.st i{display:block;position:relative;z-index:1;width:18px;height:18px;margin:0 auto 5px;border-radius:50%;border:2px solid var(--ln);background:var(--bg)}
.st.done i{border-color:var(--ac)}
.st.on{color:var(--ink);font-weight:700}
.st.on i{border-color:var(--ac);background:var(--ac)}
.st.on i::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:12px;margin:-6px 0 0 -2px;border-radius:50%;background:var(--bg)}
.pend{border:1px solid var(--ac);border-radius:8px;padding:6px 14px 12px;margin:12px 0;background:var(--sf)}

/* Listes */
.ro{position:relative;display:block;width:100%;min-height:52px;text-align:left;background:none;border:0;border-bottom:1px solid var(--ln);padding:11px 4px 11px 16px}
.ro::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:5px;border-radius:3px;background:var(--bk)}
.ro.J::before{background:var(--ac)}.ro.LJ::before{background:linear-gradient(var(--bk) 50%,var(--ac) 50%)}
.ro:active{background:var(--sf)}
.ro b{display:block}.ro small{display:block;color:var(--mu);font-size:.9rem}
.gh{display:flex;align-items:baseline;gap:8px;font:400 1.35rem/1.2 var(--serif);margin:1.4em 0 .2em}
.gh span{font:700 .8rem var(--sans);color:var(--mu)}

/* Pastilles et boutons */
.ch{display:inline-flex;align-items:center;gap:6px;min-height:36px;border:1px solid var(--ln);background:none;font-size:.92rem;padding:4px 13px;border-radius:99px;text-align:left}
.ch:active{background:var(--sf)}
.ch.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ch svg,.pr svg{width:17px;height:17px;flex:0 0 auto}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.fl{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 4px;margin:0 -16px;scrollbar-width:none}.fl .ch{flex:0 0 auto}
.fl::-webkit-scrollbar{display:none}
.pr{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:10px 18px;font-weight:700}
.pr:disabled{opacity:.5;cursor:default}
.pr.wide{width:100%}
.lnk{background:none;border:0;padding:0;color:inherit;font:inherit;text-decoration:underline;text-decoration-color:var(--ln);text-underline-offset:3px;text-align:left}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.fake{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;margin-top:10px;padding:0 14px;border:1px solid var(--ln);border-radius:10px;background:var(--sf);color:var(--mu);text-align:left}
.fake svg{width:20px;height:20px}
.srch{display:flex;gap:6px;align-items:flex-start}
.srch input,.srch textarea{flex:1;min-width:0}
.mic{margin-top:10px;border:1px solid var(--ln);background:var(--sf)}
.mic.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
@media (prefers-reduced-motion:no-preference){.mic.on{animation:ecoute 1.2s ease-in-out infinite}}
@keyframes ecoute{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--ac) 30%,transparent)}}
.eb svg{width:14px;height:14px;vertical-align:-2px}

/* Blocs de contenu */
.bl{border-left:3px solid var(--bk);padding:1px 0 1px 13px;margin:12px 0}.bl.j{border-color:var(--ac)}.bl h3{margin:.4em 0 .3em}
.sp{display:block;width:100%;min-height:48px;text-align:left;border:1px dashed var(--mu);background:none;border-radius:8px;padding:10px 12px;margin:12px 0}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:4px 16px 14px;margin:18px 0}
.card .eb{margin-top:12px}
.card.hi{border-color:var(--ac)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-height:84px;text-align:left;border:1px solid var(--ln);background:var(--sf);border-radius:12px;padding:12px}
.tile svg{width:22px;height:22px;color:var(--ac)}
.tile b{font:400 1.12rem/1.15 var(--serif)}
.tile small{color:var(--mu);font-size:.82rem;line-height:1.3}
.gate{border:1px dashed var(--ac);border-radius:12px;padding:4px 16px 16px;margin:18px 0}
.src.L{color:var(--bk)}.src.J{color:var(--ac)}.src.LJ{color:var(--ink)}
.lead::first-letter{float:left;font:400 3.1em/.82 var(--serif);margin:.06em .1em 0 0;color:var(--ac)}
.kv{margin:.35em 0}.kv b{display:inline-block;min-width:6.5rem;color:var(--mu);font-weight:500}
.sg{display:inline-flex;align-items:center;gap:5px;margin-right:12px;white-space:nowrap}.sg i{width:9px;height:9px;border-radius:50%}
input[type=search],input[type=text],textarea{width:100%;font:inherit;font-size:max(16px,1rem);padding:11px 13px;border:1px solid var(--ln);border-radius:10px;background:var(--sf);color:var(--ink);margin-top:10px}
textarea{resize:vertical}
.out{white-space:pre-wrap;margin:14px 0;min-height:1.5em}
.lx{border-bottom:1px solid var(--ln);padding:10px 0}
.lx p{margin:.15em 0}.lx b{font:400 1.3rem var(--serif);margin-right:6px}
.note{font-size:.82rem;color:var(--mu);margin-top:-.2em}

/* Illustrations */
.fig{margin:16px 0}
.fig button{display:block;width:100%;padding:0;border:0;background:none}
.fig img{display:block;width:100%;height:auto;max-height:420px;object-fit:cover;border-radius:10px;border:1px solid var(--ln);background:var(--sf)}
.fig figcaption{font-size:.8rem;color:var(--mu);margin-top:6px}
.srcard{border-bottom:1px solid var(--ln);padding:6px 0 16px}
.srcard .ct{margin-top:.4em}
.lb{position:fixed;inset:0;z-index:50;background:rgb(6 10 12 / .92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));color:#e4e9e7}
.lb img{max-width:100%;max-height:78vh;object-fit:contain;border-radius:6px}
.lb p{font-size:.9rem;text-align:center;max-width:var(--col)}
.lb .ch{color:#e4e9e7;border-color:#52666a;margin-top:6px}

/* Frises */
.tl{border-left:2px solid var(--ln);margin:14px 0 0 6px}
.ti{position:relative;padding:0 0 20px 18px}
.ti::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--bk)}
.ti.J::before{background:var(--ac)}
.ti b{font:400 1.18rem var(--serif)}

/* Livres */
.seg{display:flex;gap:4px;border:1px solid var(--ln);border-radius:99px;padding:3px;margin:12px 0 6px}
.seg button{flex:1;min-width:0;min-height:38px;background:none;border:0;border-radius:99px;padding:6px 4px;font-size:.88rem;color:var(--mu)}
.seg button.on{background:var(--ink);color:var(--bg);font-weight:700}
.prog{display:flex;align-items:center;gap:12px;margin:14px 0;font-size:.9rem;color:var(--mu);font-variant-numeric:lining-nums tabular-nums}
.bar-p{flex:1;height:6px;border-radius:3px;background:var(--ln);overflow:hidden}
.bar-p i{display:block;height:100%;background:var(--ac)}
.books{list-style:none;margin:0;padding:0}
.books li{display:grid;grid-template-columns:40px 1fr;gap:4px 10px;border-bottom:1px solid var(--ln);padding:14px 0}
.books .num{font:400 2rem/1 var(--serif);color:var(--bk);font-variant-numeric:lining-nums tabular-nums;padding-top:4px}
.books li.lu .num{color:var(--ac)}
.books .bi{min-width:0}
.books .ct{font-size:1.35rem}

/* Lignée */
.tree{display:flex;flex-direction:column;align-items:center;margin:18px 0 8px;text-align:center}
.gen{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.node{min-width:118px;max-width:46%;border:1px solid var(--ln);background:var(--sf);border-radius:10px;padding:8px 10px;font:inherit;text-align:center}
.node b{display:block;font:400 1.1rem/1.15 var(--serif)}
.node small{display:block;color:var(--mu);font-size:.78rem;line-height:1.3;margin-top:2px}
.node.k{border-color:var(--bk)}
.node.me{border:2px solid var(--ac)}
.node.plain{background:none;border-style:dashed}
.amp{color:var(--mu);font:italic 400 1rem var(--serif)}
.ln{width:2px;height:22px;background:var(--ln)}
.ln.dash{background:none;border-left:2px dashed var(--ln)}
.gap{font-size:.82rem;color:var(--mu);max-width:280px;margin:4px 0}

/* Carte */
.mapw{position:relative;margin:10px -16px 0;background:var(--sea);border-block:1px solid var(--ln);overflow:hidden}
#map{display:block;width:100%;height:auto;aspect-ratio:400/560;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
#map .land{fill:var(--land);stroke:var(--coast);stroke-width:1.2}
#map .riv{fill:none;stroke:var(--bk);stroke-width:1.6;stroke-linecap:round;opacity:.75}
#map .mt{fill:none;stroke:var(--mu);stroke-width:1.1;stroke-linejoin:round;opacity:.65}
#map .fo{fill:var(--forest)}
#map .rg{font-family:var(--serif);font-style:italic;fill:var(--mu);letter-spacing:.08em;text-transform:uppercase;text-anchor:middle;pointer-events:none}
#map .rg.mer{letter-spacing:.2em}
#map .rl{font-family:var(--serif);font-style:italic;fill:var(--bk);pointer-events:none}
#map .pin{cursor:pointer}
#map .pin .dot{fill:var(--bk);stroke:var(--land);stroke-width:2}
#map .pin.J .dot{fill:var(--ac)}
#map .pin.LJ .dot{fill:var(--ink)}
#map .pin text{font:600 11px var(--sans);fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:3px;stroke-linejoin:round}
#map .pin .hit{fill:transparent}
#map .pin.sel .dot{stroke:var(--ac);stroke-width:3}
#map .ring{fill:none;stroke:var(--ac);stroke-width:2;transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:no-preference){#map .ring{animation:ring 2s ease-out infinite}}
@keyframes ring{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.5);opacity:0}}
.mapctl{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.mapctl .ic{background:var(--sf);border:1px solid var(--ln)}
.mapcard{position:absolute;left:10px;right:10px;bottom:10px;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:8px 14px 12px;box-shadow:0 6px 24px rgb(0 0 0 / .18)}
.mapcard .ct{margin:.2em 0 0}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.85rem;color:var(--mu);margin:10px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:baseline}

/* Quiz */
.qq{font:400 1.45rem/1.3 var(--serif);margin:14px 0 10px;text-wrap:balance}
.opts{display:grid;gap:8px;margin:10px 0}
.opt{min-height:50px;text-align:left;border:1px solid var(--ln);background:var(--sf);border-radius:10px;padding:11px 14px}
.opt:disabled{cursor:default;color:inherit}
.opt.good{border-color:var(--ok);box-shadow:inset 4px 0 0 var(--ok)}
.opt.bad{border-color:var(--ko);box-shadow:inset 4px 0 0 var(--ko)}
.fb{font-weight:700}.fb.ok{color:var(--ok)}.fb.ko{color:var(--ko)}
.res{text-align:center;padding-block:10px 18px}
.big{font:400 4.5rem/1 var(--serif);margin:14px 0 0;font-variant-numeric:lining-nums tabular-nums}.big span{font-size:2rem;color:var(--mu)}
.recap{list-style:none;padding:0;margin:8px 0}
.recap li{border-bottom:1px solid var(--ln);padding:8px 0 8px 26px;position:relative;font-size:.92rem}
.recap li::before{position:absolute;left:0;top:8px;font-weight:700}
.recap li.ok::before{content:"✓";color:var(--ok)}.recap li.ko::before{content:"✗";color:var(--ko)}

/* Réglages */
.set{margin:4px 0 22px}
.set h3{margin:1.4em 0 .4em}
.line{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;border-bottom:1px solid var(--ln);padding:6px 0}
.line>span{min-width:0}
.line small{display:block;color:var(--mu);font-size:.85rem}
.sw{appearance:none;-webkit-appearance:none;flex:0 0 auto;width:48px;height:28px;border-radius:99px;background:var(--mu);position:relative;margin:0;cursor:pointer;transition:background-color .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--bg);transition:transform .15s}
.sw:checked{background:var(--ac)}
.sw:checked::after{transform:translateX(20px)}
.pick{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;text-align:left;border:0;border-bottom:1px solid var(--ln);background:none;padding:8px 2px}
.pick i{flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:2px solid var(--ln)}
.pick[aria-pressed="true"] i{border:7px solid var(--ac)}
.pick span{min-width:0}
.pick small{display:block;color:var(--mu);font-size:.85rem}
.steps{counter-reset:s;list-style:none;padding:0;margin:8px 0}
.steps li{counter-increment:s;position:relative;padding:4px 0 8px 34px}
.steps li::before{content:counter(s);position:absolute;left:0;top:3px;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:.8rem;font-weight:700;display:grid;place-items:center}

/* Accueil guidé */
.onb{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;justify-content:center;overflow:auto}
.onbc{width:100%;max-width:var(--col);min-height:100%;display:flex;flex-direction:column;padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px))}
.onbc .grow{flex:1}
.onbc h2{font-size:2.1rem}
.dots{display:flex;gap:6px;justify-content:center;margin:12px 0}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--ln)}
.dots i.on{background:var(--ac);width:22px;border-radius:4px}
.onbb{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:10px}
.hero{display:flex;justify-content:center;margin:12px 0 6px}
.hero svg{width:112px;height:112px;color:var(--ink)}
.feat{list-style:none;padding:0;margin:14px 0}
.feat li{display:flex;gap:12px;align-items:flex-start;padding:8px 0}
.feat svg{flex:0 0 auto;width:24px;height:24px;color:var(--ac);margin-top:2px}

/* Partage, messages */
.ov{position:fixed;inset:0;z-index:30;background:rgb(10 16 19 / .5);display:flex;align-items:flex-end;justify-content:center}

/* Grand écran : la colonne garde sa taille de téléphone */
.desk{display:none}
@media (min-width:900px){
  body{background:var(--desk)}
  .app{box-shadow:0 0 0 1px var(--ln),0 20px 60px rgb(0 0 0 / .18)}
  .desk{display:flex;flex-direction:column;gap:10px;position:fixed;top:50%;transform:translateY(-50%);right:calc(50% + var(--col) / 2 + 48px);width:300px;color:var(--ink)}
  .desk h2{font-size:2.2rem}
  .desk canvas{width:180px;height:180px;border-radius:10px;border:1px solid var(--ln);background:#fff}
}

/* Transitions entre les vues */
@media (prefers-reduced-motion:no-preference){
  .bar{view-transition-name:bar}
  .tabs{view-transition-name:tabs}

  html[data-nav="push"]::view-transition-old(root){animation:.2s ease both vt-out-l}
  html[data-nav="push"]::view-transition-new(root){animation:.24s ease both vt-in-r}

  html[data-nav="tab"]::view-transition-new(root){animation:.16s ease both vt-fade-in}
  .opt,.ch,.seg button{transition:background-color .15s,border-color .15s}
}
@keyframes vt-in-r{from{transform:translateX(28%);opacity:0}}
@keyframes vt-out-l{to{transform:translateX(-10%);opacity:0}}

  voir: ["ciri", "triss", "pavetta"] },

{ id: "epreuve", t: "concept", src: "LJ", nom: "L'Épreuve des Herbes", alias: ["mutations"],
  role: "Rite de mutation",
  resume: "Le rite qui transforme les apprentis en sorceleurs, à grand renfort d'herbes et de décoctions. La plupart des enfants n'y survivent pas.",
  livres: "Geralt l'a si bien supportée qu'il a subi des mutations supplémentaires, d'où ses cheveux blancs. Ciri, elle, n'y est pas soumise à Kaer Morhen.",
  dans: ["dernier-voeu", "sang-elfes"],
  voir: ["sorceleurs", "geralt", "kaer-morhen"] },

{ id: "signes", t: "concept", src: "LJ", nom: "Les Signes", alias: ["Aard", "Igni", "Yrden", "Quen", "Axii", "Héliotrope"],
  role: "Magie des sorceleurs",
  resume: "Des sorts simples tracés d'un geste de la main : Aard projette une onde de choc, Igni du feu, Yrden pose un piège magique, Quen un bouclier, et Axii agit sur l'esprit.",
  livres: "Dans les livres, Geralt en use avec parcimonie et en connaît d'autres, comme l'Héliotrope, qui détourne un sort.",
  jeu: [{ c: 0, t: "Dans TW3, chaque signe possède une forme alternative et se renforce dans l'arbre de compétences." }],
  voir: ["sorceleurs", "medaillon"] },

{ id: "medaillon", t: "concept", src: "LJ", nom: "Le médaillon", alias: [],
  role: "Insigne des sorceleurs",
  resume: "Chaque sorceleur porte un médaillon à l'effigie de son école, qui vibre en présence de magie.",
  livres: "Celui de Geralt représente une tête de loup.",
  voir: ["sorceleurs", "bonhart"] },

{ id: "dimeritium", t: "concept", src: "LJ", nom: "Le dimeritium", alias: [],
  role: "Métal anti-magie",
  resume: "Un métal rare qui bloque la magie : on en fait des menottes pour neutraliser les magiciens.",
  livres: "Il joue un rôle clé lors du conclave de Thanedd.",
  jeu: [{ c: 0, t: "Dans TW3, la bombe de dimeritium affaiblit les créatures magiques et empêche certains ennemis de lancer des sorts." }],
  dans: ["temps-mepris"],
  voir: ["thanedd", "conseil"] },

{ id: "langue-ancienne", t: "concept", src: "LJ", nom: "La Langue ancienne", alias: ["Hen Llinge", "elfique"],
  role: "Langue des elfes",
  resume: "La langue des elfes, qui a laissé de nombreux noms au monde des humains.",
  livres: "Quelques mots à retenir : Gwynbleidd, « Loup Blanc » (Geralt) ; Zireael, « hirondelle » (Ciri) ; Dh'oine, « humains » ; Aen Seidhe et Aen Elle, les deux peuples elfes ; Hen Ichaer, le Sang Ancien ; Tedd Deireadh, le temps de la fin ; Va fail, « adieu ».",
  voir: ["aen-elle", "sang-ancien", "non-humains"] },

{ id: "potions", t: "concept", src: "LJ", nom: "Les potions", alias: ["Hirondelle", "Chat", "Mouette blanche", "alchimie"],
  role: "Alchimie des sorceleurs",
  resume: "Des élixirs toxiques pour le commun des mortels, que seuls les sorceleurs supportent.",
  livres: "Les livres citent notamment l'Hirondelle, qui accélère la guérison, le Chat, pour voir dans le noir, et la Mouette blanche, qui revient souvent dans la bouche des sorceleurs.",
  jeu: [{ c: 0, t: "Dans TW3, la toxicité limite le nombre de potions actives, et les décoctions de mutagènes offrent des bonus de longue durée." }],
  voir: ["sorceleurs", "epreuve"] },

/* ---------- Livres ---------- */
{ id: "dernier-voeu", t: "livre", src: "L", nom: "Le Dernier Vœu", alias: ["Ostatnie życzenie", "The Last Wish"], ordre: 1,
  genre: "Recueil de nouvelles", vo: "Ostatnie życzenie", annee: 1993, role: "Recueil de nouvelles, 1993",
  resume: "Le point d'entrée idéal. En convalescence au temple de Melitele, Geralt se remémore quelques contrats marquants : la stryge de Vizima, le drame de Blaviken, le banquet de Cintra et sa rencontre avec Yennefer.",
  nouvelles: [
    { t: "Le Sorceleur", d: "Le roi Foltest promet une fortune à qui délivrera sa fille, changée en stryge." },
    { t: "Un grain de vérité", d: "Un homme métamorphosé en bête vit reclus dans un manoir : une variation sombre de La Belle et la Bête." },
    { t: "Le Moindre Mal", d: "À Blaviken, Geralt se retrouve pris entre le mage Stregobor et Renfri, une princesse déchue qui veut sa peau : l'origine de son sinistre surnom." },
    { t: "Une question de prix", d: "Au banquet de Cintra, un mystérieux chevalier réclame la main de la princesse Pavetta." },
    { t: "Le Bout du monde", d: "Avec Jaskier, Geralt croise un sylvain farceur et des elfes acculés à la survie." },
    { t: "Le Dernier Vœu", d: "Un djinn, une magicienne nommée Yennefer, et un vœu qui change tout." },
    { t: "La Voix de la raison", d: "Le récit-cadre, au temple de Melitele, qui relie les nouvelles entre elles." }],
  rl: "dernier-voeu",
  rev: "Le « paiement » que Geralt réclame à Cintra n'est autre que Ciri, encore à naître. Et son dernier vœu lie à jamais son destin à celui de Yennefer.",
  jeu: [
    { c: 0, t: "Foltest et la Temeria, la cour de Cintra, la naissance du destin de Ciri : bien des fils de TW3 partent de ce recueil." },
    { c: 3, t: "Le druide Mousesack, présent au banquet de Cintra, n'est autre que l'Ermion de Skellige." }],
  voir: ["geralt", "yennefer", "calanthe", "duny", "loi-surprise", "renfri", "nivellen", "blaviken"] },

{ id: "epee-providence", t: "livre", src: "L", nom: "L'Épée de la providence", alias: ["Miecz przeznaczenia", "Sword of Destiny"], ordre: 2,
  genre: "Recueil de nouvelles", vo: "Miecz przeznaczenia", annee: 1992, role: "Recueil de nouvelles, 1992",
  resume: "Six nouvelles qui creusent la relation tumultueuse de Geralt et Yennefer, et lui font enfin croiser la route de Ciri.",
  nouvelles: [
    { t: "Les Limites du possible", d: "Une chasse au dragon où chevaliers, mercenaires et magiciens se disputent la bête." },
    { t: "Éclat de glace", d: "Un triangle amoureux entre Geralt, Yennefer et le mage Istredd." },
    { t: "Le Feu éternel", d: "À Novigrad, Jaskier et Geralt démêlent l'imbroglio d'un marchand halfelin… et de son double." },
    { t: "Une once d'abnégation", d: "Une sirène, un duc amoureux et la barde Essi Daven." },
    { t: "L'Épée de la providence", d: "Dans la forêt des dryades, Geralt rencontre une petite fille têtue : Ciri." },
    { t: "Quelque chose en plus", d: "Blessé et fiévreux, Geralt affronte ses souvenirs pendant que Cintra tombe." }],
  rl: "epee-providence",
  rev: "« Quelque chose en plus » se clôt sur les retrouvailles de Geralt et de Ciri après la chute de Cintra : le destin a fini par les réunir.",
  jeu: [{ c: 2, t: "« Le Feu éternel » présente le doppler Dudu, que l'on retrouve à Novigrad." }],
  voir: ["ciri", "yennefer", "dudu", "brokilon", "borch", "istredd", "essi", "eithne"] },

{ id: "sang-elfes", t: "livre", src: "L", nom: "Le Sang des elfes", alias: ["Krew elfów", "Blood of Elves"], ordre: 3,
  genre: "Roman, saga tome 1", vo: "Krew elfów", annee: 1994, role: "Roman, 1994, premier tome de la saga",
  resume: "La guerre gronde entre le Nord et Nilfgaard. Geralt cache Ciri à Kaer Morhen, où les sorceleurs l'entraînent, avant de la confier aux magiciennes. Des agents mystérieux la traquent, et les rois complotent.",
  rl: "sang-elfes",
  rev: "On découvre que Ciri est une Source au potentiel immense. Yennefer devient sa mentore, Triss sa grande sœur, et l'espion Rience laisse entrevoir une conspiration bien plus vaste.",
  jeu: [{ c: 0, t: "L'hiver de Ciri à Kaer Morhen résonne avec le rêve qui ouvre TW3." }],
  voir: ["ciri", "kaer-morhen", "triss", "yennefer", "rience"] },

{ id: "temps-mepris", t: "livre", src: "L", nom: "Le Temps du mépris", alias: ["Czas pogardy", "Time of Contempt"], ordre: 4,
  genre: "Roman, saga tome 2", vo: "Czas pogardy", annee: 1995, role: "Roman, 1995, deuxième tome de la saga",
  resume: "Les magiciens se réunissent sur l'île de Thanedd, tandis que Nilfgaard prépare une nouvelle offensive. Ciri, sous l'aile de Yennefer, doit entrer à l'école d'Aretuza.",
  rl: "temps-mepris",
  rev: "Le conclave tourne au coup d'État : Vilgefortz trahit, Geralt est grièvement blessé et Ciri, à travers un portail instable, est projetée dans un désert. La guerre reprend, et la Ciri qui en ressort n'est plus une enfant protégée.",
  jeu: [{ c: 0, t: "Le coup de Thanedd ouvre une longue crise de confiance entre rois et magiciens, dont TW3 montre les conséquences." }],
  voir: ["thanedd", "vilgefortz", "ciri", "conseil"] },

{ id: "bapteme-feu", t: "livre", src: "L", nom: "Le Baptême du feu", alias: ["Chrzest ognia", "Baptism of Fire"], ordre: 5,
  genre: "Roman, saga tome 3", vo: "Chrzest ognia", annee: 1996, role: "Roman, 1996, troisième tome de la saga",
  resume: "Convalescent à Brokilon, Geralt part chercher Ciri à travers un pays en guerre, entouré d'une improbable compagnie : Jaskier, l'archère Milva, une troupe de nains, un barbier très singulier et un chevalier nilfgaardien.",
  rl: "bapteme-feu",
  rev: "Les magiciennes fondent la Loge, Geralt gagne au combat son titre « de Riv », et la compagnie découvre que Regis est un vampire supérieur.",
  jeu: [
    { c: 2, t: "Zoltan y fait ses débuts ; on le retrouve à Novigrad." },
    { d: "bw", c: 1, t: "Regis, le barbier-chirurgien, refait surface dans Blood and Wine." }],
  voir: ["milva", "zoltan", "regis", "cahir", "loge", "meve"] },

{ id: "tour-hirondelle", t: "livre", src: "L", nom: "La Tour de l'Hirondelle", alias: ["Wieża Jaskółki", "The Tower of the Swallow"], ordre: 6,
  genre: "Roman, saga tome 4", vo: "Wieża Jaskółki", annee: 1997, role: "Roman, 1997, quatrième tome de la saga",
  resume: "Blessée, Ciri est recueillie par un vieil ermite à qui elle raconte ce qu'elle a vécu depuis Thanedd. Pendant ce temps, Geralt et sa compagnie poursuivent leur route, et des chasseurs de primes resserrent l'étau.",
  rl: "tour-hirondelle",
  rev: "Ciri survit au massacre des Rats et à Bonhart, puis gagne la tour elfique de Tor Zireael, qui l'emporte hors de son monde. Yennefer, elle, tombe dans le piège de Vilgefortz.",
  jeu: [{ c: 0, t: "Le parcours de Ciri, seule face au monde, éclaire la jeune femme endurcie que l'on rencontre dans TW3." }],
  voir: ["ciri", "bonhart", "tor-zireael", "angouleme", "vysogota", "rats"] },

{ id: "dame-lac", t: "livre", src: "L", nom: "La Dame du Lac", alias: ["Pani Jeziora", "The Lady of the Lake"], ordre: 7,
  genre: "Roman, saga tome 5", vo: "Pani Jeziora", annee: 1999, role: "Roman, 1999, dernier tome de la saga",
  resume: "Ciri découvre le monde des Aen Elle, la compagnie passe l'hiver en Toussaint, la guerre s'achève à Brenna, et toutes les routes convergent vers le repaire de Vilgefortz.",
  rl: "dame-lac",
  rev: "À Stygga, une grande partie de la compagnie tombe ; Geralt tue Vilgefortz, Ciri tue Bonhart, et Emhyr se révèle être le père de Ciri. La paix de Cintra est signée. À Riv, Geralt est mortellement blessé lors d'un pogrom, et Ciri l'emmène avec Yennefer vers une île brumeuse.",
  jeu: [
    { c: 0, t: "Essentiel pour TW3 : Avallac'h, Eredin, les Aen Elle et la Chasse sauvage y prennent toute leur dimension." },
    { d: "bw", c: 1, t: "L'hiver en Toussaint et la duchesse Anna Henrietta préparent le terrain de Blood and Wine." }],
  voir: ["aen-elle", "avallach", "eredin", "toussaint", "stygga", "brenna", "nimue"] },

{ id: "saison-orages", t: "livre", src: "L", nom: "La Saison des orages", alias: ["Sezon burz", "Season of Storms"], ordre: 8,
  genre: "Roman indépendant", vo: "Sezon burz", annee: 2013, role: "Roman indépendant, 2013",
  resume: "Une aventure à part, située à l'époque des nouvelles. À Kerack, Geralt se fait voler ses épées et doit les récupérer, entre une magicienne séduisante, Lytta Neyd, dite Corail, et des mages aux expériences douteuses.",
  
  jeu: [{ c: 0, t: "Sans lien direct avec TW3 : une aventure à savourer pour elle-même." }],
  voir: ["geralt", "jaskier", "kerack", "nimue"] },

{ id: "croisee", t: "livre", src: "L", nom: "La Croisée des corbeaux", alias: ["Rozdroże kruków", "Crossroads of Ravens"], ordre: 9,
  genre: "Roman, préquelle", vo: "Rozdroże kruków", annee: 2024, role: "Roman, 2024 (en français chez Bragelonne en 2025)",
  resume: "Geralt a dix-huit ans et vient de quitter Kaer Morhen. Un acte de bravoure naïf tourne mal, et il n'échappe à la corde que grâce à Preston Holt, un sorceleur expérimenté au passé trouble.",
  jeu: [{ c: 0, t: "Antérieur à toute la saga, sans lien direct avec TW3." }],
  voir: ["geralt", "kaer-morhen", "sorceleurs"] },

{ id: "visenna", t: "perso", src: "L", nom: "Visenna", alias: [],
  role: "Magicienne guérisseuse, mère de Geralt",
  resume: "Une guérisseuse itinérante, douée pour la magie, qui confia son fils encore tout petit aux sorceleurs de Kaer Morhen.",
  livres: "Geralt ne l'a pratiquement pas connue et n'en parle presque jamais. Dans « Quelque chose en plus », blessé et fiévreux, il est soigné par une guérisseuse : à demi conscient, il comprend que c'est elle, mais elle refuse qu'il la regarde. La blessure de l'abandon refait surface.",

{ id: "renfri", t: "perso", src: "L", nom: "Renfri", alias: [],
  role: "Princesse déchue, cheffe de bande",

  rl: "dernier-voeu",
  rev: "Geralt finit par tuer Renfri et ses hommes sur la place du marché. La foule horrifiée le surnomme le Boucher de Blaviken, une réputation qui le suivra toute sa vie.",

  voir: ["blaviken", "geralt"] },

{ id: "istredd", t: "perso", src: "L", nom: "Istredd", alias: [],

  resume: "Mage érudit, passionné par les vestiges des civilisations disparues, et ancien amant de Yennefer.",

  voir: ["yennefer", "geralt"] },

{ id: "borch", t: "perso", src: "L", nom: "Borch Trois-Choucas", alias: [],

  resume: "Un noble affable et généreux, escorté de deux guerrières zerrikaniennes, qui se joint à la chasse au dragon des « Limites du possible ».",

  rev: "Borch est Villentretenmerth, un dragon d'or capable de prendre forme humaine, la plus rare des créatures. Il est venu défendre la dragonne traquée et son petit.",

{ id: "essi", t: "perso", src: "L", nom: "Essi Daven", alias: [],
  role: "Barde, amie de Jaskier",

  rev: "La nouvelle se clôt sur une note grave : Essi mourra jeune, quelques années plus tard, emportée par une épidémie.",

{ id: "nivellen", t: "perso", src: "L", nom: "Nivellen", alias: [],
  role: "Homme maudit à tête de bête",
  resume: "Un ancien chef de bande changé en bête par la malédiction d'une prêtresse, qui vit reclus dans son manoir.",
  livres: "Dans « Un grain de vérité », Geralt découvre un hôte affable sous une apparence monstrueuse. Des marchands lui ont confié leurs filles en échange de sa fortune ; la dernière venue, Vereena, semble l'aimer sincèrement.",
  rl: "dernier-voeu",
  rev: "Vereena est une bruxa, responsable des meurtres qui ensanglantent la région. Geralt la tue ; parce qu'elle l'aimait vraiment, Nivellen retrouve aussitôt forme humaine.",

  voir: ["m-bruxa", "geralt"] },

{ id: "eithne", t: "perso", src: "L", nom: "Eithné", alias: [],

  role: "Ermite et ancien savant",
  resume: "Vieil érudit retiré dans les marais, qui recueille Ciri grièvement blessée.",
  livres: "« La Tour de l'Hirondelle » est construit autour de leurs conversations : Ciri lui raconte tout ce qu'elle a vécu depuis Thanedd.",

{ id: "meve", t: "perso", src: "LJ", nom: "Meve", alias: [],

{ id: "ihuarraquax", t: "perso", src: "L", nom: "Ihuarraquax", alias: [],

/* ---------- Quiz : questions tirées du codex, reproductibles à partir d'une graine ---------- */
function rng(seed){let a=2166136261;for(const c of String(seed))a=Math.imul(a^c.charCodeAt(0),16777619);
 return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const shuf=(a,r)=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const words=s=>norm(s).split(/[^a-z0-9]+/).filter(w=>w.length>3);
const overlap=(a,b)=>{const A=words(a),B=words(b),na=norm(a),nb=norm(b);return A.some(w=>B.includes(w))||na.includes(nb)||nb.includes(na)};
const LEX=C.lexique.filter(w=>w.mot.length<20);

function questions(k,r){
 const V=E.filter(e=>visIn(e,k)),out=[],pick=a=>a[Math.floor(r()*a.length)];
 const mk=(type,subject,q,good,bad,why,lien)=>{bad=[...new Set(bad)].filter(b=>b!==good);if(bad.length<3)return;
  const o=shuf([good,...shuf(bad,r).slice(0,3)],r);out.push({type,subject,q,opts:o,ok:o.indexOf(good),why,lien})};
 const P=V.filter(e=>e.t==="perso"),L=V.filter(e=>e.t==="lieu");
 for(const e of P){const al=(e.alias||[]).filter(a=>!overlap(a,e.nom));
  if(al.length)mk("alias",e.id,`Qui se cache derrière le nom « ${pick(al)} » ?`,e.nom,P.filter(x=>x!==e).map(x=>x.nom),`${e.nom} : ${e.role}.`,e.id)}
 for(const e of L)mk("lieu",e.id,`Quel lieu correspond à cette description : « ${e.role} » ?`,e.nom,L.filter(x=>x!==e).map(x=>x.nom),e.resume,e.id);
 for(const e of V)if(e.t!=="livre"&&e.dans&&e.dans.length)
  mk("dans",e.id,`Dans lequel de ces livres croise-t-on ${e.nom} ?`,ID[pick(e.dans)].nom,BOOKS.filter(b=>!e.dans.includes(b.id)).map(b=>b.nom),`${e.nom} apparaît dans : ${e.dans.map(i=>ID[i].nom).join(", ")}.`,e.id);
 for(const b of BOOKS)mk("annee",b.id,`En quelle année « ${b.nom} » est-il paru en Pologne ?`,String(b.annee),BOOKS.map(x=>String(x.annee)),`« ${b.vo} », ${b.annee}. ${b.resume}`,b.id);
 const MV=M.filter(m=>visIn(m,k));
 for(const m of MV)if(m.signes&&m.signes.length<=2)
  mk("signe",m.id,`Quel signe le bestiaire de TW3 conseille-t-il contre : ${m.nom} ?`,pick(m.signes),SIGNES.filter(s=>!m.signes.includes(s)),m.conseil,m.id);
 const CL=Object.keys(C.classes).filter(c=>c!=="Humains"&&c!=="Bêtes");
 for(const m of MV)if(CL.includes(m.cl))mk("classe",m.id,`À quelle famille du bestiaire appartient : ${m.nom} ?`,m.cl,CL,`${m.nom} : ${m.cl}. ${oil(m.cl)}.`,m.id);
 for(const w of LEX)mk("mot",w.mot,`Que signifie « ${w.mot} » en langue ancienne ?`,w.sens,LEX.map(x=>x.sens),w.note,w.lien);
 for(const s of SRCS.filter(s=>s.groupe==="contes"))mk("conte",s.id,`Quel conte Sapkowski détourne-t-il dans « ${s.oeuvre} » ?`,s.conte,SRCS.filter(x=>x.groupe==="contes").map(x=>x.conte),s.texte,s.liens[0]);
 return out}

function makeQuiz(seed,k,n){
 const r=rng(seed),by={};
 for(const q of questions(k,r))(by[q.type]=by[q.type]||[]).push(q);
 const types=shuf(Object.keys(by),r);types.forEach(t=>by[t]=shuf(by[t],r));
 const out=[],used=new Set();
 for(let added=true;out.length<n&&added;){added=false;
  for(const t of types){if(out.length>=n)break;const i=by[t].findIndex(q=>!used.has(q.subject));
   if(i>=0){const q=by[t].splice(i,1)[0];used.add(q.subject);out.push(q);added=true}}}
 return shuf(out,r)}

const newSeed=()=>Math.random().toString(36).slice(2,7).replace(/[^a-z0-9]/g,"x").padEnd(5,"x");
const score=z=>z.ans.filter((a,i)=>a===z.qs[i].ok).length;
function rang(s,n){const p=s/n;
 if(p===1)return{t:"Digne de Vesemir",d:"Un sans-faute. Même les vieux loups de Kaer Morhen sont impressionnés."};
 if(p>=.8)return{t:"Maître sorceleur",d:"Vous connaissez le Continent comme votre poche."};
 if(p>=.5)return{t:"Sorceleur sur la route",d:"De bonnes bases, et encore quelques contrats à honorer."};
 if(p>=.2)return{t:"Apprenti de Kaer Morhen",d:"L'Épreuve des Herbes vous attend : quelques fiches du codex et ça ira mieux."};
 return{t:"Barde égaré",d:"Même Jaskier aurait fait mieux, et il en aurait tiré une ballade."}}

function opts(q,a,act){return `<div class="opts">`+q.opts.map((o,i)=>{let c="opt";if(a!=null){if(i===q.ok)c+=" good";else if(i===a)c+=" bad"}
 return `<button class="${c}" data-${act}="${i}"${a!=null?" disabled":""}>${esc(o)}</button>`}).join("")+`</div>`}
function feedback(q,a){const ok=a===q.ok;
 return `<p class="fb ${ok?"ok":"ko"}" role="status">${ok?"Bonne réponse.":"Raté. La bonne réponse : "+esc(q.opts[q.ok])+"."}</p><p>${esc(q.why)}</p>${q.lien?chips([q.lien]):""}`}

function stepper(){
 let h=`<div class="stepper" id="route" role="group" aria-label="Où en êtes-vous dans le jeu ?">`+C.chapitres.map((c,i)=>`<button class="st${i<S.ch?" done":""}${i===S.ch?" on":""}" data-i="${i}" aria-pressed="${i===S.ch}"><i></i>${esc(c.court)}</button>`).join("")+`</div>`;
 if(S.pend!=null)h+=`<div class="pend"><p>Passer à l'étape « ${esc(C.chapitres[S.pend].nom)} » ? Les fiches de cette étape deviendront visibles.</p><div class="row"><button class="pr" data-act="pend-ok">Oui, j'y suis</button><button class="ch" data-act="pend-no">Annuler</button></div></div>`;
 return h}

function partie(){
 const c=C.chapitres[S.ch];let h=stepper();
 h+=`<p class="eb">Étape ${S.ch+1} sur ${C.chapitres.length}</p><h2>${esc(c.nom)}</h2><p class="mu">${esc(c.lieux)}</p><p>${esc(c.intro)}</p>${TTS?`<div class="chips">${lireBtn("chapitre","Écouter ce chapitre")}</div>`:""}`;
 h+=`<div class="bl"><h3>À lire dans les livres</h3><p>${esc(c.lire)}</p>${chips(c.lireIds)}</div>`;
 const ls=ents(c.entrees);if(ls.length)h+=`<h3>Autour de vous</h3>`+ls.map(row).join("");
 const ms=(c.monstres||[]).map(i=>MID[i]).filter(m=>m&&vis(m));if(ms.length)h+=`<h3>Monstres du coin</h3>`+ms.map(mrow).join("");
 for(const k of["hos","bw"])if(S[k]){const d=C.dlc[k];
  h+=`<h3>${d.nom}</h3><p>${esc(d.intro)}</p><div class="bl"><p>${esc(d.lire)}</p></div>`+ents(d.entrees).map(row).join("")+(d.monstres||[]).map(i=>MID[i]).filter(m=>m&&vis(m)).map(mrow).join("")}
 h+=eclair();
 h+=`<div class="tiles"><button class="tile" data-o="quiz">${ICO.quiz}<b>Quiz</b><small>Dix questions selon votre avancée</small></button><button class="tile" data-act="defi">${ICO.invite}<b>Défier un ami</b><small>Les mêmes questions, sans spoiler</small></button></div>`;
 const nx=BOOKS.find(b=>!S.lus[b.id]);
 h+=nx?`<div class="card"><p class="eb">Votre prochaine lecture</p><h3 class="ct">${esc(nx.nom)}</h3><p class="mu sm">${esc(nx.role)}</p><p>${esc(nx.resume)}</p><div class="chips"><button class="ch" data-lu="${nx.id}">Je l'ai lu</button><button class="ch" data-o="${nx.id}">Voir la fiche</button></div></div>`
  :`<div class="card"><p class="eb">Bibliothèque</p><p>Vous avez lu toute la saga. Il ne reste plus qu'à la relire.</p></div>`;
 const an=C.anecdotes.filter(a=>(!a.c||a.c<=S.ch)&&(!any(a.lien)||vis(any(a.lien))));
 if(an.length){const a=an[S.an%an.length];h+=`<h3>Le saviez-vous</h3><p>${esc(a.t)}</p><div class="chips"><button class="ch" data-an>Une autre anecdote</button>${chip(a.lien)}</div>`}
 if(canAsk())h+=`<div class="card"><p class="eb">Une question ?</p><p>Demandez ${SM?"à Claude":"à l'IA de votre téléphone"} ce que les livres racontent, sans spoiler sur la suite de votre partie.</p><button class="pr" data-o="demander">${ICO.demander}Demander</button></div>`;
 const ib=installCard();if(ib)h+=ib;
 h+=`<div class="card"><p class="eb">Entre amis</p><p>Envoyez le compagnon à un ami : il règle sa propre avancée, et rien ne lui est dévoilé.</p><button class="pr" data-share="">${ICO.share}Inviter un ami</button></div>`;
 return h}

function eclair(){
 const key=dayKey()+"-"+S.ch+(S.hos?"h":"")+(S.bw?"b":"");
 if(!S.eclair||S.eclair.key!==key)S.eclair={key,q:makeQuiz("jour-"+key,now(),1)[0],a:null};
 const{q,a}=S.eclair;if(!q)return"";
 const n=S.serie&&(S.serie.jour===dayKey()||S.serie.jour===dayKey(new Date(Date.now()-864e5)))?S.serie.n:0;
 return `<div class="card hi"><p class="eb">Question du jour${n>1?" · série de "+n+" jours":""}</p><p class="qq">${esc(q.q)}</p>${opts(q,a,"ej")}${a!=null?feedback(q,a):""}</div>`}

function codex(){
 const T=[["all","Tout"],["perso","Personnages"],["lieu","Lieux"],["faction","Peuples et factions"],["concept","Notions"],["livre","Livres"],["mot","Langue ancienne"],["fav","Carnet"]];
 const fav=Object.keys(S.fav).filter(i=>any(i)&&vis(any(i)));
 let h=`<button class="fake" data-act="search">${ICO.search}Chercher un nom, un surnom, une créature…</button>`;
 h+=`<div class="tiles"><button class="tile" data-o="lignee">${ICO.tree}<b>Lignée de Ciri</b><small>De Lara Dorren à Ciri</small></button><button class="tile" data-t="mot">${ICO.lang}<b>Langue ancienne</b><small>${C.lexique.length} mots elfes</small></button></div>`;
 const rec=S.hist.filter(i=>any(i)&&vis(any(i))).slice(0,6);
 if(rec.length&&S.ty==="all")h+=`<h3>Consultés récemment</h3>${chips(rec)}`;
 h+=`<div class="fl">${T.map(([k,n])=>`<button class="ch${S.ty===k?" on":""}" data-t="${k}">${n}${k==="fav"&&fav.length?" ("+fav.length+")":""}</button>`).join("")}</div><p class="mu sm">Trait bleu : issu des livres. Trait ambre : issu du jeu. Les deux : présent dans les deux.</p>`;
 if(S.ty==="mot")return h+lex("");
 if(S.ty==="fav")return h+(fav.length?fav.map(i=>anyRow(any(i))).join(""):`<p class="mu">Votre carnet est vide. Touchez l'étoile d'une fiche pour l'y ranger.</p>`);
 const l=E.filter(e=>vis(e)&&(S.ty==="all"||e.t===S.ty));
 l.sort((a,b)=>S.ty==="livre"?a.ordre-b.ordre:a.nom.localeCompare(b.nom,"fr"));
 if(S.ty!=="all")return h+l.map(row).join("");
 for(const[t,n]of[["perso","Personnages"],["lieu","Lieux"],["faction","Peuples et factions"],["concept","Notions"],["livre","Livres"]]){
  const g=l.filter(e=>e.t===t);if(t==="livre")g.sort((a,b)=>a.ordre-b.ordre);if(g.length)h+=`<h3 class="gh">${n}<span>${g.length}</span></h3>`+g.map(row).join("")}
 return h}

function lex(q){return C.lexique.filter(w=>!q||norm(w.mot+" "+w.sens+" "+w.note).includes(q)).map(w=>
 `<div class="lx"><p><b>${esc(w.mot)}</b> ${esc(w.sens)}</p><p class="mu sm">${esc(w.note)}</p>${w.lien?chips([w.lien]):""}</div>`).join("")}

function recherche(){return `<div class="srch"><input id="q" type="search" enterkeyhint="search" placeholder="Nom, surnom, lieu, créature, mot elfe…" aria-label="Rechercher" value="${esc(S.q)}" autocomplete="off" autocapitalize="off" spellcheck="false">${micBtn("q")}</div>${SR&&!inFrame&&!S.q?`<p class="mu sm">Touchez le micro et dites un nom : pratique quand vous avez la manette en main.</p>`:""}<div id="lst">${resultats()}</div>`}
/* Recherche par mots-clés : les mots outils sont ignorés, chaque fiche est classée par pertinence. */
const STOP=new Set("qui que quoi est sont les des une dans pour avec sur par quel quelle quels quelles comment pourquoi ou son ses leur du de la le un et en au aux ce cet cette il elle on veut dire parle moi raconte".split(" "));
const termes=q=>norm(q).split(/[^a-z0-9']+/).map(w=>w.replace(/^[a-z]'/,"").replace(/'$/,"")).filter(w=>w.length>1&&!STOP.has(w));
function cherche(list,nom,hay,q){
 const t=termes(q);if(!t.length)return[];
 const sc=list.map(x=>{const n=norm(nom(x)),h=norm(hay(x)),k=t.filter(w=>h.includes(w)).length;
  return{x,k,s:k*10+(t.every(w=>n.includes(w))?6:0)+(n.startsWith(t[0])?4:0)}}).filter(r=>r.k>0);
 const tous=sc.filter(r=>r.k===t.length);
 return(tous.length?tous:sc).sort((a,b)=>b.s-a.s||nom(a.x).localeCompare(nom(b.x),"fr")).map(r=>r.x)}
function resultats(){
 const q=S.q.trim();
 if(!termes(q).length){const rec=S.hist.filter(i=>any(i)&&vis(any(i))).slice(0,8);
  return (rec.length?`<h3>Consultés récemment</h3>`+rec.map(i=>anyRow(any(i))).join(""):"")+`<h3>Suggestions</h3>${chips(["ciri","yennefer","chasse","loi-surprise","kaer-morhen","m-griffon","sang-ancien","jaskier"])}`}
 const l=cherche(E.filter(vis),e=>e.nom,e=>[e.nom,...(e.alias||[]),e.role,e.resume].join(" "),q);
 const ms=cherche(M.filter(vis),m=>m.nom,m=>[m.nom,m.en||"",m.cl].join(" "),q);
 const lw=cherche(C.lexique,w=>w.mot,w=>w.mot+" "+w.sens+" "+w.note,q);
 const sr=cherche(SRCS.filter(srcVis),s=>s.conte,s=>s.conte+" "+s.oeuvre+" "+s.artiste,q);
 let h=l.map(row).join("");
 if(ms.length)h+=`<h3 class="gh">Bestiaire</h3>`+ms.map(mrow).join("");
 if(lw.length)h+=`<h3 class="gh">Langue ancienne</h3>`+lw.map(w=>`<div class="lx"><p><b>${esc(w.mot)}</b> ${esc(w.sens)}</p><p class="mu sm">${esc(w.note)}</p>${w.lien?chips([w.lien]):""}</div>`).join("");
 if(sr.length)h+=`<h3 class="gh">Aux sources</h3>`+sr.map(s=>`<button class="ro LJ" data-o="contes"><b>${esc(s.conte)}</b><small>${esc(s.oeuvre)} · ${esc(s.artiste)}</small></button>`).join("");
 return h||`<p class="mu">Rien ne correspond. Essayez un autre nom ou un surnom.</p>`}

function bestiaire(){
 const f=[["all","Tous"],...Object.keys(C.classes).map(c=>[c,c])].map(([k,n])=>`<button class="ch${S.cl===k?" on":""}" data-c="${k}">${n}</button>`).join("");
 return `<p class="mu">Ce que le jeu recommande, et ce que les livres en disent.</p><div class="srch"><input id="bq" type="search" enterkeyhint="search" placeholder="Chercher une créature, en français ou en anglais" aria-label="Chercher une créature" value="${esc(S.bq)}" autocomplete="off">${micBtn("bq")}</div><div class="fl">${f}</div><div id="blst">${blst()}</div>`}
function blst(){const q=norm(S.bq.trim());
 const base=M.filter(m=>vis(m)&&(S.cl==="all"||m.cl===S.cl));
 const l=termes(q).length?cherche(base,m=>m.nom,m=>[m.nom,m.en||"",m.cl].join(" "),q):base;
 return l.map(mrow).join("")||`<p class="mu">Aucune créature ne correspond.</p>`}

 return `<div class="gate"><p class="eb">Attention, spoiler</p><h2>Fiche verrouillée</h2><p>Cette fiche concerne ${x.porte.d?"l'extension "+esc(n):"un passage du jeu situé à l'étape « "+esc(n)+" »"}, plus loin que là où vous en êtes. Un ami vous l'a peut-être envoyée.</p><div class="row"><button class="pr" data-force="${x.id}">Afficher quand même</button><button class="ch" data-b>Non merci</button></div></div>`}
function actions(x){
 const f=!!S.fav[x.id];
 let h=`<div class="acts">${lireBtn(x.id)}<button class="ch${f?" on":""}" data-fav="${x.id}" aria-pressed="${f}">${f?ICO.starOn:ICO.star}${f?"Dans le carnet":"Carnet"}</button><button class="ch" data-share="${x.id}">${ICO.share}Partager</button>`;
 if(C.carte.lieux[x.id])h+=`<button class="ch" data-map="${x.id}">${ICO.pin}Sur la carte</button>`;
 if(LIGNEE.includes(x.id))h+=`<button class="ch" data-o="lignee">${ICO.tree}Lignée</button>`;
 if(canAsk())h+=`<button class="ch" data-askabout="${esc(x.nom)}">${ICO.demander}Demander</button>`;
 return h+`</div>`}
function fiche(e){
 if(!vis(e)&&!S.force[e.id])return gate(e);
 const vj=(e.jeu||[]).filter(jv),sealed=(e.jeu||[]).length-vj.length;
 let h=`<p class="eb">${TYPES[e.t]} · <span class="src ${e.src}">${SRC[e.src]}</span></p><h2>${esc(e.nom)}</h2>`;
 if(e.alias&&e.alias.length)h+=`<p class="mu">Aussi appelé : ${esc(e.alias.join(", "))}</p>`;
 h+=`<p class="mu">${esc(e.role)}</p>`+actions(e)+`<p class="lead">${esc(e.resume)}</p>`;
 if(e.t==="livre")h+=kv("Titre original",esc(e.vo)+", "+e.annee)+kv("Genre",esc(e.genre))+`<p><button class="ch${S.lus[e.id]?" on":""}" data-lu="${e.id}" aria-pressed="${!!S.lus[e.id]}">${S.lus[e.id]?"Lu ✓":"Marquer comme lu"}</button></p>`;
 if(e.nouvelles)h+=`<h3>Les nouvelles</h3>`+e.nouvelles.map(n=>`<p><b>${esc(n.t)}.</b> ${esc(n.d)}</p>`).join("");
 if(e.livres)h+=bl("Dans les livres",e.livres);
 if(e.rev)h+=revOK(e)?bl("La suite dans les livres",e.rev,false,!S.sp&&!S.rv[e.id]&&e.rl?"Affiché car vous avez lu "+esc(livre(e.rl))+".":""):revBtn(e,e.id);
 if(vj.length||sealed)h+=`<div class="bl j"><h3>Dans le jeu</h3>${vj.map(l=>`<p>${esc(l.t)}</p>`).join("")}${sealed?`<p class="mu">${pl(sealed,"note")} masquée${sealed>1?"s":""} pour ne pas vous dévoiler la suite du jeu.</p>`:""}</div>`;
 h+=srcBlock(e.id);
 const dn=chips(e.dans||[]),vo=chips(e.voir||[]);
 if(dn)h+=`<h3>À lire pour le retrouver</h3>${dn}`;
 if(vo)h+=`<h3>Voir aussi</h3>${vo}`;
 return h}

function monstre(m){
 if(!vis(m)&&!S.force[m.id])return gate(m);

function carteSVG(){
 const cur=new Set([...C.chapitres[S.ch].entrees,...(S.hos?C.dlc.hos.entrees:[]),...(S.bw?C.dlc.bw.entrees:[])]),k=mv.w/MW;
 const pins=Object.entries(C.carte.lieux).map(([id,[x,y]])=>{const e=any(id);if(!e||!vis(e))return"";const g=GAUCHE[id];
  return `<g class="pin ${e.src}${cur.has(id)?" here":""}${S.sel===id?" sel":""}" data-pin="${id}" data-x="${x}" data-y="${y}" transform="translate(${x} ${y}) scale(${k})" tabindex="0" role="button" aria-label="${esc(e.nom)}"><circle class="hit" r="16"/>${cur.has(id)?'<circle class="ring" r="12"/>':""}<circle class="dot" r="5.5"/><text x="${g?-9:9}" y="4"${g?' text-anchor="end"':""}>${esc(court(e))}</text></g>`}).join("");
 return `<svg id="map" viewBox="${mv.x} ${mv.y} ${mv.w} ${mv.h}" style="--k:${k};touch-action:${mv.w>=MW?"pan-y":"none"}" role="img" aria-label="Carte schématique du Continent">
<rect x="-50" y="-50" width="${MW+100}" height="${MH+100}" fill="var(--sea)"/>
<path class="land" d="${poly(COTE)}L${MW+60} ${MH+60}L${MW+60} -60Z"/>
${ILES.map(([x,y,rx,ry,a])=>`<ellipse class="land" cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" transform="rotate(${a} ${x} ${y})"/>`).join("")}
${FORET.map(([x,y])=>`<circle class="fo" cx="${x}" cy="${y}" r="5"/>`).join("")}
<path class="riv" d="${poly(PONTAR)}"/><path class="riv" d="${poly(YARUGA)}"/>
<path class="mt" d="${MONTS.map(([x,y])=>`M${x-6} ${y+4}L${x} ${y-5}L${x+6} ${y+4}`).join("")}"/>

${C.carte.regions.map(r=>`<text class="rg${r.mer?" mer":""}" x="${r.x}" y="${r.y}" style="font-size:calc(var(--k) * ${r.mer?12:12.5}px)">${esc(r.t)}</text>`).join("")}

function mapCard(){const e=S.sel&&any(S.sel);if(!e||!vis(e))return"";
 return `<div class="mapcard" id="mapcard"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><p class="eb" style="margin:6px 0 0">${TYPES[e.t]} · <span class="src ${e.src}">${SRC[e.src]}</span></p><button class="ic" data-act="mapclose" aria-label="Fermer">${ICO.close}</button></div><h3 class="ct">${esc(e.nom)}</h3><p class="mu sm">${esc(e.role)}</p><button class="pr" data-o="${e.id}">Ouvrir la fiche</button></div>`}
function carte(){
 const pl=Object.keys(C.carte.lieux).map(i=>any(i)).filter(e=>e&&vis(e)).sort((a,b)=>a.nom.localeCompare(b.nom,"fr"));
 const hc=C.carte.horsCarte.map(i=>ID[i]).filter(e=>e&&vis(e));
 return `<div class="mapw"><div id="mapsvg">${carteSVG()}</div><div class="mapctl"><button class="ic" data-zoom="in" aria-label="Zoomer">${ICO.plus}</button><button class="ic" data-zoom="out" aria-label="Dézoomer">${ICO.minus}</button><button class="ic" data-zoom="reset" aria-label="Voir toute la carte">${ICO.target}</button></div><div id="mapcardw">${mapCard()}</div></div>
<div class="legend"><span><i style="background:var(--bk)"></i>Livres</span><span><i style="background:var(--ac)"></i>Jeu</span><span><i style="background:var(--ink)"></i>Les deux</span><span><i style="border:2px solid var(--ac)"></i>Vous êtes ici</span></div>
<p class="mu sm">Carte schématique : les positions sont indicatives et les distances ne sont pas à l'échelle. Pincez pour zoomer, faites glisser pour vous déplacer.</p>
<h3 class="gh">Lieux de la carte<span>${pl.length}</span></h3>${pl.map(row).join("")}
${hc.length?`<h3 class="gh">Hors de la carte<span>${hc.length}</span></h3><p class="mu sm">Lieux sans position connue, ou situés dans un autre monde.</p>`+hc.map(row).join(""):""}`}
function setVB(){const s=$("#map");if(!s)return;const k=mv.w/MW;s.setAttribute("viewBox",`${mv.x} ${mv.y} ${mv.w} ${mv.h}`);s.style.setProperty("--k",k);
 s.querySelectorAll("[data-pin]").forEach(g=>g.setAttribute("transform",`translate(${g.dataset.x} ${g.dataset.y}) scale(${k})`));s.style.touchAction=mv.w>=MW?"pan-y":"none"}
function clampV(){mv.x=Math.min(Math.max(mv.x,0),MW-mv.w);mv.y=Math.min(Math.max(mv.y,0),MH-mv.h)}
function zoomAt(base,f,fx,fy){const w=Math.min(MW,Math.max(100,base.w*f)),h=w*MH/MW;mv={x:base.x+(base.w-w)*fx,y:base.y+(base.h-h)*fy,w,h};clampV();setVB()}
function selectPin(id){S.sel=id;const w=$("#mapcardw");if(w)w.innerHTML=mapCard();
 document.querySelectorAll("#map [data-pin]").forEach(g=>g.classList.toggle("sel",g.dataset.pin===id));if(id)vib(6)}
function focusPin(id){const p=C.carte.lieux[id];if(!p)return;const w=180,h=w*MH/MW;mv={x:p[0]-w/2,y:p[1]-h/2,w,h};clampV()}
function mapInit(){
 const s=$("#map");if(!s||s.dataset.ok)return;s.dataset.ok=1;
 const pts=new Map();let st=null,moved=false,downPin=null;
 const snap=()=>({mv:{...mv},pts:new Map([...pts].map(([k,v])=>[k,{...v}]))});
 s.addEventListener("pointerdown",e=>{try{s.setPointerCapture(e.pointerId)}catch(_){}pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===1){moved=false;const g=e.target.closest&&e.target.closest("[data-pin]");downPin=g?g.dataset.pin:null}st=snap()});
 s.addEventListener("pointermove",e=>{if(!pts.has(e.pointerId)||!st)return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});const r=s.getBoundingClientRect();
  if(pts.size===1&&st.pts.size===1){const a=[...st.pts.values()][0],b=[...pts.values()][0],dx=b.x-a.x,dy=b.y-a.y;
   if(Math.hypot(dx,dy)>6)moved=true;if(!moved)return;const u=st.mv.w/r.width;mv={...st.mv,x:st.mv.x-dx*u,y:st.mv.y-dy*u};clampV();setVB()}
  else if(pts.size===2&&st.pts.size===2){moved=true;const[a,b]=[...pts.values()],[a0,b0]=[...st.pts.values()];
   const f=Math.hypot(a0.x-b0.x,a0.y-b0.y)/Math.max(1,Math.hypot(a.x-b.x,a.y-b.y));
   zoomAt(st.mv,f,((a0.x+b0.x)/2-r.left)/r.width,((a0.y+b0.y)/2-r.top)/r.height)}});
 const up=e=>{if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);if(!moved&&e.type==="pointerup"&&pts.size===0)selectPin(downPin);st=pts.size?snap():null};
 s.addEventListener("pointerup",up);s.addEventListener("pointercancel",up);
 s.addEventListener("wheel",e=>{e.preventDefault();const r=s.getBoundingClientRect();zoomAt({...mv},e.deltaY>0?1.15:1/1.15,(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height)},{passive:false});
 s.addEventListener("keydown",e=>{const g=e.target.closest&&e.target.closest("[data-pin]");if(g&&(e.key==="Enter"||e.key===" ")){e.preventDefault();selectPin(g.dataset.pin)}})}

/* ---------- Livres ---------- */
function livres(){
 const seg=[["lecture","Lecture"],["contes","Contes"],["frise","Frise"],["ecrans","Écrans"]];
 return `<div class="seg" role="tablist" aria-label="Rubriques">${seg.map(([k,n])=>`<button role="tab" aria-selected="${S.lv===k}" class="${S.lv===k?"on":""}" data-lv="${k}">${n}</button>`).join("")}</div>`
  +({lecture,contes,frise,ecrans}[S.lv]||lecture)()}
function lecture(){
 const nl=BOOKS.filter(b=>S.lus[b.id]).length;
 const quand=id=>C.chapitres.filter(c=>c.lireIds.includes(id)).map(c=>c.court).concat(Object.values(C.dlc).filter(d=>d.lireIds.includes(id)).map(d=>d.nom));
 return `<p>Commencez par les deux recueils de nouvelles, puis lisez les cinq romans de la saga dans l'ordre. « La Saison des orages » se glisse où vous voulez après les nouvelles, et « La Croisée des corbeaux », une préquelle, se lit à tout moment.</p><p class="mu sm">Cochez les livres lus : leurs rebondissements s'afficheront d'eux-mêmes dans les fiches.</p>
<div class="prog"><div class="bar-p"><i style="width:${Math.round(nl/BOOKS.length*100)}%"></i></div><span>${nl} sur ${BOOKS.length} lus</span></div><ol class="books">`
 +BOOKS.map((b,i)=>{const q=quand(b.id),lu=!!S.lus[b.id];
  return `<li class="${lu?"lu":""}"><span class="num">${i+1}</span><div class="bi"><h3 class="ct"><button class="lnk" data-o="${b.id}">${esc(b.nom)}</button></h3><p class="mu sm">${esc(b.genre)} · ${esc(b.vo)}, ${b.annee}</p><p>${esc(b.resume)}</p>${q.length?`<p class="sm"><b>Idéal pendant :</b> ${esc(q.join(", "))}</p>`:""}<button class="ch${lu?" on":""}" data-lu="${b.id}" aria-pressed="${lu}">${lu?"Lu ✓":"Marquer comme lu"}</button></div></li>`}).join("")
 +`</ol><p class="mu sm">En français, la saga est publiée chez Bragelonne, et en poche chez Milady, dans la traduction de Laurence Dyèvre.</p>`}
function contes(){
 const card=s=>`<div class="srcard">${fig(s)}<p class="eb">${esc(s.origine)}</p><h3 class="ct">${esc(s.conte)}</h3><p class="mu sm">Dans le Sorceleur : ${esc(s.oeuvre)}</p><p>${esc(s.texte)}</p>${TTS?`<div class="chips">${lireBtn(s.id)}</div>`:""}${chips(s.liens)}</div>`;
 const fk=SRCS.filter(s=>s.groupe==="folklore"&&srcVis(s));
 return `<p>Sapkowski aime détourner les contes de notre enfance, et le jeu puise dans le folklore slave. Voici d'où viennent quelques-unes de leurs créatures et de leurs histoires.</p>
<h3 class="gh">Contes détournés</h3>${SRCS.filter(s=>s.groupe==="contes").map(card).join("")}
${fk.length?`<h3 class="gh">Folklore slave</h3>${fk.map(card).join("")}`:""}
<p class="mu sm">Illustrations du domaine public, issues de Wikimedia Commons. Le détail des œuvres figure dans les réglages.</p>`}
function frise(){
 const l=C.chrono.map((x,i)=>({...x,k:"f"+i})).filter(x=>!x.c||x.c<=S.ch);
 return `<p class="mu">Des origines du monde jusqu'aux jeux. Point bleu : les livres. Point ambre : les jeux.</p><div class="tl">`+l.map(x=>`<div class="ti ${x.jeu?"J":"L"}"><b>${esc(x.quand)}</b><br>${esc(x.titre)}`
  +(x.rev&&!revOK(x,x.k)?revBtn(x,x.k):`<p>${esc(x.d)}</p>`)

function ecrans(){
 return `<p class="mu">Les jeux et adaptations nés des livres de Sapkowski. Point bleu : films et séries. Point ambre : jeux.</p><div class="tl">`
  +C.ecrans.filter(x=>!x.c||x.c<=S.ch).map(x=>`<div class="ti ${x.jeu?"J":"L"}"><b>${esc(x.quand)}</b><br>${esc(x.titre)}<p>${esc(x.d)}</p></div>`).join("")+`</div>`}

/* ---------- Quiz ---------- */
function quiz(){
 const z=S.quiz;
 if(S.defi&&(!z||z.seed!==S.defi))return `<div class="card hi"><p class="eb">Défi n° ${esc(S.defi.toUpperCase())}</p><p>Un ami vous lance un défi : dix questions sur l'univers du Sorceleur, les mêmes pour tout le monde. Aucune ne dévoile la suite du jeu ni la fin des livres.</p><button class="pr wide" data-act="relever">Relever le défi</button></div><p><button class="ch" data-act="quit">Faire plutôt un quiz adapté à ma partie</button></p>`;
 if(!z)return `<p>Dix questions sur les livres, le bestiaire, les contes et la langue ancienne.</p><div class="card"><h3 class="ct">Quiz de ma partie</h3><p>Les questions s'adaptent à votre avancée dans le jeu et aux extensions commencées.</p><button class="pr wide" data-act="solo">Commencer</button></div><div class="card"><h3 class="ct">Défi entre amis</h3><p>Lancez un défi puis envoyez le lien : vos amis répondent aux mêmes questions, sans aucun spoiler pour personne.</p><button class="pr wide" data-act="defi">Lancer un défi</button></div>${S.record?`<p class="mu">Votre record : ${S.record.s} sur ${S.record.n}.</p>`:""}`;
 const n=z.qs.length,s=score(z);
 if(z.i>=n){const r=rang(s,n);
  return `<div class="card res"><p class="eb">${z.defi?"Défi n° "+esc(z.seed.toUpperCase()):"Résultat"}</p><p class="big">${s}<span> / ${n}</span></p><p class="eb">${r.t}</p><p>${r.d}</p></div><div class="row"><button class="pr" data-act="sharescore">${ICO.share}${z.defi?"Envoyer le défi":"Partager mon score"}</button><button class="ch" data-act="again">Rejouer</button></div>`
   +`<h3>Récapitulatif</h3><ol class="recap">`+z.qs.map((q,i)=>`<li class="${z.ans[i]===q.ok?"ok":"ko"}">${esc(q.q)}<br><span class="mu">${esc(q.opts[q.ok])}</span></li>`).join("")+`</ol>`}
 const q=z.qs[z.i],a=z.ans[z.i];
 return `${z.defi?`<p class="eb">Défi n° ${esc(z.seed.toUpperCase())}</p>`:""}<div class="prog"><div class="bar-p"><i style="width:${Math.round((z.i+(a!=null?1:0))/n*100)}%"></i></div><span>${z.i+1} / ${n} · ${pl(s,"point")}</span></div><p class="qq">${esc(q.q)}</p>${opts(q,a,"qa")}`
  +(a!=null?feedback(q,a)+`<p><button class="pr wide" data-act="next">${z.i+1<n?"Question suivante":"Voir mon score"}</button></p>`:"")
  +`<p><button class="ch" data-act="quit">Abandonner</button></p>`}

const cur=()=>{try{return decodeURIComponent(location.hash.slice(1))}catch(e){return""}};

function parse(t){
 const from=S.tab;S.id=null;S.page=null;S.defi=null;
 if(own(SEGS,t)){S.tab="livres";S.lv=t}
 else if(t==="livres"){S.tab="livres";S.lv="lecture"}
 else if(TABK.includes(t))S.tab=t;
 else if(own(PAGES,t)){S.page=t;if(PAGES[t])S.tab=PAGES[t]}
 else if(/^defi-[a-z0-9]{3,12}$/.test(t)){S.page="quiz";S.tab="partie";S.defi=t.slice(5)}
 else if(ID[t]){S.id=t;S.tab=ID[t].t==="livre"?"livres":ID[t].t==="lieu"&&from==="carte"?"carte":"codex"}
 else if(MID[t]){S.id=t;S.tab="bestiaire"}
 else S.tab="partie";
 if(S.id&&(vis(any(S.id))||S.force[S.id])){S.hist=[S.id,...S.hist.filter(i=>i!==S.id)].slice(0,12);save()}}
let prof=0;
function route(){
 const t=cur()||"partie",prevRoot=isRoot(trail[trail.length-1]||"partie");
 /* Chaque entrée d'historique porte sa profondeur : revenir à une entrée moins profonde est un retour. */
 const st=history.state,n=st&&typeof st.n==="number"?st.n:null;let popped=false;
 if(n==null){prof++;try{history.replaceState({...(st||{}),n:prof},"")}catch(e){}}else{popped=n<prof;prof=n}
 if(isRoot(t))trail=[t];
 else if(popped){if(trail.length>1&&trail[trail.length-2]===t)trail.pop();else trail=[t]}
 else if(trail[trail.length-1]!==t)trail.push(t);
 parse(t);
 const nav=!first;
 const apply=()=>{render();scrollTo(0,popped||isRoot(t)?mem[t]||0:0);if(nav){const h=$("#bar h1");if(h){h.tabIndex=-1;h.focus({preventScroll:true})}}};
 if(!first&&document.startViewTransition&&!calme()){document.documentElement.dataset.nav=popped?"pop":isRoot(t)&&prevRoot?"tab":"push";document.startViewTransition(apply)}
 else apply();
 first=false}
addEventListener("hashchange",ev=>{try{mem[decodeURIComponent(new URL(ev.oldURL).hash.slice(1))||"partie"]=scrollY}catch(e){}route()});

 addEventListener("touchstart",e=>{const t=e.touches[0];swipe=e.touches.length===1&&t.clientX<24&&(S.id||S.page)?{x:t.clientX,y:t.clientY}:null},{passive:true});

async function ask(){

 const top=(l,f,k)=>l.map(x=>[f(x),x]).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]).slice(0,k).map(x=>x[1]);
 const ce=top(E.filter(vis),e=>sc([e.nom,...(e.alias||[]),e.role,e.resume].join(" "),e.nom),8).map(e=>[`## ${e.nom} (${e.role})`,e.resume,e.livres||"",e.rev&&revOK(e)?e.rev:"",(e.jeu||[]).filter(jv).map(l=>l.t).join(" ")].filter(Boolean).join("\n"));
 const cm=top(M.filter(vis),m=>sc([m.nom,m.en||"",m.cl].join(" "),m.nom),3).map(m=>[`## ${m.nom} (bestiaire, ${m.cl})`,"Conseil du jeu : "+m.conseil,m.livres||"",m.origine||""].filter(Boolean).join("\n"));
 const cw=top(C.lexique,x=>sc(x.mot+" "+x.sens,x.mot),4).map(x=>`- ${x.mot} : ${x.sens}. ${x.note}`);
 const ctx=[...ce,...cm,...(cw.length?["## Langue ancienne\n"+cw.join("\n")]:[])].join("\n\n");
 const ext=[S.hos&&"Hearts of Stone",S.bw&&"Blood and Wine"].filter(Boolean).join(" et ")||"aucune";
 const lus=BOOKS.filter(b=>S.lus[b.id]).map(b=>"« "+b.nom+" »").join(", ")||"aucun";
 const prompt=`Tu es le compagnon d'un joueur de The Witcher 3: Wild Hunt et un expert des livres d'Andrzej Sapkowski (saga du Sorceleur). Réponds en français, en 8 phrases au plus, sans titres ni listes à puces, en distinguant ce qui vient des livres de ce qui vient des jeux. Si tu n'es pas sûr d'un détail, dis-le au lieu d'inventer.

Notes du codex :
${ctx||"(aucune fiche pertinente)"}

Question : ${q}`;
 if(!SM){try{S.ask.out=await askNano(prompt,ctl.signal)}catch(e){S.ask.out=e&&e.name==="AbortError"?S.ask.out:"Le modèle de votre téléphone n'a pas pu répondre. Réessayez, ou posez une question plus courte."}finally{S.ask.busy=false;set();if(S.page==="demander")render()}return}
 try{
  const r=await SM(prompt,{signal:ctl.signal,onText:({text})=>{S.ask.out=text;const o=$("#out");if(o)o.textContent=text}});
  S.ask.out=r.text+(r.truncated?"\n\n(Réponse tronquée : posez une question plus ciblée.)":"");
 }catch(e){
  const m={not_granted:"Autorisation refusée : la question ne peut pas être posée ici.",sampling_disabled:"Cette fonction n'est pas disponible pour votre compte.",rate_limited:"Trop de questions d'affilée, ou limite d'usage atteinte. Réessayez un peu plus tard.",session_expired:"Votre session a expiré : reconnectez-vous à Claude, puis réessayez.",refused:"Claude n'a pas voulu répondre à cette question. Essayez de la formuler autrement."};
  S.ask.out=e&&e.code==="refused"?m.refused:((e&&e.text)||"")+(e&&e.code==="cancelled"?"":((e&&e.text)?"\n\n":"")+(m[e&&e.code]||"La réponse n'a pas abouti. Vous pouvez réessayer."));
